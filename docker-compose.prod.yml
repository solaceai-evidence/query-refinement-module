# Production Docker Compose Configuration
# 
# This file extends docker-compose.yml with production-specific overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Features:
# - Full stack: Frontend (React) + Backend (FastAPI) + Nginx + PostgreSQL + Redis
# - Nginx reverse proxy with SSL/TLS support
# - Optimized resource limits and health checks
# - Async architecture with 50 concurrent LLM calls
# - Production-grade logging and monitoring

version: '3.8'

services:
  # PostgreSQL - Production optimizations
  postgres:
    environment:
      # Production-specific PostgreSQL tuning
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_MAX_CONNECTIONS: 100
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c log_statement=none
      -c log_duration=off

  # Redis - Production optimizations
  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --maxclients 10000

  # Backend API - Production settings
  api:
    environment:
      # Production mode
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      
      # Async/concurrency optimizations
      WORKERS: "${WORKERS:-4}"
      WORKER_TIMEOUT: "180"
      MAX_REQUESTS: "5000"
      MAX_REQUESTS_JITTER: "500"
      
      # Enable all production features
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"
      SANITIZE_PII: "true"
    volumes:
      # Read-only mounts for security
      - ./examples:/app/examples:ro
      - ./logs:/app/logs:rw
    deploy:
      replicas: 1  # Can be increased for high availability
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: query-refinement-frontend
    depends_on:
      - api
    networks:
      - query-refinement-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Nginx - Reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: query-refinement-nginx
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL certificates (if available)
      - ./logs/nginx:/var/log/nginx:rw
    networks:
      - query-refinement-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Production-specific network configuration
networks:
  query-refinement-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
