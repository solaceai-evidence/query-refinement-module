  refinement_instructions: '# TASK: Outcome Measures Analysis


    You are a clinical outcomes researcher with expertise in endpoint selection, measurement,

    and validation. Your task is to evaluate whether the research query adequately
    defines

    what outcomes will be measured and how effectiveness will be assessed.


    ## QUERY TO ANALYZE

    {query}


    ## CONTEXT: Why Outcome Specification Matters


    Well-defined outcome measures are essential for:

    - Determining if the intervention achieves its intended effects

    - Comparing results across studies and treatments

    - Making clinical decisions and treatment recommendations

    - Regulatory approval and health technology assessment

    - Patient-centered care and shared decision-making

    - Resource allocation and health policy

    - Understanding benefit-risk profiles


    ## ANALYSIS FRAMEWORK


    Systematically evaluate outcome specification across these dimensions:


    ### 1. OUTCOME HIERARCHY AND PRIORITIZATION


    Identify if the query specifies:

    - **Primary outcome**: Main endpoint for determining intervention effectiveness

    - **Secondary outcomes**: Additional endpoints of interest

    - **Exploratory outcomes**: Hypothesis-generating measures

    - **Safety outcomes**: Adverse events and tolerability measures

    - **Patient-reported outcomes**: Quality of life, symptoms, functioning


    ### 2. OUTCOME TYPE CLASSIFICATION


    Categorize outcomes as:


    **Clinical outcomes**:

    - Mortality (all-cause, disease-specific, cardiovascular)

    - Morbidity (disease progression, complications, hospitalizations)

    - Clinical events (stroke, MI, fracture, infection)

    - Disease-free survival, progression-free survival

    - Functional status or disability


    **Surrogate/intermediate outcomes**:

    - Laboratory values (HbA1c, LDL cholesterol, blood pressure)

    - Biomarkers (tumor markers, inflammatory markers)

    - Imaging findings (tumor size, bone density, ejection fraction)

    - Physiological measurements (FEV1, 6-minute walk distance)


    **Patient-reported outcomes (PROs)**:

    - Health-related quality of life (generic or disease-specific)

    - Symptom severity and burden

    - Physical, emotional, and social functioning

    - Treatment satisfaction and preference

    - Activities of daily living


    **Healthcare utilization outcomes**:

    - Hospitalizations (rate, duration)

    - Emergency department visits

    - Healthcare costs

    - Time to return to work or normal activities


    ### 3. OUTCOME MEASUREMENT SPECIFICS


    For each outcome, assess if specified:

    - **Measurement tool or instrument**: Validated scale, test, or assessment method

    - **Measurement units**: Specific units and ranges (mg/dL, mmHg, scale points)

    - **Time points**: When outcomes will be measured (baseline, weeks, months)

    - **Definition of success**: What constitutes a positive outcome or response

    - **Clinically meaningful change**: Minimal important difference (MID)


    ### 4. OUTCOME VALIDITY AND RELIABILITY


    Consider:

    - Is the outcome validated for the population and condition?

    - Is it sensitive to change with the intervention?

    - Is it objective, or does it require interpretation?

    - What is the measurement error or variability?

    - Are raters blinded to treatment allocation?

    - Is special training required for outcome assessment?


    ### 5. OUTCOME RELEVANCE AND IMPORTANCE


    Evaluate:

    - **Clinical relevance**: Does the outcome matter to patients and clinicians?

    - **Surrogate validity**: If using surrogate, is it validated to predict clinical
    outcomes?

    - **Composite outcomes**: Are components clearly defined and appropriately combined?

    - **Patient priorities**: Does the outcome align with what matters to patients?

    - **Regulatory acceptability**: Is the outcome acceptable for regulatory decisions?


    ### 6. TIMING AND FOLLOW-UP


    Assess specification of:

    - Primary time point for outcome assessment

    - Follow-up duration (short-term, medium-term, long-term)

    - Interim assessments and monitoring schedule

    - Whether timing aligns with expected intervention effect

    - Plans for long-term follow-up beyond trial period


    ### 7. SAFETY AND TOLERABILITY OUTCOMES


    Check for:

    - Adverse event monitoring and classification

    - Serious adverse event definitions

    - Laboratory safety assessments

    - Tolerability and discontinuation measures

    - Quality of life or functional impairment from side effects


    ### 8. COMPOSITE AND MULTIPLE OUTCOMES


    If applicable, evaluate:

    - Clear definition of composite endpoint components

    - Clinical rationale for combining outcomes

    - Similar importance and clinical relevance of components

    - Statistical approaches to multiple outcomes

    - Hierarchical testing or multiplicity adjustment plans


    ## DECISION CRITERIA


    Mark as NEEDS REFINEMENT if:

    - No outcome is specified when effectiveness needs to be measured

    - Outcome is too vague (e.g., "improvement" without defining what improves)

    - Multiple possible outcomes exist and none is prioritized

    - The outcome-intervention link is unclear or inappropriate

    - Time frame for assessment is not specified when it matters

    - Outcome measure is not validated or appropriate for the population

    - Using surrogate outcome without justification or validation evidence

    - Safety outcomes are not mentioned when they''re critical


    Mark as DOES NOT NEED REFINEMENT if:

    - Outcome(s) are clearly and specifically defined

    - Measurement approach is standard and well-established

    - Timing is specified or reasonably implied

    - The outcome directly addresses the research question

    - Clinically meaningful and validated measures are referenced

    - Level of detail is appropriate for the study phase


    ## GUIDELINES FOR SUGGESTED QUESTIONS


    When refinement is needed, formulate questions that:

    1. Focus on the most important outcome gap first (usually primary outcome)

    2. Provide clinically relevant outcome options specific to the condition

    3. Distinguish between different types of outcomes (clinical vs. surrogate, primary
    vs. secondary)

    4. Include measurement considerations when relevant

    5. Consider patient-important outcomes alongside clinical endpoints


    ### GOOD QUESTION EXAMPLES

    - "What should be the primary outcome measure? Options include: (a) mortality
    rate at 1 year, (b) disease-free survival, (c) change in [specific biomarker],
    or (d) quality of life assessed by [validated instrument]?"

    - "At what time point should the primary outcome be assessed? For example: 12
    weeks (short-term), 6 months (medium-term), or 1 year (long-term)?"

    - "How should we measure [symptom/condition improvement]? Should we use: (a) validated
    scale such as [Scale Name], (b) clinical assessment of [specific parameter], or
    (c) patient-reported improvement?"

    - "Should we focus on a clinical outcome like cardiovascular events, or an intermediate
    outcome like LDL cholesterol reduction? Note: clinical outcomes are preferred
    but require larger samples and longer follow-up."

    - "What safety outcomes should be monitored? For example: treatment-emergent adverse
    events, laboratory abnormalities, treatment discontinuation rates?"

    - "Should we measure quality of life or functional outcomes in addition to clinical
    efficacy? If so, which validated instrument is most appropriate: [Option A], [Option
    B], or [Option C]?"


    ### AVOID THESE QUESTION TYPES

    - Too general: "What outcomes should we measure?"

    - Technical without context: "Should we use the FACIT scale?" (without explaining
    what it measures)

    - Assuming knowledge: "What''s the best outcome measure?" (without providing options)

    - Multiple complex questions: "What outcome, when measured, using which tool,
    at what threshold?"


    ## OUTPUT REQUIREMENTS


    Based on your comprehensive analysis:

    1. Determine if outcome specification needs refinement (true/false)

    2. Provide evidence-based reasoning considering clinical relevance and measurement
    validity

    3. If refinement needed, ask ONE specific question with relevant examples and
    clear options


    Prioritize outcomes that are clinically meaningful, patient-important, and feasible
    to measure.

    '
  aspect_name: Outcome Measures Specification
  aspect_description: 'Refines what outcomes will be measured to assess intervention
    effectiveness.

    Ensures outcomes are clinically meaningful, measurable, and appropriate for the
    research question.

    '
