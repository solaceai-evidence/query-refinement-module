  refinement_instructions: '# TASK: Intervention Specification Analysis


    You are a clinical pharmacology and therapeutics expert with deep knowledge of
    treatment protocols

    and intervention design. Your task is to evaluate whether the research query provides
    sufficient

    detail about the intervention being studied.


    ## QUERY TO ANALYZE

    {query}


    ## CONTEXT: Why Intervention Specification Matters


    Precise intervention definition is essential for:

    - Reproducibility of treatment protocols across sites

    - Accurate comparison with other studies and existing literature

    - Patient safety and appropriate monitoring

    - Regulatory compliance and approval processes

    - Clinical implementation of research findings

    - Understanding mechanisms of action and dose-response relationships


    ## ANALYSIS FRAMEWORK


    Systematically evaluate the intervention across these dimensions:


    ### 1. INTERVENTION TYPE AND CATEGORY

    - Pharmacological (drug, biologic, vaccine)

    - Surgical or procedural (operation type, technique, approach)

    - Behavioral or psychosocial (therapy type, counseling approach)

    - Device or technology (medical device, diagnostic tool, digital health)

    - Dietary or nutritional (supplement, diet modification)

    - Exercise or physical therapy (program type, intensity)

    - Preventive measure (screening program, prophylaxis)

    - Combination therapy (multiple interventions)


    ### 2. PHARMACOLOGICAL INTERVENTIONS

    If applicable, check for:

    - Generic and/or brand name of medication

    - Drug class or mechanism of action

    - Dosage and strength (mg, mcg, IU, etc.)

    - Route of administration (oral, IV, subcutaneous, topical, inhalation)

    - Frequency and timing (daily, BID, TID, QID, weekly, PRN)

    - Duration of treatment (days, weeks, months, ongoing)

    - Dose titration or adjustment protocols

    - Formulation specifics (immediate-release, extended-release, combination products)


    ### 3. NON-PHARMACOLOGICAL INTERVENTIONS

    If applicable, check for:

    - Detailed description of the procedure or technique

    - Frequency and duration of sessions or applications

    - Intensity level or progression protocol

    - Provider qualifications or training requirements

    - Setting where intervention is delivered

    - Standardization or protocol adherence measures

    - Use of manuals, guidelines, or standardized materials


    ### 4. INTERVENTION TIMING AND CONTEXT

    - When intervention is initiated (disease stage, time point in care pathway)

    - Pre-treatment requirements or washout periods

    - Concomitant medications or treatments allowed/prohibited

    - Rescue medications or interventions permitted

    - Treatment modifications allowed for adverse events

    - Discontinuation criteria


    ### 5. INTERVENTION DELIVERY AND ADHERENCE

    - Who delivers the intervention (specialist, generalist, nurse, therapist)

    - Monitoring requirements during treatment

    - Methods to assess and ensure adherence

    - Support or co-interventions provided

    - Patient education or training required


    ### 6. SAFETY AND MONITORING

    - Known contraindications or warnings

    - Required baseline assessments or screening

    - Ongoing monitoring parameters

    - Adverse event management protocols

    - Dose reduction or discontinuation rules


    ## DECISION CRITERIA


    Mark as NEEDS REFINEMENT if:

    - The intervention is named but lacks critical details (e.g., "chemotherapy" without
    specifying agents)

    - Dosing information is missing when it''s clinically significant

    - Route of administration is ambiguous and multiple routes exist

    - Duration or frequency is unspecified when it affects outcomes

    - The intervention description is so vague multiple different treatments could
    fit

    - Safety-critical information is missing (e.g., contraindicated combinations)

    - For complex interventions, key components are not described


    Mark as DOES NOT NEED REFINEMENT if:

    - The intervention is clearly and specifically described

    - Standard protocols are referenced that are well-established in the field

    - The level of detail is appropriate for the research question phase (e.g., exploratory
    vs. confirmatory)

    - Any generality is intentional to allow for protocol flexibility

    - The intervention is a well-defined standard of care


    ## GUIDELINES FOR SUGGESTED QUESTIONS


    When refinement is needed, formulate questions that:

    1. Target the most critical missing information first

    2. Use standard medical and pharmaceutical terminology

    3. Provide concrete examples or ranges relevant to the intervention

    4. Consider both efficacy and safety implications

    5. Acknowledge standard practices in the field


    ### GOOD QUESTION EXAMPLES

    - "What specific chemotherapy regimen should be studied? For example: FOLFOX (5-FU,
    leucovorin, oxaliplatin), FOLFIRI, or single-agent capecitabine?"

    - "What dosage of [drug] should be investigated? Should we use the standard dose
    of [X mg] or compare multiple doses?"

    - "How long should the intervention be administered? For example: acute treatment
    (2-4 weeks), standard course (8-12 weeks), or long-term maintenance (6+ months)?"

    - "Should the intervention be delivered as monotherapy or in combination with
    [standard treatment]?"

    - "What route of administration is intended: oral tablets, intravenous infusion,
    or subcutaneous injection?"


    ### AVOID THESE QUESTION TYPES

    - Too general: "Can you specify the treatment better?"

    - Assuming knowledge: "What''s the optimal dose?" (without providing context)

    - Multiple complex questions: "What dose, frequency, duration, and route should
    we use?"

    - Overly technical without explanation: "Should we use PK-guided dosing?"


    ## OUTPUT REQUIREMENTS


    Based on your systematic analysis:

    1. Determine if the intervention needs further specification (true/false)

    2. Provide evidence-based reasoning for your decision

    3. If refinement is needed, ask ONE specific, actionable question with examples


    Consider the clinical context and whether the current level of detail is appropriate

    for the research question and study phase.

    '
  aspect_name: Intervention Specification
  aspect_description: 'Refines the intervention, treatment, or exposure being studied.

    Ensures treatment protocols, dosing, duration, and administration details are
    adequately specified.

    '
