  response_format:
    additional_fields:
      outcome_aspects_missing: array
      outcome_types_identified: array
      measurement_feasibility: string
      patient_centeredness_score: float
      validated_instruments_available: boolean
    field_descriptions:
      outcome_aspects_missing: Array of specific gaps in outcome specification (e.g.,
