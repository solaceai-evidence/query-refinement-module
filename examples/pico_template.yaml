  refinement_instructions: '# TASK: Comparison/Control Group Analysis


    You are a clinical research methodologist specializing in comparative effectiveness
    research

    and study design. Your task is to assess whether the research query adequately
    defines what

    the intervention is being compared against.


    ## QUERY TO ANALYZE

    {query}


    ## CONTEXT: Why Comparison Specification Matters


    A well-defined comparison is crucial for:

    - Establishing causality and attributing effects to the intervention

    - Understanding relative effectiveness and clinical value

    - Making evidence-based treatment decisions

    - Ensuring ethical study design (appropriate use of placebo vs. active controls)

    - Regulatory approval and reimbursement decisions

    - Meta-analyses and systematic reviews


    ## ANALYSIS FRAMEWORK


    Evaluate the comparison group specification across these dimensions:


    ### 1. TYPE OF COMPARISON


    Identify if the study involves:

    - **Placebo control**: Inert substance or sham procedure

    - **No treatment/usual care**: Observation without intervention

    - **Active control**: Standard treatment or established therapy

    - **Dose comparison**: Different doses of the same intervention

    - **Head-to-head comparison**: Two or more active interventions

    - **Historical control**: Comparison to previous data or cohorts

    - **Self-controlled/crossover**: Participants serve as their own control

    - **Multiple comparisons**: More than two arms


    ### 2. APPROPRIATENESS OF COMPARISON


    Assess if the comparison:

    - Is ethically justified (e.g., placebo appropriate when no standard treatment
    exists)

    - Represents current standard of care or clinically relevant alternative

    - Is feasible and practical to implement

    - Provides clinically meaningful information

    - Aligns with regulatory expectations for the condition

    - Addresses the key clinical question (superiority, non-inferiority, equivalence)


    ### 3. COMPARISON GROUP SPECIFICATIONS


    For placebo controls, check:

    - Physical characteristics matching the intervention

    - Administration schedule and route

    - Blinding procedures

    - Use of placebo + standard care vs. placebo alone


    For active controls, check:

    - Specific name and description of comparator treatment

    - Dosage, route, frequency, and duration

    - Whether it represents optimal or standard dosing

    - Evidence base supporting choice of comparator

    - Concomitant treatments allowed in comparison group


    For usual care/standard of care, check:

    - Definition of what constitutes "usual care"

    - Variability expected across sites or providers

    - Documentation or standardization requirements

    - Whether it includes access to rescue treatments


    ### 4. TRIAL DESIGN IMPLICATIONS


    Consider:

    - **Superiority trial**: Proving new treatment is better than control

    - **Non-inferiority trial**: Proving new treatment is not worse by meaningful
    margin

    - **Equivalence trial**: Proving treatments are similarly effective

    - Study objective alignment with comparison choice

    - Statistical power and sample size implications


    ### 5. BLINDING AND BIAS CONSIDERATIONS


    Evaluate:

    - Whether comparison allows for blinding (single, double, triple-blind)

    - Potential for performance or detection bias

    - Need for sham procedures or matching interventions

    - Strategies to minimize differential treatment bias


    ### 6. ETHICAL CONSIDERATIONS


    Assess:

    - Equipoise: Genuine uncertainty about which treatment is better

    - Risk-benefit balance for participants in comparison group

    - Justification for withholding standard treatment (if applicable)

    - Availability of rescue medications or early stopping rules

    - Informed consent implications


    ## DECISION CRITERIA


    Mark as NEEDS REFINEMENT if:

    - No comparison is mentioned when one is implied or necessary

    - "Placebo" is mentioned without clarifying if standard care is also provided

    - "Standard treatment" is referenced without specifying what it is

    - The comparison is ethically questionable and not justified

    - Multiple potential comparisons exist and none is specified

    - The comparison group intervention lacks sufficient detail

    - It''s unclear if the comparison matches the research objective (superiority
    vs. non-inferiority)


    Mark as DOES NOT NEED REFINEMENT if:

    - The comparison is clearly specified and appropriate

    - For exploratory studies, lack of comparison is justified

    - The comparison choice is standard and well-established for the condition

    - Sufficient detail is provided for reproducibility

    - Ethical considerations are adequately addressed by the description


    ## GUIDELINES FOR SUGGESTED QUESTIONS


    When refinement is needed, craft questions that:

    1. Clarify the fundamental comparison type first

    2. Address ethical considerations sensitively

    3. Provide clinically relevant options based on the condition

    4. Consider regulatory and practical constraints

    5. Link comparison choice to study objectives


    ### GOOD QUESTION EXAMPLES

    - "What should the intervention be compared against? Options include: (a) placebo
    plus standard care, (b) active control with [standard treatment], (c) usual care
    without placebo, or (d) head-to-head comparison with [alternative treatment]."

    - "For the placebo control, should participants also receive standard background
    therapy, or will placebo be used alone? (Note: placebo alone may raise ethical
    concerns if effective standard treatment exists.)"

    - "What specific standard treatment should serve as the active comparator? For
    example: [Treatment A at X mg dose] or [Treatment B at Y mg dose]?"

    - "Is this a superiority trial (showing new treatment is better) or a non-inferiority
    trial (showing new treatment is not meaningfully worse)? This affects the appropriate
    comparison choice."

    - "Should we include a three-arm design comparing [Intervention] vs. [Active control]
    vs. [Placebo], or a simpler two-arm design?"


    ### AVOID THESE QUESTION TYPES

    - Too vague: "What''s the control group?"

    - Assuming specifics: "What dose of the comparator drug?" (when drug itself not
    specified)

    - Ethically insensitive: "Should we use placebo even though standard treatment
    exists?"

    - Overly complex: Multiple questions about different aspects at once


    ## OUTPUT REQUIREMENTS


    Based on your analysis:

    1. Determine if comparison specification needs refinement (true/false)

    2. Provide clear reasoning based on clinical, ethical, and methodological considerations

    3. If refinement needed, ask ONE focused question with relevant examples and context


    Balance scientific rigor with ethical standards and practical feasibility.

    '
  aspect_name: Comparison/Control Specification
  aspect_description: 'Refines what the intervention is being compared against (comparator,
    control group, or alternative treatment).

    Ensures the comparison is appropriate, clearly defined, and clinically meaningful.

    '
