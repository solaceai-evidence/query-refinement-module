- id: population_refinement
  response_format:
    additional_fields:
      population_aspects_missing: array
      clinical_relevance_score: float
      suggested_specifications: array
    field_descriptions:
      population_aspects_missing: Array of population dimension categories needing
        clarification (e.g., age_range, disease_stage, comorbidities)
      clinical_relevance_score: Criticality score where 1.0 = essential for study
        validity, 0.5 = improves clarity, 0.0 = optional
      suggested_specifications: Array of concrete examples or options for population
        characteristics (e.g., pediatric 0-18 years, adult 18-65 years)
  allow_follow_up: true
  max_follow_ups: 3
  metadata:
    domain: clinical_research
    framework: PICO
    priority: critical
    medical_specialty:
    - general
    - epidemiology
    - clinical_trials
  refinement_instructions: "# TASK: Population/Patient Specification Analysis\n\n\
    You are a clinical research expert specializing in study design and patient population\
    \ definition.\nYour task is to analyze whether the following research query adequately\
    \ specifies the target \npopulation or if additional clarification is needed.\n\
    \n## QUERY TO ANALYZE\n{query}\n\n## CONTEXT: Why Population Specification Matters\n\
    \nClear population definition is critical for:\n- Study reproducibility and generalizability\n\
    - Appropriate patient recruitment and enrollment\n- Accurate interpretation of\
    \ research findings\n- Comparison across different studies\n- Ethical considerations\
    \ in research conduct\n\n## ANALYSIS FRAMEWORK\n\nEvaluate the query for the following\
    \ population characteristics:\n\n### 1. DEMOGRAPHIC CHARACTERISTICS\n- Age range\
    \ or age groups (pediatric, adult, elderly, specific age ranges)\n- Gender/sex\
    \ (male, female, both, gender-specific conditions)\n- Ethnicity or racial groups\
    \ (if relevant to the condition or treatment)\n- Geographic location (if disease\
    \ prevalence or treatment access varies by region)\n\n### 2. CLINICAL CHARACTERISTICS\n\
    - Primary diagnosis or health condition\n- Disease stage or severity (early, advanced,\
    \ acute, chronic)\n- Comorbidities or concurrent conditions\n- Previous treatments\
    \ or medical history\n- Baseline health status or functional capacity\n\n### 3.\
    \ INCLUSION/EXCLUSION CRITERIA\n- Specific biomarkers, test results, or diagnostic\
    \ criteria\n- Treatment history (treatment-naive, treatment-resistant, etc.)\n\
    - Contraindications or risk factors to exclude\n- Minimum symptom duration or\
    \ disease progression\n\n### 4. SPECIAL POPULATIONS (if applicable)\n- Pregnant\
    \ or breastfeeding women\n- Immunocompromised patients\n- Patients with organ\
    \ dysfunction (renal, hepatic, cardiac)\n- Vulnerable populations (prisoners,\
    \ institutionalized individuals)\n\n### 5. SAMPLE SIZE AND SETTING\n- Expected\
    \ or required sample size characteristics\n- Clinical setting (primary care, hospital,\
    \ ICU, outpatient, community)\n- Recruitment source (single-center, multi-center,\
    \ population-based)\n\n## DECISION CRITERIA\n\nMark as NEEDS REFINEMENT if:\n\
    - Age range is completely unspecified when age is clinically relevant\n- The health\
    \ condition lacks specificity (e.g., \"patients with cancer\" without specifying\
    \ cancer type)\n- Disease severity or stage is ambiguous when treatment effects\
    \ may differ by stage\n- Critical exclusion criteria are missing that could affect\
    \ safety or results\n- The population description is so broad it's unclear who\
    \ would be enrolled\n- Special population considerations are ignored when they're\
    \ likely relevant\n\nMark as DOES NOT NEED REFINEMENT if:\n- The population is\
    \ sufficiently specified for the research question\n- Demographic and clinical\
    \ characteristics are clearly stated or reasonably implicit\n- The level of detail\
    \ is appropriate for the study phase or type\n- Any ambiguity is intentional for\
    \ broader applicability\n\n## GUIDELINES FOR SUGGESTED QUESTIONS\n\nWhen refinement\
    \ is needed, craft questions that:\n1. Focus on ONE specific aspect of the population\
    \ definition\n2. Use clinical terminology appropriate to the domain\n3. Provide\
    \ examples or options to guide the user's response\n4. Are specific enough to\
    \ be actionable but not overly restrictive\n5. Consider clinical relevance and\
    \ practical feasibility\n\n### GOOD QUESTION EXAMPLES\n- \"What age range should\
    \ we focus on? For example: pediatric (0-18 years), adult (18-65 years), elderly\
    \ (>65 years), or a specific age range?\"\n- \"Should we include patients at all\
    \ disease stages, or focus on specific stages such as early-stage (Stage I-II)\
    \ or advanced (Stage III-IV)?\"\n- \"Are there important comorbidities to exclude?\
    \ For example, should we exclude patients with severe renal impairment (eGFR <30\
    \ mL/min/1.73m²)?\"\n- \"Should the study include both treatment-naive patients\
    \ and those with prior therapy, or focus on one group?\"\n\n### AVOID THESE QUESTION\
    \ TYPES\n- Overly broad: \"Can you describe the population better?\"\n- Multiple\
    \ questions at once: \"What age, gender, and disease stage should we use?\"\n\
    - Too technical without context: \"What should the CD4 count threshold be?\"\n\
    - Leading questions that assume specificity is needed: \"Shouldn't we narrow the\
    \ age range?\"\n\n## OUTPUT REQUIREMENTS\n\nBased on your analysis, you must determine:\n\
    1. Does this dimension need refinement? (true/false)\n2. What is your reasoning?\
    \ (brief, evidence-based explanation)\n3. If refinement is needed, what specific\
    \ question should be asked?\n\nConsider the query holistically and the intended\
    \ scope of the research question.\n"
  aspect_name: Population/Patient Specification
  aspect_description: 'Refines the target population or patient group for the clinical
    research query.

    Ensures demographic characteristics, conditions, and inclusion/exclusion criteria
    are clearly defined.

    '
- id: intervention_refinement
  response_format:
    additional_fields:
      intervention_aspects_missing: array
      intervention_type: string
      safety_criticality: string
      standard_protocols_available: boolean
    field_descriptions:
      intervention_aspects_missing: Array of specific intervention dimensions requiring
        clarification (e.g., dosage, duration, route_of_administration)
      intervention_type: Primary category of intervention detected in the query (e.g.,
        pharmacological, surgical, behavioral, device)
      safety_criticality: How critical the missing information is for patient safety
        (high, medium, low)
      standard_protocols_available: True if well-established protocols exist that
        might be assumed
  allow_follow_up: true
  max_follow_ups: 3
