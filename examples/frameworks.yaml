mph_dissertation:
  - user_context:
    user_type: "MPH student"
    context: "Early-stage dissertation conceptualization. MPH Student is exploring potential research topics for their Master of Public Health capstone/dissertation. They need help refining vague ideas into researchable questions with appropriate scope for a 6-12 month project."
    tone: "educational" # (educational, professional, pragmatic)
    complexity: "intermediate" # (novice, intermediate, advanced, expert)
    examples_from: "public health"
    constraints:
      - "Timeline: 6-12 months for completion"
      - "Resources: Limited to publicly available data, literature review, or small-scale surveys"
      - "Skills: Basic epidemiology/statistics, literature review, possibly qualitative methods"
      - "Access: Typically no Institutional Review Board (IRB) approval for human subjects until proposal stage"
    pitfalls:
      - "Scope too broad for Master's project"
      - "Proposing complex interventions without implementation feasibility"
      - "Focusing on rare diseases with limited literature"
      - "Missing population or outcome specificity"
      - "Overly ambitious data collection plans"
      - "Confusing descriptive vs. analytical epidemiology"
      - "Not considering health equity dimensions"
  - id: mph_research_domain
    aspect_name: "MPH research domain"
    aspect_description: the public health topic or health issue under investigation
    evaluation_criteria: |
      ### STRONG domain
      - Specific health issue or public health topic identified
      - Appropriately scoped for dissertation research (not entire fields like "epidemiology" or hyper-niche like "medication errors in one hospital ward")
      - Recognized public health relevance (connects to disease burden, health equity, health systems, prevention)
      - Feasible to study in 6-12 months

      ### WEAK domain
      - Too broad ("public health", "health promotion", "communicable diseases")
      - Too narrow (hyper-specific sub-issues with minimal literature)
      - Vague (undefined health area)
      - Multiple unrelated topics bundled together
      - No domain identified (just methods or settings)

      ### Context dependencies
      - **specialization fit**: "Epidemiology students → lean toward disease/risk factor topics; Health policy students → lean toward systems/policy topics"
      - **LMIC:** "For global health students focusing on LMICs, accept domains where grey literature predominates"
      - **emerging topics:** "For cutting-edge areas (digital health, climate change), accept broader scopes if justified (ensure foundational literature exists)"
    response_strategies:
      - If too broad: "[Domain] covers a lot of ground. Which specific health issue interests you? For example: [list 3-4 specific topics within that domain]"
      - If vague: "Can you specify which health issue or topic you want to focus on? Such as: [list 3-4 concrete health topics]"
      - If too narrow: "This is quite specialized. Would you consider: [list 2-3 broader alternatives that maintain their interest]? This gives you more literature while staying focused."
    examples:
      clear:
        - statement: childhood obesity
          rationale: Specific health condition, defined life stage, major public health issue with clear boundaries and established literature
        - statement: vaccine hesitancy
          rationale: Distinct health behavior, established public health significance, clear boundaries
        - statement: air pollution and respiratory health
          rationale: Clear environmental exposure, specific health domain affected, established field
        - statement: antimicrobial resistance
          rationale: Specific infectious disease threat, recognized global health priority
        - statement: mental health stigma
          rationale: Health domain (mental health), specific issue (stigma), clear focus
      needs_refinement:
        - statement: public health
          issue: Entire field; no specific topic
          example_question:
            "Public health covers many areas. Which specific health issue
            interests you? For example: [1-2 Epidemiology examples], [1-2 Health Policy examples], [1-2 Health promotion examples], or [1-2 Global Health examples]?"
        - statement: communicable diseases
          issue: "Entire disease category; hundreds of possibilities"
        - statement: "children's health"
          issue: "All pediatric health issues; too expansive"
        - statement: health
          issue: Too general; could be any health topic
        - statement: "rotavirus vaccine-associated intussusception in under-1s in UK"
          issue: "Multiple layers of specificity; very narrow; limited literature"
          example_question:
            "This is quite specialized for an MPH dissertation. You may find very limited published research on this exact combination. Would
            you consider broadening to one of these while keeping your core interest in vaccine safety?: Vaccine safety and adverse events following immunization (AEFI) monitoring, rotavirus vaccination program implementation and effectiveness, or post-marketing vaccine surveillance systems"
        - statement: medication errors involving high-alert medications in geriatric wards at acute NHS trusts
          issue: "four layers of specificity (error type + medication type + ward type + setting type); extremely narrow"
          example_question: "This has several layers of specificity that might limit your literature and make comparison difficult. Consider broadening one or two elements: [1-3 alternatives that maintain their interest but increase scope for robust literature review and analysis]"
      partial:
        - statement: diabetes
          has: Disease identified
          missing: Type of diabetes, specific aspect of diabetes
          example_question: |
            Diabetes is a good starting point. Let's narrow it a bit. Are you interested in Type 2 diabetes specifically (most common, strong prevention/public health focus), or type 1 diabetes? And which aspect: 
            - Risk factors and prevention (behavioral, environmental, social determinants)
            - Diabetes complications and their prevention ([1-3 examples])
            - Diabetes management and care ([1-3 examples])
            - Diabetes screening and early detection ([1-3 examples])?
        - statement: mental health
          has: Health domain identified
          missing: Specific mental health issue or aspect
          example_question: |
            Mental health is broad. Which aspect are you focusing on? Such as: 
            - Specific conditions: depression and anxiety disorders, serious mental health illness, eating disorders
            - Service-related: [1-3 examples]
            - Population-specific: [1-3 examples]
            - Social issues: [1-3 examples]?"
      vague_ambiguous:
        - statement: health improvement
          issue: No specific health topic identified; just an outcome
          example_question: |
            Health improvement is quite general. It is more of a goal than a topic. Which specific health issue or topic do you want to address? For example: 
            - A disease you want to prevent or manage (CVD, diabetes, depression)
            - A health behaviour you want to change (smoking, physical activity, poor diet)
            - Or a health system problem you want to examine (access barriers, service quality, health inequalities)?
        - statement: wellness
          issue: Vague term with multiple possible meanings
      other:
        - statement: obesity, diabetes, and cardiovascular disease
          issue: Multiple distinct conditions bundled together
          example_question: |
            You've identified three related but distinctconditions. For an MPH dissertation, focus deeply on one primary issue. Which interests you most: obesity, Type 2 diabetes, or CVD? Or are you interested in chronic disease prevention broadly (which encompasses all three)? That could work as a focused topic if you are looking at shared risk factors (diet, physical activity, etc.) or integrated prevention approaches"
  - id: mph_research_focus
    aspect_name: "MPH research focus"
    aspect_description: "what the student specifically wants to investigate, examine, or understand about their topic"
    depends_on:
      - mph_research_domain
    evaluation_criteria: |
      ## YOUR GOAL
      You are helping MPH students develop a clear investigative direction - moving from "I'm interested in X" to "I want to understand/examine/investigate [specific aspect] about X".

      This can be expressed as a question, aim, or statement - don't require interrogative structure. What matters is clarity about what will be studied.
       
      Apply global_context principles, especially:
      - Introduce PICO/SPIDER/ECLIPSE frameworks when helpful, not as requirements
      - Check alignment with research domain (are they still talking about the same topic?)
      - Flag causation language if design won't support it
      - Ensure focus is research-oriented (investigative) not solution-focused


      ## EVALUATION CRITERIA
      ### STRONG FOCUS
       - Clearly specifies what will be investigated/examined
       - Identifies relationships, patterns, factors, effectiveness, experiences, or barriers
       - Appropriately scoped for MPH dissertation
       - Research-oriented (investigative/analytical, not just descriptive "what is X?" or prescriptive "how to solve X")
       - Matches domain (still about the same health issue)
       - Feasible to investigate in 6-12 months
       - Has measurable/observable components

      ### WEAK FOCUS
       - No investigative direction (just mentions topic)
       - Too vague about what's being examined
       - Purely definitional ("What is X?" - better for a literature review than research)
       - Solution-focused without investigation ("How can we eliminate X?" - need to understand before solving)
       - Multiple unrelated inquiries bundled together
       - Causation implied when design won't support it
       - Misaligned with stated domain
    response_strategies: |
      - If no focus present: "You've identified [topic]. What specifically do you want to investigate or understand about it? For example: 
         - [1-2 examples if interventions exist for topic]
         - [1-2 examples if risk factors focus fits topic]
         - [1-2 examples if exploratory fits topic]
         - [1-2 examples if health services/systems focus fits topic]
         Suggest frameworks (PICO/SPIDER/ECLIPSE) if helpful, but don't require them.
      - If too vague: "What specifically about [vague element] do you want to examine? For instance: [list 3-4 specific investigative angles that fits the topic]"
      - If solution-focused: "That's an important goal. For research, let's reframe as: what do we need to understand about [topic]? Such as: [list 3-4 investigative angles that fits the topic]" 
       - If multiple inquiries: "You've raised several questions: [list them]. For an MPH dissertation, it's best to focus on one main inquiry. Which interests you most: [example based on topics with primary focus and how they relate]?"
       - If causation language without design: "I notice your research focus seems to be about [topic Y], but earlier you identified [topic X] as your domain. Are these meant to be related, or have we shifted topics? If topics shifted, consider revisiting your research domain to ensure alignment"
    examples:
      clear:
        - statement:
            examining the relationship between air pollution exposure and asthma
            hospitalization rates in urban areas
          rationale:
            Clear relationship being examined (exposure and statement), specific
            variables identified, investigative rather than descriptive, measurable components
        - statement:
            investigating factors that influence vaccine hesitancy among parents
            of young children
          rationale:
            Specific phenomenon (vaccine hesitancy), clear investigative aim
            (factors/determinants), defined population, exploratory approach
        - statement:
            assessing the effectiveness of school-based nutrition education programs
            in improving dietary knowledge and behaviors
          rationale: Clear intervention (nutrition education), specific outcome (knowledge and behaviors), evaluative focus appropriate for MPH
        - statement:
            exploring barriers to physical activity among adolescents in low-income
            urban communities
          rationale: Specific behavior (physical activity), clear investigative direction (barriers), appropriate exploratory approach, defined population
      needs_refinement:
        - statement: childhood obesity
          issue: Topic only; no investigative direction specified
          example_question:
            "You've identified childhood obesity as your topic. What
            specifically do you want to investigate about it? For example: [list one example per topic-related type: prevalence, risk factors, interventions, barriers, policies]?"
        - statement: What is diabetes?
          issue: Purely definitional; not a research inquiry
          example_question:
            "That's more of a definitional question. For MPH research,
            what do you want to investigate about diabetes? Such as: [list 2-3 research questions on topic]?"
        - statement: How can we solve the obesity crisis?
          issue: "Solution-focused and too broad; research examines, not solves; 'crisis' suggests entire problem"
        - statement: health interventions
          issue: No investigative direction; completely vague
        - statement: Why is there health inequality and how can we achieve health equity and what policies work best?
          issue: Multiple distinct inquiries bundled together
          example_question:
            "You've raised three separate questions [list them]. For an MPH dissertation,
            let's focus on one main inquiry. Which one interests you most? Or, if these feel deeply connected to you, we could frame one integrative question: What does exisiting evidence tell us about effective policies for reducing health inequalities in [specific health domain], and what gaps remain? This would be a systematic/scoping review"
      partial:
        - statement: looking at what affects childhood obesity
          has: Basic investigative direction (what affects = factors), identifies outcome (obesity)
          missing: Which factors specifically? What type of relationships? how will you examine them?
          example_question:
            "What specific factors are you interested in examining in relation to childhood obesity? For example:
            - behavioral factors ([1-3 examples that fit topic])
            - environmental factors ([1-3 examples that fit topic])
            - social factors ([1-3 examples that fit topic])
            - biological factors ([1-3 examples that fit topic])?"
        - statement: the effects of air pollution
          has: Clear exposure identified (air pollution), investigative effects
          missing: Effects on what health outcome? Which effects? In Whom? What type of air pollution?
          example_question: "Effects on which health outcome - respiratory, cardiovascular, developmental, pregnancy outcomes. And in which population - children, adults, elderly, people with pre-existing conditions? Also, which type of air pollution - PM2.5, NO2, O3? For example: examining the effects of PM2.5 exposure on respiratory health outcomes among children in urban areas"
      vague_ambiguous:
        - statement: how environment impacts people
          issue: "'Environment' undefined (physical? social? built?); 'impacts' too vague; 'people' too broad"
          example_question:
            "I need to clarify what you mean by 'environment' - there are several possibilities in public health:
            - Physical environment (air pollution, water quality, climate)
            - Social environment (social determinants, community factors)
            - Built environment (urban design, green spaces, walkability)
            - Occupational environment (workplace exposures, ergonomics).
            Also, what specific impacts are you interested in - health outcomes, behaviors, access to services? And which population specifically?"
      other:
        - statement: I think schools should do more about nutrition
          issue: Opinion statement, not research focus; solution-focused
          example_question:
            "That's an important perspective. What would you like to
            investigate about school nutrition? For example:
            - effectiveness of school-based nutrition programs in improving dietary behaviors
            - barriers to implementing nutrition education in schools
            - how school food environment affects children's dietary choices?"
  - id: population_demographics
    aspect_name: population demographics
    aspect_description: who is being studied and in what context or location
    depends_on:
      - mph_research_domain
      - mph_research_focus
    evaluation_criteria: '
      ## WHAT YOU ARE EVALUATING:

      You''re helping MPH students define WHO they''re studying and WHERE/IN WHAT CONTEXT. This grounds abstract research questions in specific, real-world populations and settings.

      Are the study population and setting clearly defined with relevant characteristics?

      ### Well-defined populations & settings:

      - Age range or life stage specified

      - Geographic location identified (country, region, urban/rural)

      - Setting type clear (schools, clinics, communities, workplaces)

      - Relevant characteristics noted (risk factors, socioeconomic status, health conditions)

      ### Poorly-defined populations & settings:

      - Too broad ("people," "everyone," "populations")

      - Too narrow (so specific that evidence unlikely exists)

      - Key characteristics missing (no age, no location, no setting)

      - Ambiguous terms ("young people," "elderly" without age range)

      ### Your response strategy if refinement needed:

      **If needs geographic/setting detail:** "You''ve specified [characteristic], but
      where are you focusing? For example: specific country/region, urban vs rural settings,
      or particular type of setting (schools, clinics, communities)?"


      **If needs demographic detail:** "Can you be more specific about the population?
      Consider: age range (e.g., children 5-12, adults 18-65), risk factors or health
      status, or social/economic characteristics?"


      **If too narrow:** "This is very specific - you might struggle to find sufficient
      research. Would [broader alternative] give you more flexibility while staying
      focused?" '
    examples:
      clear:
        - statement: primary school children aged 6-12 in urban UK schools
          rationale: Age range appropriate for primary schools, specific setting (urban UK schools)
        - statement: pregnant women attending antenatal clinics in rural Sub-Saharan Africa
          rationale:
            Life stage (pregnant), setting (antenatal clinics), broad geographic region
            (rural SSA) specified
        - statement: adults over 65 living in residential care facilities in London
          rationale: Age threshold (65+), living situation (residential care), and specific location (London) all identified
        - statement: healthcare workers in hospital settings in London during the COVID-19 pandemic
          rationale: Occupational group (HCWs), work setting (hospitals), location (London), temporal context (pandemic)
        - statement: adolescents aged 13-18 in low-income urban communities in Birmingham
          rationale: Age range (13-18), socioeconomic context (low-income), geographic setting (urban Birmingham)
      needs_refinement:
        - statement: children
          issue: No age range, no location, no setting
          example_question: |
            Which children specifically? Consider: 
            - age range: ([list standard age categories with ranges for childhood/adolescence])
            - location: [1-3 examples of countries/regions, urban/rural] 
            - setting: (schools, communities, clinical, homes)?
        - statement: people in cities
          issue: Too broad; which populations, which cities
          example_question: "This is too broad; let's narrow:
            - Which population specifically: children, adults, elderly, pregnant
            - Which cities specifically: [list examples]?
            - Any specific settings: schools, workplaces, healthcare facilities?"
        - statement: children aged 8 in Manchester primary schools
          issue: Overly specific age; may limit evidence
          example_question:
            The single-age specification is quite narrow. Would primary
            school children aged 6-10 or 7-11 in Manchester schools work? This gives you more flexibility while maintaining your focus.
      partial:
        - statement: children in London
          has: Age category (children) and city identified
          missing: Specific age range within category, setting type
          example_question: Which age group within childhood [list standard age categories with ranges for childhood], and in what setting (schools, communities, clinical services)?
        - statement: adults in South Asia
          has: Age category and broad region
          missing: Specific age range, country, urban/rural, setting
          example_question:
            "Can you specify: which country in South Asia, what age range
            within adulthood, urban or rural settings, and what type of setting (community,
            workplace, healthcare)?"
        - statement: pregnant women
          has: Life stage clearly identified
          missing: Location, setting, any risk characteristics
          example_question:
            "Where are you focusing: which country or region, urban or
            rural, and in what setting (community, antenatal clinics, hospitals)? Any
            specific risk groups (first-time mothers, high-risk pregnancies)?"
      vague_ambiguous:
        - statement: young people in communities
          issue: Both 'young people' and 'communities' are ambiguous
          example_question: |
            - clarify young people: What age range for 'young people' (adolescents 13-17, young
            adults 18-25, both)?
            - clarify communities: which communities specifically?: Geographic communities (neighborhoods, villages, urban areas), identity-based (ethnic, faith, LGBTQ+), or setting-based (school or online communities)?
            - And where geographically? country/region, urban/rural?
        - statement: vulnerable populations
          issue: category label, not a specific population
          example_question:
            "Which vulnerable population specifically: elderly, low-income
            communities, refugees, homeless populations, immunocompromised individuals,
            or another group? And where are they located?"
        - statement: people at risk
          issue: At risk of what? Which people? Where?
          example_question:
            "At risk of what specifically? And which population - age
            group, location, setting? For example: children at risk of obesity in urban
            schools, elderly at risk of falls in care homes?"
      other:
        - statement: children and adults and elderly
          issue: Multiple distinct age groups; too broad
          example_question:
            "It's better to focus on one age group for an MPH dissertation.
            Which is your primary interest: children, working-age adults, or elderly populations?
            Or are you specifically interested in comparing across age groups?. Different age groups have different health issues, behaviors, service needs, and appropiate methodsand contexts, so focusing deeply on one allows, deeper, more focused research"
  - id: study_design
    aspect_name: study design
    aspect_description: the methodological approach and temporal scope of the research
    depends_on:
      - mph_research_focus
      - population_demographics
      - intervention_exposure
    evaluation_criteria: '### What you''re evaluating:

      Is the study design clearly specified and appropriate? Is the timeframe indicated?


      ### Clear design & timeframe:

      - Named study type (cross-sectional, cohort, RCT, case-control, systematic review,
      qualitative)

      - Design matches research focus

      - Timeframe indicated (cross-sectional snapshot, longitudinal duration, historical
      period)

      - Feasible for MPH dissertation scope


      ### Unclear design & timeframe:

      - Just "survey" or "study" without detail

      - Design doesn''t match research focus (e.g., causation claim with cross-sectional
      design)

      - No temporal scope indicated

      - Overly ambitious for dissertation timeline


      ### Your response strategy if refinement needed:


      **If unspecified:** "What methodological approach are you planning? For your research
      focus, you might consider: [list 3-4 appropriate designs with brief descriptions]"


      **If design-focus mismatch:** "I notice you want to understand [causal/temporal
      element], but [proposed design] typically shows association/snapshot. Would [alternative
      design] be more appropriate, or should we adjust your research focus?"


      **If overly ambitious:** "[Design] is gold standard but quite resource-intensive
      for an MPH dissertation. Would [more feasible alternative] work? It would still
      address your research focus while being more manageable." '
    examples:
      clear:
        - statement:
            cross-sectional survey of vaccination attitudes among parents, conducted
            during 2025
          rationale:
            Specific design (cross-sectional survey), population clear, timeframe
            indicated (2025), appropriate for attitude assessment
        - statement: cohort study following children over two years to examine BMI changes
          rationale:
            Design type (cohort), temporal element (longitudinal over 2 years),
            statement specified
        - statement:
            systematic review of literature published 2015-2025 on school nutrition
            interventions
          rationale: Design (systematic review), temporal scope (10 years), topic focused
        - statement: qualitative study using semi-structured interviews to explore experiences
          rationale:
            Design (qualitative), method (interviews), investigative approach
            (exploratory)
        - statement:
            case-control study comparing adults with and without diabetes to
            identify risk factors
          rationale:
            Design (case-control), comparison groups specified, appropriate for
            risk factor investigation
      needs_refinement:
        - statement: a survey
          issue: Type of survey not specified; no timeframe
          example_question:
            What type of survey - cross-sectional (one time point) or
            longitudinal (multiple time points)? Who will you survey and over what timeframe?
            For your research focus, a cross-sectional survey of [population] during [timeframe]
            might work.
        - statement: observational study
          issue: Type of observational study unclear
          example_question:
            "Which type of observational study: cohort (following people
            over time), case-control (comparing groups with/without condition), or cross-sectional
            (snapshot at one point)? Your research focus about [topic] would suit [specific
            design suggestion]."
        - statement: I'll collect data
          issue: No design specified
          example_question:
            "What methodological approach? For investigating [their research
            focus], you might consider: cross-sectional survey for current patterns, cohort
            study if examining changes over time, or qualitative interviews if exploring
            experiences. What fits your interest?"
        - statement:
            randomized controlled trial comparing three intervention arms over
            5 years
          issue: Overly ambitious for MPH dissertation
          example_question:
            RCTs are gold standard but very resource-intensive for an
            MPH dissertation. Would a quasi-experimental design or comparing existing
            intervention data be more feasible? This would still let you examine intervention
            effectiveness while being more manageable.
      partial:
        - statement: survey of school children
          has: Basic method (survey), population indicated
          missing: Type of survey, timeframe, sampling approach
          example_question:
            Will this be a cross-sectional survey (one time point) or
            longitudinal (multiple time points)? And over what timeframe - during one
            school term, academic year? Also, how will you sample - all schools in an
            area, random selection?
        - statement: longitudinal study
          has: Temporal element (longitudinal)
          missing: Specific design type, duration, what's being followed
          example_question:
            What type of longitudinal design - cohort study (following
            a group over time) or repeated cross-sections? Over what duration (months,
            years)? And measuring what statements at what intervals?
        - statement: qualitative research
          has: General approach (qualitative)
          missing: Specific method, sample characteristics
          example_question:
            Which qualitative method - interviews, focus groups, observations,
            or document analysis? With how many participants, and over what timeframe?
            For your research focus on [topic], [specific method] with [number] participants
            might work well.
      vague_ambiguous:
        - statement: I'll do research on this
          issue: No methodological detail at all
          example_question:
            "What research approach are you considering? For your focus
            on [topic], you might: conduct a cross-sectional survey to understand current
            patterns, do qualitative interviews to explore experiences, or undertake a
            systematic review of existing evidence. What appeals to you?"
        - statement: looking at data over time
          issue: Ambiguous what 'over time' means and what data
          example_question:
            Are you planning to collect new data at multiple time points
            (prospective cohort), or analyze existing historical data (retrospective)?
            Over what duration - months, years, decades? And what type of data - surveys,
            health records, routine statistics?
      other:
        - statement: mixed methods with surveys, interviews, focus groups, and observations
          issue: Overly complex for MPH dissertation
          example_question:
            Multiple methods can be very time-consuming for a dissertation.
            Could you focus on one primary method (quantitative survey OR qualitative
            interviews/focus groups)? This would let you do deeper, higher-quality work
            within your timeline.
        - statement: wanting to prove that intervention X causes statement Y
          issue: Language of causation without appropriate design
          example_question:
            "Proving causation requires experimental design like RCTs,
            which are resource-intensive. For your dissertation, would you consider: examining
            association between X and Y (using observational design), or comparing statements
            in areas with/without intervention X (quasi-experimental)? These are more
            feasible while still addressing your interest."
  - id: outcomes_interest
    aspect_name: outcomes of interest
    aspect_description:
      what will be measured, observed, or understood as results of
      the research
    evaluation_criteria: '### What you''re evaluating:

      Are the statements/results of interest clearly specified and measurable?


      ### Clear statements:

      - Specific health indicators (disease incidence, mortality, BMI, blood pressure)

      - Behavioral statements (physical activity levels, dietary intake, smoking rates)

      - Knowledge or attitudinal statements (awareness, beliefs, intentions)

      - System statements (service utilization, policy adoption, healthcare access)

      - Clearly linked to the research focus


      ### Unclear statements:

      - Vague terms ("better health," "positive statements," "improvement")

      - Not measurable ("wellbeing" without defining how measured)

      - Disconnected from research focus

      - Unrealistic magnitude or timeframe


      ### Your response strategy for unclear statements:


      **If vague:** "When you say [vague term], what specifically will you measure or
      observe? For example: health metrics (disease incidence, biomarkers), behaviors
      (activity levels, dietary intake), knowledge/attitudes, or service use?"


      **If disconnected:** "I notice your statements [X] don''t directly connect to
      your research focus on [Y]. Should we align these, or adjust your research focus?"


      **If unrealistic:** "That''s quite an ambitious change for [timeframe]. Based
      on existing evidence, what''s a realistic statement to expect? Even [more modest
      statement] would be significant."

      '
    examples:
      clear:
        - statement: BMI reduction and improved nutrition knowledge scores
          rationale:
            Specific anthropometric measure (BMI) and clear knowledge assessment,
            both measurable
        - statement: asthma hospitalization rates
          rationale:
            Specific health service statement with clear measurement through
            hospital data
        - statement: self-reported physical activity levels measured by validated questionnaire
          rationale: Behavioral statement with specified measurement method
        - statement: vaccination coverage rates in the target population
          rationale: Clear public health indicator with standard measurement approach
        - statement: reported barriers to accessing mental health services
          rationale:
            Qualitative statement appropriate for exploratory research on access
            barriers
        - statement: prevalence of Type 2 diabetes diagnosed through HbA1c testing
          rationale: Specific disease statement with clear diagnostic criterion
      needs_refinement:
        - statement: better health
          issue: Too vague; 'better' undefined and 'health' too broad
          example_question:
            "What specific health changes would you measure? For example:
            reduced disease incidence, improved biomarkers (blood pressure, cholesterol,
            HbA1c), changed behaviors (physical activity, diet), or increased knowledge/awareness?"
        - statement: positive statements
          issue: Completely unspecified
          example_question:
            "Which specific statements would indicate success? Such as:
            health indicators (mortality, morbidity, disease rates), behavioral changes
            (smoking cessation, increased activity), service utilization, or policy adoption?"
        - statement: improved quality of life
          issue: Not measurable without specifying how
          example_question:
            "How would you measure quality of life? Would you use: a validated
            QoL scale (like EQ-5D), specific functional statements, mental health measures,
            or self-reported wellbeing scores? Each requires different data collection."
        - statement: health improvement
          issue: Vague; no specific health aspect identified
          example_question:
            "Which health statements specifically? For example: disease
            prevention (reduced incidence), management (controlled symptoms, reduced complications),
            or behavioral (changed risk behaviors)?"
      partial:
        - statement: obesity rates in children
          has: Health statement (obesity) and population
          missing: How measured, what change expected
          example_question:
            How will you measure obesity - BMI percentiles, BMI z-scores,
            or obesity prevalence rates? And are you looking at changes over time, differences
            between groups, or current levels?
        - statement: smoking behavior
          has: Behavior category identified
          missing: Which aspect of smoking behavior
          example_question:
            "Which aspect of smoking behavior: cessation rates, smoking
            prevalence, cigarettes per day, quit attempts, or intention to quit? Each
            requires different measurement approaches."
        - statement: health service use
          has: General statement category
          missing: Which services, which utilization measures
          example_question:
            "Which health service use specifically: number of visits,
            types of services accessed, timing of service use, or barriers to utilization?
            For example: GP consultations per year, A&E attendances, or mental health
            service uptake."
      vague_ambiguous:
        - statement: wellness
          issue: Undefined concept that could mean many things
          example_question:
            "What aspect of wellness would you measure: physical health
            (fitness, absence of disease), mental health (mood, stress levels), health
            behaviors (diet, activity), or subjective wellbeing (life satisfaction)? Each
            needs specific measurement approaches."
        - statement: community health
          issue: Ambiguous - community-level or individual health in communities?
          example_question:
            "Are you measuring: aggregated health indicators for communities
            (e.g., area-level disease rates), individual health of people living in communities,
            or community factors affecting health (social cohesion, resources)? These
            require different approaches."
        - statement: impact on population
          issue: "'Impact' undefined, 'population' too general"
          example_question:
            Impact measured how - health statements (mortality, morbidity),
            health behaviors (risk factor prevalence), or service statements (coverage,
            access)? And which population specifically?
      other:
        - statement: reduction in obesity rates from 40% to 5% within 6 months
          issue: Unrealistically large change in short timeframe
          example_question:
            A drop from 40% to 5% in 6 months would be unprecedented.
            Based on intervention evidence, what's realistic - perhaps 2-5% reduction
            over 12-18 months? Even modest changes can be significant for public health.
        - statement:
            multiple statements including BMI, blood pressure, cholesterol, physical
            activity, diet quality, mental health, and service use
          issue: Too many statements for dissertation scope
          example_question:
            "Measuring all these statements would be very demanding. Could
            you focus on 2-3 primary statements most relevant to your research focus?
            For example, if examining a nutrition intervention: BMI, dietary intake, and
            nutrition knowledge?"
  - id: intervention_exposure
    aspect_name: "intervention/exposure"
    aspect_description: the intervention being evaluated or exposure being examined (only applicable for certain research types)
    depends_on:
      - mph_research_focus
    evaluation_criteria: '### When this aspect applies:

      - Research focus involves evaluating an intervention''s effectiveness

      - Research examines exposure-statement relationships

      - Comparative studies of different approaches


      ### When this aspect does NOT apply:

      - Purely descriptive research (prevalence, patterns)

      - Exploratory research on factors/determinants

      - Research on barriers or facilitators (unless comparing intervention approaches)


      ### What you''re evaluating (when applicable):

      Is the intervention or exposure clearly specified?


      ### Clear interventions/exposures:

      - Type of intervention specified (behavioral, policy, educational, clinical)

      - Key components or characteristics described

      - Exposure clearly defined (environmental, behavioral, social)

      - Comparison specified if relevant (vs. control, vs. alternative intervention)


      ### Unclear interventions/exposures:

      - Vague intervention ("programs," "interventions" without detail)

      - Undefined exposure

      - Missing comparison group when relevant


      ### Your response strategy:

      **If not applicable:** Note that this aspect isn''t needed for their research
      focus.

      **If applicable but vague:** "Which [intervention/exposure] specifically? For
      example: [list 3-4 concrete examples relevant to their topic]"


      **If needs comparison:** "Are you comparing this intervention to: usual care/no
      intervention, a different intervention approach, or pre-post implementation? This
      affects your study design." '
    examples:
      clear:
        - statement:
            school-based nutrition education program including classroom lessons
            and cafeteria modifications
          rationale:
            Intervention type (education) and setting (school) specified, key
            components described
        - statement: tobacco taxation policy increasing cigarette prices by at least 10%
          rationale: Policy intervention clearly specified with concrete threshold
        - statement:
            air pollution exposure measured as PM2.5 levels from local monitoring
            stations
          rationale: Exposure clearly defined with specific measurement approach
        - statement: HPV vaccination (2-dose schedule) compared to no vaccination
          rationale: Specific vaccine, dosing specified, comparison group identified
      needs_refinement:
        - statement: health programs
          issue: No intervention type specified
          example_question:
            "Which type of health program: educational programs, screening
            programs, behavior change interventions, or policy-based programs? For your
            research focus on [topic], [specific program type] would be most relevant."
        - statement: interventions
          issue: Completely unspecified
          example_question:
            "Which interventions for your research focus on [topic]? For
            example: behavioral interventions (counseling, education), environmental interventions
            (policy changes, built environment), or clinical interventions (screening,
            treatment)?"
        - statement: exposure
          issue: Type of exposure not defined
          example_question:
            "Exposure to what? For research on [their topic], this might
            be: environmental exposure (pollution, chemicals), behavioral exposure (diet,
            physical activity patterns), or social exposure (advertising, peer influence)?"
      partial:
        - statement: school-based program
          has: Setting (school) and general approach (program)
          missing: Type of program, key components
          example_question:
            "What type of school-based program: nutrition education, physical
            activity promotion, mental health support, or something else? And what are
            its key components - curriculum, environmental changes, family involvement?"
        - statement: vaccination
          has: Intervention category (vaccination)
          missing: Which vaccine, for which disease
          example_question:
            "Which vaccine specifically: HPV, MMR, seasonal flu, COVID-19,
            or routine childhood vaccinations generally? This affects which literature
            is relevant and what statements to examine."
      other:
        - statement: "Research focus: What factors influence physical activity among adolescents?"
          issue: Not applicable
          rationale:
            This is exploratory research on determinants, not evaluating an intervention
            or examining specific exposures
        - statement: "Research focus: What are the barriers to mental health service access?"
          issue: Not applicable
          rationale: This is exploratory research on barriers, not evaluating interventions or exposures
