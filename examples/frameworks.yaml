  examples:
    clear:
    - statement: Multicenter RCT of drug A vs placebo in 500 patients with 12-month
        follow-up
      rationale: Study type (RCT), setting (multicenter), sample size (500), duration
        (12 months) all specified
    - statement: Double-blind placebo-controlled parallel-group trial across 20 US
        academic medical centers
      rationale: Design details (double-blind, placebo-controlled, parallel), setting
        (20 academic centers, US location)
    needs_refinement:
    - statement: Study comparing two treatments
      issue: Study design not specified
      missing: Study type, setting, duration
      example_question: What study design? (e.g., randomized controlled trial, observational
        cohort, systematic review)
    partial:
    - statement: RCT comparing interventions in hospital setting
      has: Study type (RCT), general setting (hospital)
      missing: Sample size, duration, specific hospital type, blinding approach
      example_question: What is your target sample size? Study duration? Single-center
        or multi-center?
