legal_research_schema:
  - id: jurisdiction
    name: Jurisdiction
    description: Define the legal jurisdiction
    prompt_template: |
      The query doesn't specify a legal jurisdiction.

      Current query: {query}

      Jurisdiction is critical for legal research. Please consider:
      - Federal vs. state/provincial law?
      - Specific country or countries?
      - International law?
      - Specific court system (e.g., Supreme Court, appellate, district)?

      Generate ONE concise question to clarify the jurisdiction.
    analysis_hint: check_jurisdiction_terms
