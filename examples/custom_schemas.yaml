pico_advanced:
- id: population_demographics
  aspect_name: Population Demographics
  aspect_description: Defines the target population's basic demographic characteristics including age range, gender, ethnicity,
    and geographic & socioeconomic context. This forms the foundation for all other PICO dimensions.
  evaluation_instructions: '## Determine if the demographic specification is sufficient for:

    1. Study replication 2. Results generalization 3. Ethical review requirements

    ## Required Demographic Dimensions 1. **Age Range**: Is there a specific age range or age group mentioned? - Examples:
    "18-65 years", "adults", "elderly 75+", "pediatric" - Red flags: vague terms like "older", "younger" without numbers

    2. **Gender/Sex**: Is gender specification necessary and if so, is it provided? - Consider: Is gender relevant to the
    research question? - Examples: "postmenopausal women", "male athletes"

    3. **Ethnicity/Race**: Is ethnicity mentioned when relevant? - Consider: Does the condition have ethnic disparities? -
    Examples: "African American populations", "Asian populations"

    4. **Geographic Location and Context**: Is the geographic and socioeconomic context specified? - Consider: Does setting
    affect applicability (urban vs rural, healthcare access, LMIC vs HMIC)? - Examples: "sub-Saharan Africa", "rural India",
    "low-income urban populations", "high-income European countries" '
  examples:
    clear:
    - statement: Efficacy of metformin in adults aged 40-65 with BMI > 30 in South London primary care
      rationale: Age range precisely defined (40-65), specific population characteristic (BMI > 30), and geographic context
        (South London primary care)
    - statement: Postmenopausal women aged 50-70 in urban clinical settings in Wales
      rationale: Age (50-70), gender (women), life stage (postmenopausal), setting (urban clinical), geographic context (Wales)
        all clearly specified
    - statement: African American males aged 18-45 with hypertension in community health centers
      rationale: 'Complete demographic profile: ethnicity, gender, age range, condition, and recruitment setting'
    needs_refinement:
    - statement: Does exercise reduce depression in adults?
      issue: '''Adults'' is too broad - could range from 18 to 100+ years'
      missing: Specific age range, gender considerations, geographic scope
      example_question: 'What age range are you targeting? For example: young adults (18-35), middle-aged (36-64), or older
        adults (65+)?'
    - statement: Study on diabetes management in elderly patients
      issue: '''Elderly'' is ambiguous - definitions vary from 60+ to 80+'
      missing: Precise age threshold, gender, setting
      example_question: What specific age threshold defines 'elderly' for your study? (e.g., 65+, 70+, 75+)
    - statement: Treatment outcomes in minority populations
      issue: '''Minority populations'' is vague and could mean multiple groups'
      missing: Specific ethnic/racial groups, age, gender
      example_question: Which specific population groups are you focusing on? (e.g., Hispanic/Latino, African American, Asian,
        Native American)
    partial:
    - statement: Women over 40 with cardiovascular disease
      has: Gender (women) and minimum age (40)
      missing: Upper age limit, ethnicity (if CVD disparities relevant), geographic setting
      example_question: Is there an upper age limit? Are you focusing on specific ethnic groups given CVD disparities?
    - statement: Pediatric patients in tertiary care hospitals
      has: Age category (pediatric) and setting (tertiary care)
      missing: Specific age range within pediatrics (neonates, infants, children, adolescents?)
      example_question: What age range within pediatrics? (0-1 year, 1-12 years, 12-18 years, or all pediatric ages)
    vague_ambiguous:
    - statement: Middle-aged adults in diverse communities
      issue: Both 'middle-aged' (typically 40-65 but varies) and 'diverse' are ambiguous
      example_question: 'Can you specify: 1) Exact age range for ''middle-aged'', and 2) What dimensions of diversity matter
        (ethnic, socioeconomic, geographic)?'
    - statement: Study in representative population sample
      issue: '''Representative'' is context-dependent - representative of what population?'
      example_question: What population should this sample represent? Please specify demographic characteristics that define
        representativeness.
  value_field_type: object
  value_field_description: 'The Defines the target population''s basic demographic characteristics including age range, gender,
    ethnicity, and geographic & socioeconomic context. This forms the foundation for all other PICO dimensions.. Expected
    format: object with relevant fields. Examples: "Efficacy of metformin in adults aged 40-65 with BMI > 30 in South London
    primary care", "Postmenopausal women aged 50-70 in urban clinical settings in Wales", "African American males aged 18-45
    with hypertension in community health centers".'
- id: population_clinical_profile
  depends_on:
  - population_demographics
  aspect_name: Clinical Profile & Health Status
  aspect_description: Specifies the primary health condition, disease stage, severity, comorbidities, and relevant medical
    history. Critical for defining study eligibility and expected treatment responses.
  evaluation_instructions: "**Query to Analyze:** \"{input}\"\n\n\n# TASK: Clinical Profile Analysis\nAnalyze the clinical\
    \ characteristics and health status specification.\n\n\n## Clinical Profile Dimensions\n\n1. **Primary Condition/Diagnosis**\n\
    \  - Is the main health condition clearly identified?\n  - Is it specific enough? (e.g., \"Type 2 diabetes\" vs \"diabetes\"\
    )\n\n2. **Disease Stage/Phase**\n  - Is staging mentioned when relevant?\n  - Examples: early-stage, advanced, acute,\
    \ chronic, remission\n\n3. **Severity Level**\n  - Is severity specified?\n  - Examples: mild, moderate, severe, or quantified\
    \ measures\n\n4. **Comorbidities**\n  - Are concurrent conditions mentioned?\n  - Are exclusions for contraindicated comorbidities\
    \ specified?\n\n5. **Treatment History**\n  - Is prior treatment status mentioned?\n  - Examples: treatment-naive, refractory,\
    \ previously treated\n\n6. **Diagnostic Criteria**\n  - Are diagnostic standards mentioned?\n  - Examples: ICD codes,\
    \ clinical guidelines, biomarker thresholds\n\nEvaluate whether the clinical profile enables:\n- Accurate patient identification\
    \ and recruitment\n- Appropriate treatment selection\n- Valid outcome interpretation\n"
  examples:
    clear:
    - statement: Efficacy of SGLT2 inhibitors in Type 2 diabetes patients with HbA1c 7.5-10%, treatment-naive
      rationale: Specific condition (Type 2 diabetes), severity marker (HbA1c 7.5-10%), treatment history (naive)
    - statement: Outcomes of immunotherapy in stage IIIB non-small cell lung cancer, ECOG performance status 0-1
      rationale: Precise diagnosis, stage (IIIB), cancer type (NSCLC), functional status (ECOG 0-1)
    - statement: Management of acute severe asthma exacerbations requiring emergency department care
      rationale: Condition (asthma), phase (acute), severity (severe), setting context (ED care required)
    needs_refinement:
    - statement: Treatment for diabetic patients
      issue: Diabetes type not specified - Type 1, Type 2, gestational, MODY, etc. have different treatments
      missing: Disease type, severity, duration, complications
      example_question: What type of diabetes? (Type 1, Type 2, gestational) And what level of glycemic control? (e.g., HbA1c
        range)
    - statement: Study on cancer treatment outcomes
      issue: No cancer type, stage, or histology specified
      missing: Cancer type, stage, grade, molecular markers
      example_question: Which cancer type and stage are you studying? Are there specific histological or molecular characteristics?
    - statement: Intervention in patients with heart problems
      issue: '''Heart problems'' is far too vague - hundreds of cardiac conditions exist'
      missing: Specific cardiac diagnosis, severity, functional class
      example_question: What specific cardiac condition? (e.g., heart failure, coronary artery disease, arrhythmia) And what
        severity?
    partial:
    - statement: Effects of statins in patients with moderate hyperlipidemia
      has: Condition (hyperlipidemia) and severity (moderate)
      missing: Specific lipid ranges defining 'moderate', comorbidities, prior treatment attempts
      example_question: What LDL or total cholesterol range defines 'moderate' for your study? Any relevant comorbidities
        or prior statin use?
    - statement: Study in hypertensive patients with diabetes
      has: Two conditions specified (hypertension, diabetes)
      missing: BP range, diabetes type, severity of both conditions, other comorbidities
      example_question: What BP range defines hypertension in your study? What type and control level of diabetes?
    vague_ambiguous:
    - statement: Treatment in patients with refractory disease
      issue: '''Refractory'' to which treatments? How many prior treatment failures?'
      example_question: Refractory to which specific treatments? How many prior treatment lines? What defines 'refractory'
        in your protocol?
    - statement: Study in high-risk cardiovascular patients
      issue: '''High-risk'' is subjective - needs risk score or specific criteria'
      example_question: What defines 'high-risk'? (e.g., Framingham score, specific risk factors, prior events)
  value_field_type: string
  value_field_description: 'The Specifies the primary health condition, disease stage, severity, comorbidities, and relevant
    medical history. Critical for defining study eligibility and expected treatment responses.. Expected format: numeric value.
    Examples: "Efficacy of SGLT2 inhibitors in Type 2 diabetes patients with HbA1c 7.5-10%, treatment-naive", "Outcomes of
    immunotherapy in stage IIIB non-small cell lung cancer, ECOG performance status 0-1", "Management of acute severe asthma
    exacerbations requiring emergency department care".'
- id: intervention_specification
  depends_on:
  - population_demographics
  - population_clinical_profile
  examples:
    clear:
    - statement: Metformin 1000mg twice daily for 6 months vs placebo in newly diagnosed Type 2 diabetes
      rationale: Drug (metformin), dose (1000mg), frequency (twice daily), duration (6 months), comparison (placebo)
    - statement: Laparoscopic Roux-en-Y gastric bypass performed by experienced bariatric surgeons
      rationale: Specific surgical technique (laparoscopic Roux-en-Y), provider qualification (experienced bariatric surgeons)
    - statement: Cognitive Behavioral Therapy, 12 weekly 60-minute sessions delivered by licensed clinical psychologists
      rationale: Therapy type (CBT), frequency (weekly), duration (12 sessions), session length (60 min), provider (licensed
        psychologists)
    needs_refinement:
    - statement: Effects of medication on blood pressure
      issue: No medication specified, no dosing information
      missing: Drug name, dose, frequency, duration, route
      example_question: Which medication are you studying? Please specify the drug name, dose, frequency, and treatment duration.
    - statement: Study on surgery outcomes
      issue: Type of surgery not specified
      missing: Surgical procedure, approach (open vs laparoscopic), setting
      example_question: What specific surgical procedure? What surgical approach? (e.g., open, laparoscopic, robotic)
    - statement: Exercise intervention for weight loss
      issue: Exercise type, intensity, frequency, duration all unspecified
      missing: Exercise modality, intensity level, frequency, session duration, total program length
      example_question: What type of exercise? (aerobic, resistance, both) What intensity, frequency, and program duration?
    partial:
    - statement: Atorvastatin treatment for hyperlipidemia
      has: Drug name (atorvastatin), indication (hyperlipidemia)
      missing: Dose, frequency, treatment duration, titration protocol
      example_question: What dose of atorvastatin? (10mg, 20mg, 40mg, 80mg) What frequency and treatment duration?
    - statement: Physical therapy twice weekly for knee osteoarthritis
      has: Intervention type (physical therapy), frequency (twice weekly), condition
      missing: Specific PT protocol, session duration, total treatment length, therapy components
      example_question: What specific PT protocol? How long are sessions? What is the total treatment duration?
    vague_ambiguous:
    - statement: High-dose vitamin D supplementation
      issue: '''High-dose'' is relative - could be 2,000 IU or 50,000 IU depending on context'
      example_question: What specific dose of vitamin D? (e.g., 2,000 IU daily, 50,000 IU weekly)
    - statement: Intensive glycemic control in diabetes
      issue: '''Intensive'' is subjective - needs target HbA1c or glucose range'
      example_question: What target defines 'intensive control'? (e.g., HbA1c <6.5%, fasting glucose 80-110 mg/dL)
  evaluation_instructions: "**Query to Analyze:** \"{input}\"\n\n# TASK: Intervention\n\nSpecification Analysis\n\n\nAnalyze\
    \ whether the intervention is sufficiently detailed for study replication.\n\n## Intervention Dimensions\n\n1. **Intervention\
    \ Type**\n  - Pharmacological (drug, biologic)\n  - Procedural (surgery, device)\n  - Behavioral (therapy, lifestyle)\n\
    \  - Diagnostic (test, screening)\n\n2. **Specific Agent/Method**\n  - Generic/brand name for drugs\n  - Specific procedure\
    \ or technique\n  - Defined behavioral protocol\n\n3. **Dosing/Intensity** (if applicable)\n  - Dose amount and units\n\
    \  - Frequency (daily, weekly)\n  - Timing (morning, with meals)\n\n4. **Duration**\n  - Treatment length\n  - Follow-up\
    \ period\n\n5. **Delivery Method**\n  - Route (oral, IV, subcutaneous)\n  - Setting (inpatient, outpatient, home)\n  -\
    \ Provider type\n\n6. **Adjunct Treatments**\n  - Concurrent therapies\n  - Background medications\n  - Supportive care\
    \ protocols\n"
  aspect_name: Intervention Specification
  aspect_description: Details the treatment, procedure, or exposure being studied including specific agents, dosing, duration,
    frequency, and delivery method.
  value_field_type: object
  value_field_description: 'The Details the treatment, procedure, or exposure being studied including specific agents, dosing,
    duration, frequency, and delivery method.. Expected format: object with relevant fields. Examples: "Metformin 1000mg twice
    daily for 6 months vs placebo in newly diagnosed Type 2 diabetes", "Laparoscopic Roux-en-Y gastric bypass performed by
    experienced bariatric surgeons", "Cognitive Behavioral Therapy, 12 weekly 60-minute sessions delivered by licensed clinical
    psychologists".'
- id: comparison_group
  depends_on:
  - intervention_specification
  examples:
    clear:
    - statement: Metformin vs placebo in prediabetic adults
      rationale: Clear active intervention (metformin) vs inert control (placebo)
    - statement: New anticoagulant compared to warfarin (standard care) in atrial fibrillation
      rationale: Novel treatment vs established standard of care explicitly stated
    - statement: High-intensity statins vs moderate-intensity statins in secondary prevention
      rationale: Head-to-head comparison of two active dose strategies
    needs_refinement:
    - statement: Effects of new drug on blood pressure
      issue: No comparison group mentioned
      missing: Comparator specification
      example_question: What will you compare the new drug against? (e.g., placebo, current standard treatment, another active
        drug)
    - statement: Study of surgical intervention
      issue: No comparison - surgery vs what?
      missing: Control/comparison group
      example_question: What is the comparison? (e.g., surgery vs medical management, surgery vs observation, one surgical
        technique vs another)
    partial:
    - statement: Cognitive therapy vs usual care in depression
      has: Intervention (cognitive therapy) and comparison type (usual care)
      missing: '''Usual care'' not defined - varies by setting and provider'
      example_question: Can you specify what 'usual care' includes in your setting? (e.g., medications only, supportive counseling,
        monitoring frequency)
    - statement: New treatment compared to current options
      has: Comparison concept mentioned
      missing: Specific comparator not identified
      example_question: What specific current treatment(s) will serve as the comparator? (e.g., specific drug names, specific
        procedures)
    vague_ambiguous:
    - statement: Drug A versus control in hypertension
      issue: '''Control'' could mean placebo, standard care, or no treatment'
      example_question: What does 'control' mean in your study? (placebo, standard antihypertensive therapy, or no treatment)
    - statement: Intervention vs standard therapy
      issue: '''Standard therapy'' varies by geography, guidelines, and time period'
      example_question: What specific treatment(s) constitute 'standard therapy' in your context? (e.g., specific drugs, specific
        guidelines)
  evaluation_instructions: "**Query to Analyze:** \"{input}\" \n# TASK: Comparison Group Analysis\nAnalyze whether an appropriate\
    \ comparison/control group is specified.\n\n## Comparison Types\n1. **Placebo Control**\n   - Inert substance/sham procedure\n\
    \   - Blinding considerations\n\n2. **Standard Care/Treatment**\n  - Current guideline-recommended treatment\n  - Usual\
    \ care protocols\n\n3. **Alternative Active Treatment**\n  - Different drug/dose/intervention\n  - Head-to-head comparison\n\
    \n4. **No Treatment**\n  - Watchful waiting\n  - Natural history observation\n\n5. **Dose Comparison**\n  - Different\
    \ doses of same intervention\n\n## Key Questions\n\n- Is a comparator mentioned?\n- Is the comparator appropriate for\
    \ the research question?\n- Is the comparator as well-defined as the intervention?\n- Are ethical considerations addressed\
    \ (especially for no-treatment controls)?\n"
  aspect_name: Comparison/Control Group
  aspect_description: 'Defines what the intervention is compared against: placebo, standard care, alternative treatment, or
    no treatment. Critical for establishing causality.'
  value_field_type: string
  value_field_description: 'The Defines what the intervention is compared against: placebo, standard care, alternative treatment,
    or no treatment. Critical for establishing causality.. Examples: "Metformin vs placebo in prediabetic adults", "New anticoagulant
    compared to warfarin (standard care) in atrial fibrillation", "High-intensity statins vs moderate-intensity statins in
    secondary prevention".'
- id: primary_outcomes
  depends_on:
  - intervention_specification
  - population_clinical_profile
  examples:
    clear:
    - statement: Effect of intervention on all-cause mortality at 5 years
      rationale: Specific outcome (all-cause mortality), clear timepoint (5 years)
    - statement: Change in HbA1c from baseline to 6 months, with target reduction ≥0.5%
      rationale: Specific biomarker (HbA1c), timeframe (baseline to 6 months), clinical significance threshold (≥0.5%)
    - statement: Quality of life measured by SF-36 at 3, 6, and 12 months post-intervention
      rationale: Specific validated instrument (SF-36), multiple timepoints (3, 6, 12 months)
    needs_refinement:
    - statement: Study on treatment effectiveness
      issue: '''Effectiveness'' not defined - needs specific measurable outcome'
      missing: Specific outcome measure, measurement method, timepoint
      example_question: How will you measure effectiveness? (e.g., specific clinical outcomes, biomarkers, patient-reported
        measures)
    - statement: Research on improving patient outcomes
      issue: '''Outcomes'' is vague - could mean dozens of different measures'
      missing: Specific outcome(s), measurement tools, assessment timing
      example_question: What specific outcome(s) will you measure? When will they be assessed?
    - statement: Trial measuring quality of life improvement
      issue: QOL mentioned but no instrument specified
      missing: QOL instrument, measurement timepoints, MCID
      example_question: Which quality of life instrument will you use? (e.g., SF-36, EQ-5D, disease-specific) When will you
        assess it?
    partial:
    - statement: Effect on blood pressure reduction
      has: General outcome category (blood pressure)
      missing: Specific BP parameter (systolic, diastolic, mean arterial), target reduction, measurement protocol, timepoint
      example_question: Which BP parameter? (systolic, diastolic, or both) What measurement protocol? When will it be assessed?
    - statement: Change in depression scores using validated scales
      has: Outcome type (depression), mentions validation
      missing: Specific scale, timepoints, MCID
      example_question: Which depression scale? (PHQ-9, Beck Depression Inventory, HAM-D) At what timepoints? What change
        is clinically meaningful?
    vague_ambiguous:
    - statement: Study on long-term outcomes of surgery
      issue: '''Long-term'' is relative (could be 1 year or 10 years), ''outcomes'' unspecified'
      example_question: What is the follow-up duration? What specific outcomes will you measure? (e.g., survival, complications,
        functional status)
    - statement: Research on significant improvement in symptoms
      issue: '''Significant'' (statistical vs clinical?) and ''symptoms'' (which ones?) both vague'
      example_question: Which specific symptoms? How will you measure them? What defines a clinically meaningful improvement?
  evaluation_instructions: "**Query to Analyze:** \"{input}\"\n\n# TASK: Primary Outcome Analysis\n\nAnalyze whether primary\
    \ outcomes are adequately specified.\n\n## Outcome Dimensions\n\n1. **Outcome Type**\n   - Clinical outcomes (mortality,\
    \ morbidity)\n   - Surrogate/biomarker outcomes\n   - Patient-reported outcomes (PROs)\n   - Functional outcomes\n   -\
    \ Safety/adverse events\n\n2. **Measurement Method**\n   - Specific instruments/scales\n   - Laboratory tests\n   - Imaging\
    \ modalities\n   - Validated questionnaires\n\n3. **Timepoint(s)**\n   - When outcomes measured\n   - Follow-up duration\n\
    \   - Multiple assessment points\n\n4. **Clinical Significance**\n   - Minimal clinically important difference (MCID)\n\
    \   - Target effect size\n   - Superiority vs non-inferiority\n\n5. **Primary vs Secondary**\n   - Is primary outcome\
    \ identified?\n   - Are secondary outcomes distinguished?\n"
  aspect_name: Primary Outcomes
  aspect_description: Specifies the main outcomes of interest including measurement methods, timepoints, and clinical significance
    thresholds.
  value_field_type: array
  value_field_description: 'The Specifies the main outcomes of interest including measurement methods, timepoints, and clinical
    significance thresholds.. Expected format: array of related items. Examples: "Effect of intervention on all-cause mortality
    at 5 years", "Change in HbA1c from baseline to 6 months, with target reduction ≥0.5%", "Quality of life measured by SF-36
    at 3, 6, and 12 months post-intervention".'
- id: study_design_context
  depends_on:
  - population_demographics
  - intervention_specification
  - comparison_group
  - primary_outcomes
  examples:
    clear:
    - statement: Multicenter RCT of drug A vs placebo in 500 patients with 12-month follow-up
      rationale: Study type (RCT), setting (multicenter), sample size (500), duration (12 months) all specified
    - statement: Double-blind placebo-controlled parallel-group trial across 20 US academic medical centers
      rationale: Design details (double-blind, placebo-controlled, parallel), setting (20 academic centers, US location)
    needs_refinement:
    - statement: Study comparing two treatments
      issue: Study design not specified
      missing: Study type, setting, duration
      example_question: What study design? (e.g., randomized controlled trial, observational cohort, systematic review)
    partial:
    - statement: RCT comparing interventions in hospital setting
      has: Study type (RCT), general setting (hospital)
      missing: Sample size, duration, specific hospital type, blinding approach
      example_question: What is your target sample size? Study duration? Single-center or multi-center?
  evaluation_instructions: "**Query to Analyze:** \"{input}\"\n\n# TASK: Study Design & Context Analysis\n\nAnalyze whether\
    \ study design and methodological context are specified.\n\n## Design Dimensions\n\n1. **Study Type**\n   - RCT (parallel,\
    \ crossover, cluster)\n   - Observational (cohort, case-control)\n   - Systematic review/meta-analysis\n   - Pragmatic\
    \ trial\n\n2. **Setting**\n   - Healthcare setting type\n   - Geographic scope\n   - Single-center vs multi-center\n\n\
    3. **Sample Size**\n   - Target enrollment\n   - Sample size rationale\n   - Power considerations\n\n4. **Duration**\n\
    \   - Study timeline\n   - Recruitment period\n   - Follow-up length\n\n5. **Special Considerations**\n   - Blinding/masking\n\
    \   - Randomization method\n   - Statistical approach\n   - Interim analyses\n"
  aspect_name: Study Design & Methodological Context
  aspect_description: Clarifies the intended study design, setting, sample size considerations, and methodological approach.
    Helps determine feasibility and appropriate statistical methods.
  value_field_type: object
  value_field_description: 'The Clarifies the intended study design, setting, sample size considerations, and methodological
    approach. Helps determine feasibility and appropriate statistical methods.. Expected format: object with relevant fields.
    Examples: "Multicenter RCT of drug A vs placebo in 500 patients with 12-month follow-up", "Double-blind placebo-controlled
    parallel-group trial across 20 US academic medical centers".'
