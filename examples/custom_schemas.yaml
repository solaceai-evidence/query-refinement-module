# Example Custom Schemas for Query Refinement
# 
# This file demonstrates how to define custom refinement schemas using YAML.
# Place this file in the path specified in CUSTOM_SCHEMAS_PATH environment variable

# ============================================================================
# Best structure for a Custom Schema using Research Field as example
# ============================================================================
id: field_of_study
name: Research Field
description: Clarify academic discipline

analysis_prompt: |
  Analyze the research field(s) and generate a refinement question if needed.

  Query: {query}

  **Step 1: Analyze**
  - MISSING: Query doesn't indicate which academic field(s)
  - AMBIGUOUS: Could span multiple fields or interdisciplinary
  - CLEAR: Field is obvious from terminology/context

  **Step 2: Generate Smart Question**

  Tailor options to the query:
  - Look at keywords to infer likely fields
  - Suggest interdisciplinary if query spans domains
  - Offer specific subfields if relevant

  Examples:

  Query: "machine learning for protein folding"
  Status: CLEAR (Computer Science + Biology)
  Question: null

  Query: "impact of social media"
  Status: AMBIGUOUS
  Question: "Social media impact could be studied from multiple angles. Which field perspective are you most interested in: Psychology/behavioral (individual effects), Sociology (social dynamics), Communication studies (information spread), Public health (mental health), or Political science (democracy/polarization)?"

  Query: "resilience in urban systems"
  Status: AMBIGUOUS
  Question: "Urban resilience is studied across disciplines. Which field perspective matters most for your search: Urban planning/design, Environmental science (climate adaptation), Sociology (community resilience), Engineering (infrastructure), or Economics (recovery capacity)?"

  Query: "neural networks"
  Status: MISSING
  Question: "What field perspective on neural networks? Options: Computer science/AI (algorithms/architectures), Neuroscience (biological neural networks), Cognitive science (computational models of cognition), or Applied fields (specific applications)?"

  Return JSON:
  {{
    "needs_refinement": true/false,
    "confidence": 0.0-1.0,
    "reasoning": "explanation",
    "status": "MISSING" / "AMBIGUOUS" / "CLEAR",
    "question": "field-specific question or null",
    "suggested_options": ["context-aware fields"]
  }}

metadata:
  priority: medium

# ============================================================================
# General Purpose Schema
# ============================================================================
my_custom_schema:
  - id: temporal_scope
    name: Temporal Scope
    description: Clarifies the time period or timeframe relevant to the query
    analysis_prompt: |
      Analyze the following query to determine if it needs temporal clarification:
      
      Query: {query}
      
      Consider:
      1. Is a specific time period mentioned (e.g., '2020-2023', 'last decade')?
      2. Are there temporal terms that need clarification (e.g., 'recent', 'current', 'historical')?
      3. Is the time scope implied by context (e.g., 'COVID-19 pandemic' implies 2019-present)?
      4. Would specifying a time period significantly improve the query?
      
      Respond in JSON format:
      {
        "needs_refinement": true/false,
        "reason": "Brief explanation",
        "suggested_question": "Question to ask the user if refinement needed"
      }
    allow_follow_up: true
    max_follow_ups: 2
    metadata:
      domain: general
      priority: high
      examples:
        - What time period should we focus on?
        - Are you interested in historical data or recent trends?

  - id: geographic_scope
    name: Geographic Scope
    description: Identifies the geographic region, location, or spatial scope of the query
    analysis_prompt: |
      Analyze the following query to determine if geographic scope needs clarification:
      
      Query: {query}
      
      Consider:
      1. Is a specific location mentioned (e.g., country, region, city)?
      2. Is the geographic scope implied (e.g., 'local policy' without specifying location)?
      3. Would specifying a location improve the query precision?
      4. Are there ambiguous location terms (e.g., 'global', 'regional')?
      
      Respond in JSON format:
      {
        "needs_refinement": true/false,
        "reason": "Brief explanation",
        "suggested_question": "Question to ask the user if refinement needed"
      }
    allow_follow_up: false
    max_follow_ups: 1
    metadata:
      domain: general
      priority: medium

# ============================================================================
# Research Methodology Schema
# ============================================================================
research_methodology:
  - id: study_design
    name: Study Design
    description: Specifies the type of research methodology or study design
    analysis_prompt: |
      Analyze if the query specifies or needs clarification on research methodology:
      
      Query: {query}
      
      Consider:
      1. Is a specific study design mentioned (RCT, cohort, case-control, meta-analysis)?
      2. Are there methodology requirements implied by the domain?
      3. Would specifying methodology improve result quality?
      
      Respond in JSON format:
      {
        "needs_refinement": true/false,
        "reason": "Brief explanation",
        "suggested_question": "Question to ask the user if refinement needed"
      }
    allow_follow_up: true
    max_follow_ups: 3
    metadata:
      domain: academic_research
      priority: high
      framework: Research Design

# ============================================================================
# Legal Research Schema (Demonstrates complex prompts)
# ============================================================================
legal_research:
  - id: source_type
    name: Legal Source Type
    description: Identifies the type of legal source needed
    analysis_prompt: |
      The query doesn't specify the type of legal source needed.
      
      Current query: {query}
      
      What type of legal source are you looking for? Please consider:
      - Case law (judicial opinions)?
        * Federal courts (District, Circuit, Supreme Court)
        * State courts (various levels)
        * Administrative decisions
      - Statutes or regulations?
        * Federal (U.S.C., C.F.R.)
        * State statutes
        * Local ordinances
      - Secondary sources (law review articles, treatises)?
        * Peer-reviewed journals
        * Legal encyclopedias
        * Practice guides
      - Legislative history?
        * Committee reports
        * Floor debates
        * Bill analyses
      - Administrative decisions?
        * Agency rulings
        * ALJ decisions
      
      IMPORTANT NOTES:
      - Multiple source types may be relevant
      - "Recent" in law might mean last 5-10 years
      - Consider jurisdiction-specific sources
      
      Generate ONE concise question to clarify the source type.
      
      Format your response as JSON:
      {
        "needs_refinement": true/false,
        "primary_concern": "brief explanation",
        "suggested_question": "your question here"
      }
    allow_follow_up: true
    max_follow_ups: 2
    metadata:
      domain: legal_research
      priority: high
      related_dimensions:
        - jurisdiction
        - temporal_scope

  - id: jurisdiction
    name: Jurisdiction
    description: Clarifies the legal jurisdiction applicable to the query
    analysis_prompt: |
      Analyze the query for jurisdiction clarity:
      
      Query: {query}
      
      Jurisdiction considerations:
      1. Is the jurisdiction explicitly stated?
         - Federal vs. State vs. International
         - Specific circuit or state if applicable
         - Local/municipal level if relevant
      
      2. Are there conflicts of law issues?
         - Multiple jurisdictions involved
         - Choice of law considerations
         - Interstate/international matters
      
      3. Is the jurisdiction implied by context?
         - Specific statutes (e.g., "ADA" implies federal US law)
         - Geographic references (e.g., "California" implies CA law)
      
      If jurisdiction is unclear or ambiguous, ask for clarification.
      
      Respond in JSON format:
      {
        "needs_refinement": true/false,
        "reason": "Brief explanation",
        "suggested_question": "Question to ask if clarification needed"
      }
    allow_follow_up: true
    max_follow_ups: 2
    metadata:
      domain: legal_research
      priority: high
      examples:
        - Which jurisdiction's law applies?
        - Are you looking for federal or state law?
        - Is this a specific circuit or nationwide?

# =============================================================================
# CLIMATE AND HUMANITARIAN CRISIS RESEARCH SCHEMA
# =============================================================================

climate_humanitarian_schema:
  - id: temporal_scope
    name: Time Period
    description: Clarify the temporal scope of research interest
    prompt_template: |
      The current query doesn't specify a time frame for the research.

      Current query: {query}

      To help narrow the search, I need to understand the temporal scope. Please consider:
      - Are you interested in recent studies (e.g., past 2-3 years)?
      - A specific historical period (e.g., post-2015 Paris Agreement)?
      - Seminal works regardless of publication date?
      - Research covering a specific time range of events (e.g., 2010-2020 climate data)?

      Generate ONE concise question to clarify the temporal scope.
    analysis_hint: check_for_year_range
    metadata:
      domain: climate_humanitarian
      priority: high
      examples:
        - past 5 years
        - since 2015
        - 2010-2020
        - recent studies

  - id: venue_specificity
    name: Publication Venue
    description: Clarify preferences for publication types and venues
    prompt_template: |
      The query doesn't specify publication venue preferences.

      Current query: {query}

      Understanding venue preferences helps refine the search. Please consider:
      - Do you prefer peer-reviewed journals over conference proceedings?
      - Are there specific high-impact venues you're interested in (e.g., Nature Climate Change, The Lancet Planetary Health)?
      - Should I include gray literature (reports, working papers)?
      - Any quality tier preferences (e.g., top-tier journals only)?

      Generate ONE concise question to clarify venue preferences.
    analysis_hint: check_for_venue_mention
    metadata:
      domain: climate_humanitarian
      priority: medium
      examples:
        - peer-reviewed journals
        - Nature
        - conference papers
        - top-tier venues

  - id: field_of_study
    name: Research Field
    description: Clarify the academic discipline or interdisciplinary focus
    prompt_template: |
      The query doesn't clearly specify the research field or discipline.

      Current query: {query}

      For climate and humanitarian research, which often spans multiple fields, please consider:
      - Primary discipline (e.g., atmospheric science, public health, economics, social science)?
      - Interdisciplinary focus (e.g., climate-health nexus, climate-migration)?
      - Specific subfield (e.g., climate modeling, disaster risk reduction, adaptation studies)?
      - Applied vs. theoretical research?

      Generate ONE concise question to clarify the field of study.
    analysis_hint: check_for_field_mention
    metadata:
      domain: climate_humanitarian
      priority: high
      examples:
        - public health
        - climate science
        - economics
        - interdisciplinary

  - id: methodology
    name: Research Methodology
    description: Clarify preferred research methods or study types
    prompt_template: |
      The query doesn't specify methodological preferences.

      Current query: {query}

      {context}

      Understanding methodology helps identify relevant research. Please consider:
      - Empirical studies (observational, experimental)?
      - Modeling or simulation studies?
      - Systematic reviews or meta-analyses?
      - Case studies or qualitative research?
      - Mixed-methods approaches?

      Generate ONE concise question to clarify methodological preferences.
    analysis_hint: check_for_methodology_keywords
    metadata:
      domain: climate_humanitarian
      priority: medium
      examples:
        - empirical studies
        - climate models
        - systematic review
        - case studies
      requires_context: true

  - id: geographic_scope
    name: Geographic Focus
    description: Clarify geographic region or scale of interest
    prompt_template: |
      The query doesn't specify a geographic focus.

      Current query: {query}

      Climate and humanitarian research often has strong geographic components. Please consider:
      - Global vs. regional studies?
      - Specific countries or regions (e.g., Sub-Saharan Africa, Small Island Developing States)?
      - Urban vs. rural contexts?
      - Developed vs. developing countries?

      Generate ONE concise question to clarify the geographic scope.
    analysis_hint: check_for_geographic_terms
    metadata:
      domain: climate_humanitarian
      priority: high
      examples:
        - global
        - Sub-Saharan Africa
        - coastal regions
        - urban areas

  - id: research_context
    name: Research Context
    description: Clarify the broader context or application area
    prompt_template: |
      The query could benefit from additional context about the research focus.

      Current query: {query}

      {context}

      For climate and humanitarian research, context matters. Please consider:
      - Policy-oriented vs. fundamental science?
      - Specific humanitarian context (e.g., conflict zones, natural disasters, displacement)?
      - Climate aspect (e.g., mitigation, adaptation, resilience, impacts)?
      - Stakeholder focus (e.g., vulnerable populations, policymakers, practitioners)?

      Generate ONE concise question to clarify the research context.
    analysis_hint: check_for_context_keywords
    metadata:
      domain: climate_humanitarian
      priority: medium
      examples:
        - adaptation
        - vulnerable populations
        - policy recommendations
        - disaster response
      requires_context: true

  - id: ambiguity_resolution
    name: Ambiguity Resolution
    description: Resolve ambiguous or underspecified terms in the query
    prompt_template: |
      The query contains terms that could be interpreted in multiple ways.

      Current query: {query}

      Ambiguous terms identified: {ambiguous_terms}

      {context}

      To ensure accurate results, I need clarification on these terms. Please consider:
      - Specific definitions or interpretations you have in mind
      - Technical vs. colloquial usage
      - Scope or boundaries of the concept

      Generate ONE concise question to resolve the most critical ambiguity.
    analysis_hint: detect_ambiguous_terms
    metadata:
      domain: climate_humanitarian
      priority: high
      examples:
        - resilience
        - sustainability
        - vulnerability
        - adaptation
      requires_ambiguous_terms: true
      requires_context: true

# =============================================================================
# PICO SCHEMA (Biomedical/Clinical Research)
# =============================================================================

pico_schema:
  - id: population
    name: Population (P)
    description: Define the patient population or participants
    prompt_template: |
      The query doesn't clearly define the target population.

      Current query: {query}

      In medical research, the population is critical. Please consider:
      - Patient demographics (age, sex, ethnicity)?
      - Health condition or disease state?
      - Clinical setting (inpatient, outpatient, primary care)?
      - Inclusion/exclusion criteria?
      - Specific subgroups or vulnerable populations?

      Generate ONE concise question to clarify the population of interest.
    analysis_hint: check_population_terms
    metadata:
      domain: biomedical
      framework: PICO
      priority: critical
      examples:
        - adults with type 2 diabetes
        - pediatric patients
        - pregnant women

  - id: intervention
    name: Intervention (I)
    description: Define the intervention, treatment, or exposure
    prompt_template: |
      The query doesn't clearly specify the intervention or exposure.

      Current query: {query}

      The intervention is a key component of clinical research. Please consider:
      - Specific treatment or therapy (drug, procedure, behavioral intervention)?
      - Dosage, duration, or frequency?
      - Comparison with standard care or placebo?
      - Diagnostic test or screening method?
      - Risk factor or exposure of interest?

      Generate ONE concise question to clarify the intervention.
    analysis_hint: check_intervention_terms
    metadata:
      domain: biomedical
      framework: PICO
      priority: critical
      examples:
        - aspirin 100mg daily
        - cognitive behavioral therapy
        - MRI screening

  - id: comparison
    name: Comparison (C)
    description: Define the comparison or control group
    prompt_template: |
      The query doesn't specify what the intervention should be compared against.

      Current query: {query}

      Understanding the comparison helps identify relevant studies. Please consider:
      - Placebo or no treatment?
      - Standard of care or usual treatment?
      - Alternative intervention?
      - Different dosage or timing?
      - No specific comparison needed?

      Generate ONE concise question to clarify the comparison.
    analysis_hint: check_comparison_terms
    metadata:
      domain: biomedical
      framework: PICO
      priority: high
      examples:
        - placebo
        - standard care
        - alternative treatment
        - no comparison

  - id: outcome
    name: Outcome (O)
    description: Define the outcome measures or endpoints
    prompt_template: |
      The query doesn't clearly specify the outcome of interest.

      Current query: {query}

      Outcome measures are essential for clinical research. Please consider:
      - Primary outcome (main effect you're interested in)?
      - Secondary outcomes?
      - Patient-reported outcomes (quality of life, symptoms)?
      - Clinical endpoints (mortality, morbidity, disease progression)?
      - Time frame for measuring outcomes?

      Generate ONE concise question to clarify the outcome measures.
    analysis_hint: check_outcome_terms
    metadata:
      domain: biomedical
      framework: PICO
      priority: critical
      examples:
        - mortality rate
        - symptom improvement
        - quality of life scores

  - id: study_design
    name: Study Design
    description: Clarify preferred study design or evidence type
    prompt_template: |
      The query doesn't specify a preferred study design.

      Current query: {query}

      Study design affects evidence quality. Please consider:
      - Randomized controlled trials (RCTs)?
      - Observational studies (cohort, case-control)?
      - Systematic reviews or meta-analyses?
      - Clinical guidelines?
      - Any study type acceptable?

      Generate ONE concise question to clarify study design preferences.
    analysis_hint: check_study_design_terms
    metadata:
      domain: biomedical
      framework: PICO
      priority: high
      examples:
        - RCTs
        - systematic reviews
        - cohort studies
        - meta-analyses

  - id: timeframe
    name: Timeframe
    description: Clarify the temporal scope of research
    prompt_template: |
      The query doesn't specify a timeframe for the research.

      Current query: {query}

      For clinical research, recency often matters. Please consider:
      - Recent evidence (past 5 years)?
      - Specific date range?
      - Landmark studies regardless of date?
      - Most current guidelines or recommendations?

      Generate ONE concise question to clarify the timeframe.
    analysis_hint: check_for_year_range
    metadata:
      domain: biomedical
      framework: PICO
      priority: medium
      examples:
        - past 5 years
        - since 2015
        - recent guidelines

# =============================================================================
# SPIDER SCHEMA (Sample, Phenomenon of Interest, Design, Evaluation, Research type)
# For qualitative and mixed-methods systematic reviews
# =============================================================================

spider_schema:
  - id: sample
    name: Sample (S)
    description: Define the sample or participants
    prompt_template: |
      The query doesn't clearly define the sample or participants.

      Current query: {query}

      For qualitative research, sample characteristics are important. Please consider:
      - Who are the participants (patients, healthcare workers, caregivers)?
      - Specific characteristics or demographics?
      - Setting or context?
      - Sample size or type (purposive, theoretical)?

      Generate ONE concise question to clarify the sample.
    analysis_hint: check_sample_terms
    metadata:
      domain: qualitative
      framework: SPIDER
      priority: high

  - id: phenomenon
    name: Phenomenon of Interest (PI)
    description: Define the phenomenon being studied
    prompt_template: |
      The query doesn't clearly specify the phenomenon of interest.

      Current query: {query}

      What is the focus of the investigation? Please consider:
      - Specific experience, behavior, or perception?
      - Social or psychological phenomenon?
      - Contextual factors or influences?
      - Process or mechanism?

      Generate ONE concise question to clarify the phenomenon.
    analysis_hint: check_phenomenon_terms
    metadata:
      domain: qualitative
      framework: SPIDER
      priority: critical

  - id: design
    name: Design (D)
    description: Specify the research design
    prompt_template: |
      The query doesn't specify a research design.

      Current query: {query}

      For qualitative research, design matters. Please consider:
      - Qualitative design (phenomenology, ethnography, grounded theory)?
      - Mixed-methods?
      - Specific data collection method (interviews, focus groups, observations)?

      Generate ONE concise question to clarify the design.
    analysis_hint: check_design_terms
    metadata:
      domain: qualitative
      framework: SPIDER
      priority: medium

  - id: evaluation
    name: Evaluation (E)
    description: Define the evaluation or outcome measures
    prompt_template: |
      The query doesn't specify what is being evaluated or measured.

      Current query: {query}

      What aspects are you interested in evaluating? Please consider:
      - Themes or categories?
      - Experiences or perceptions?
      - Barriers or facilitators?
      - Processes or mechanisms?

      Generate ONE concise question to clarify the evaluation focus.
    analysis_hint: check_evaluation_terms
    metadata:
      domain: qualitative
      framework: SPIDER
      priority: high

  - id: research_type
    name: Research Type (R)
    description: Specify the type of research
    prompt_template: |
      The query doesn't specify the research type.

      Current query: {query}

      What type of research are you looking for? Please consider:
      - Qualitative research?
      - Quantitative research?
      - Mixed-methods?
      - Specific research tradition (e.g., grounded theory, case study)?

      Generate ONE concise question to clarify the research type.
    analysis_hint: check_research_type_terms
    metadata:
      domain: qualitative
      framework: SPIDER
      priority: high

