      domain: legal
      priority: critical
      examples:
        - U.S. federal law
        - California
        - international human rights law

  - id: area_of_law
    name: Area of Law
    description: Specify the legal domain or practice area
    prompt_template: |
      The query doesn't clearly specify the area of law.

      Current query: {query}

      What area of law is relevant? Please consider:
      - Civil vs. criminal?
      - Specific practice area (e.g., contract, tort, constitutional, employment)?
      - Substantive vs. procedural law?
      - Emerging areas (e.g., technology law, environmental law)?

      Generate ONE concise question to clarify the area of law.
    analysis_hint: check_legal_area_terms
    metadata:
      domain: legal
      priority: critical
      examples:
        - contract law
        - criminal procedure
        - constitutional rights

  - id: source_type
    name: Source Type
    description: Specify the type of legal source
    prompt_template: |
      The query doesn't specify the type of legal source needed.

      Current query: {query}

      What type of legal source are you looking for? Please consider:
      - Case law (judicial opinions)?
      - Statutes or regulations?
      - Secondary sources (law review articles, treatises)?
      - Legislative history?
      - Administrative decisions?

      Generate ONE concise question to clarify the source type.
    analysis_hint: check_source_type_terms
    metadata:
      domain: legal
      priority: high
      examples:
        - case law
        - federal statutes
        - law review articles

  - id: time_period
    name: Time Period
    description: Clarify the relevant time period
    prompt_template: |
      The query doesn't specify a time period.

      Current query: {query}

      When is relevant for legal research? Please consider:
      - Current law only?
      - Historical analysis (specific date range)?
      - Landmark cases regardless of date?
      - Recent developments (e.g., past 5 years)?

