    additional_fields:
      methodology_found: string
      relevant_methods: array
    field_descriptions:
      needs_refinement: Whether methodology needs clarification
      explanation: Brief explanation of the methodology assessment
      clarifying_question: Question to ask about methodology
      methodology_found: Any methodology mentioned in the query
      relevant_methods: List of methodology types relevant to this query
  allow_follow_up: true
  max_follow_ups: 2
  metadata:
    domain: academic_research
    priority: high
  refinement_instructions: 'Analyze methodology specification:


    Query: {query}


    Check for mentions of:

    - Study design (RCT, cohort, case-control, qualitative, etc.)

    - Data collection methods

    - Analysis approaches

    - Sample size requirements

    '
  aspect_name: Research Methodology
  aspect_description: Clarifies research methods or study design
