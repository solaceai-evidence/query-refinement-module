# This schema helps Master of Public Health students clarify and refine their dissertation topic/query.

mph_dissertation:
  - id: public_health_topic
    name: Public Health Topic
    description: Specify the main public health topic or issue.
    analysis_prompt: |
      Check if the public health topic is specific, well-defined, and actionable.
      Consider whether the topic sets a clear scope for the research and is relevant to public health.
      Examples of well-defined topics: "Obesity prevention in urban children", "Tobacco control policies in adolescents".
    allow_follow_up: true
    max_follow_ups: 2
    examples:
      clear:
        - query: "Obesity prevention in urban children"
          explanation: "Topic is specific and actionable."
        - query: "Tobacco control policies in adolescents"
          explanation: "Topic is focused on a specific population and intervention."
      needs_refinement:
        - query: "Public health interventions"
          issue: "Too broad"
          suggested_question: "Which intervention or health issue? For example: infectious disease prevention, tobacco control, nutrition programs."
        - query: "Health promotion"
          issue: "Vague topic"
          suggested_question: "Which aspect of health promotion? For example: physical activity, mental health, healthy eating."
      partial:
        - query: "Obesity prevention in children"
          has: "Population and intervention are supplied."
          missing: "Setting (urban/rural) and age range."
          suggested_question: "Which age group and setting? For example: ages 6-12 in urban schools, ages 13-18 in rural communities."
        - query: "Tobacco control policies"
          has: "Intervention is clear."
          missing: "Target population and location."
          suggested_question: "Which population and where? For example: adolescents in London, adults in rural India."
      ambiguous:
        - query: "Chronic disease prevention in young people"
          issue: "'Young people' is ambiguous."
          suggested_question: "What age range defines 'young people'? For example: ages 10-18, ages 15-25."
        - query: "Health improvement in communities"
          issue: "'Communities' is vague."
          suggested_question: "Which communities or locations? For example: urban neighborhoods, rural villages, school communities."
      other:
        - query: "Obesity prevention in children aged exactly 10"
          note: "Overly narrow age filter may limit evidence."
          guidance: "Consider a broader age range."
          suggested_question: "Would 8-12 years be acceptable? For example: ages 8-12, ages 6-14."
        - query: "Tobacco control in rural villages with <500 population"
          note: "Very specific setting may reduce available studies."
          guidance: "Is a larger population size acceptable?"
          suggested_question: "Should we include villages up to 2000 people? For example: villages with 500-2000 people, small towns."

  - id: research_question
    depends_on:
      - public_health_topic
    name: Research Question
    description: State the main research question or hypothesis.
    analysis_prompt: |
      Check if the research question is clear, focused, and researchable.
      It should relate directly to the public health topic and specify the aim, variables, or relationships to be investigated.
      Consider if the question is specific enough to guide study design and measurable outcomes.
    allow_follow_up: true
    max_follow_ups: 2
    examples:
      clear:
        - query: "What is the impact of school-based nutrition programs on BMI in children?"
          explanation: "Question is focused and researchable."
        - query: "Does air pollution increase asthma rates in urban areas?"
          explanation: "Question is specific and measurable."
      needs_refinement:
        - query: "How do interventions help?"
          issue: "Too broad"
          suggested_question: "Help in what context or population? For example: children in schools, elderly in care homes, adults in workplaces."
        - query: "What are the effects?"
          issue: "Unclear what is being measured"
          suggested_question: "Effects of what intervention or exposure? For example: nutrition programs, air pollution, physical activity."
      partial:
        - query: "Impact of nutrition programs on children"
          has: "Intervention and population are supplied."
          missing: "Specific outcome and age range."
          suggested_question: "Which outcome and age group? For example: BMI reduction in ages 6-12, improved nutrition knowledge in ages 10-15."
        - query: "Air pollution and asthma"
          has: "Exposure and disease are supplied."
          missing: "Location and population details."
          suggested_question: "Which city or age group? For example: children in London, teenagers in Delhi."
      ambiguous:
        - query: "Effect of interventions on health"
          issue: "'Interventions' and 'health' are both vague."
          suggested_question: "Which intervention and health outcome? For example: physical activity and cardiovascular health, nutrition and diabetes risk."
        - query: "Does environment affect children?"
          issue: "'Environment' is ambiguous."
          suggested_question: "Which environmental factor? For example: air pollution, noise, access to green spaces."
      other:
        - query: "Impact of nutrition programs on children aged exactly 7"
          note: "Narrow age filter may exclude relevant studies."
          guidance: "Consider a wider age range."
          suggested_question: "Would 6-10 years be acceptable? For example: ages 6-10, ages 5-12."
        - query: "Air pollution effects in one specific neighborhood"
          note: "Single neighborhood may not yield enough data."
          guidance: "Is a broader area acceptable?"
          suggested_question: "Should we include multiple neighborhoods? For example: several neighborhoods in the same city, multiple districts."

  - id: study_design
    name: Study Design
    description: Specify the type of study or methodological approach.
    analysis_prompt: |
      Check if the study design is clearly specified and appropriate for the research question.
      Acceptable designs include cross-sectional surveys, randomized controlled trials, cohort studies, or case-control studies.
      Consider whether the design is feasible and supports valid, reliable findings.
    allow_follow_up: true
    max_follow_ups: 2
    depends_on:
      - research_question
    examples:
      clear:
        - query: "Cross-sectional survey of school children"
          explanation: "Design is clear."
        - query: "Randomized controlled trial of vaccination uptake"
          explanation: "Design is specific and appropriate."
      needs_refinement:
        - query: "Survey"
          issue: "Unclear type of survey or design"
          suggested_question: "Is it cross-sectional, longitudinal, or another type? For example: cross-sectional survey, longitudinal cohort study."
        - query: "Observational study"
          issue: "Type of observational study not specified"
          suggested_question: "Is it cohort, case-control, or cross-sectional? For example: cohort study of school children, case-control study of asthma."
      partial:
        - query: "Survey of vaccination attitudes"
          has: "Survey and topic are supplied."
          missing: "Population and survey type."
          suggested_question: "Which population and survey design? For example: parents of children under 5, cross-sectional survey."
        - query: "Observational study of nutrition"
          has: "Study type and topic are supplied."
          missing: "Design details and population."
          suggested_question: "Is it cohort, case-control, or cross-sectional? For example: cohort study of dietary habits, cross-sectional study of BMI."
      ambiguous:
        - query: "Longitudinal study of health outcomes"
          issue: "'Longitudinal' is ambiguous without time frame."
          suggested_question: "What duration and follow-up period? For example: 2 years, 5 years, annual follow-up."
        - query: "Survey of attitudes"
          issue: "'Attitudes' is vague."
          suggested_question: "Which attitudes or beliefs? For example: attitudes towards vaccination, beliefs about healthy eating."
      other:
        - query: "Survey of vaccination attitudes in children aged exactly 12"
          note: "Narrow age filter may limit evidence."
          guidance: "Consider a broader age range."
          suggested_question: "Would 10-14 years be acceptable? For example: ages 10-14, ages 8-16."
        - query: "Observational study in one school only"
          note: "Single school may not yield enough data."
          guidance: "Is a broader sample acceptable?"
          suggested_question: "Should we include multiple schools? For example: several schools in the same district, schools in different regions."

  - id: population
    depends_on:
      - public_health_topic
    name: Population
    description: Define the target population for the study.
    analysis_prompt: |
      Check if the population is clearly specified, including age, location, risk group, or other relevant characteristics.
      Consider whether the population is well-described for relevance and generalizability.
    allow_follow_up: true
    max_follow_ups: 2
    examples:
      clear:
        - query: "Children aged 6-12 in London"
          explanation: "Population is specific."
        - query: "Adults over 65 in rural India"
          explanation: "Population is well-defined by age and location."
      needs_refinement:
        - query: "Children"
          issue: "Unspecified age or location"
          suggested_question: "Which age range or geographic area? For example: ages 6-12, children in London, children in rural areas."
        - query: "Elderly"
          issue: "Unspecified age and location"
          suggested_question: "What age group and where? For example: adults over 65 in India, elderly in care homes."
      partial:
        - query: "Children in London"
          has: "Population and location are supplied."
          missing: "Age range and risk group."
          suggested_question: "Which age group and risk factors? For example: ages 6-12, children with asthma, children at risk of obesity."
        - query: "Adults in India"
          has: "Population and country are supplied."
          missing: "Specific region and age range."
          suggested_question: "Which region and age group? For example: adults in northern India, ages 30-50."
      ambiguous:
        - query: "Young adults in rural areas"
          issue: "'Young adults' and 'rural areas' are ambiguous."
          suggested_question: "What age range and which rural areas? For example: ages 18-25 in rural Punjab, ages 20-30 in farming communities."
        - query: "Children at risk"
          issue: "'At risk' is vague."
          suggested_question: "What risk factors? For example: children at risk of diabetes, children exposed to secondhand smoke."
      other:
        - query: "Children aged exactly 6 in London"
          note: "Narrow age filter may limit evidence."
          guidance: "Consider a broader age range."
          suggested_question: "Would 5-8 years be acceptable? For example: ages 5-8, ages 4-10."
        - query: "Adults over 65 in one village only"
          note: "Single village may not yield enough data."
          guidance: "Is a broader sample acceptable?"
          suggested_question: "Should we include multiple villages? For example: several villages in the same region, villages with similar demographics."

  - id: expected_impact
    depends_on:
      - research_question
      - study_design
    name: Expected Impact
    description: State the expected public health benefit or outcome.
    analysis_prompt: |
      Check if the expected impact is specific, measurable, and directly linked to the research question and topic.
      Consider health indicators, behavioral changes, or policy implications.
    allow_follow_up: true
    max_follow_ups: 2
    examples:
      clear:
        - query: "Reduction in BMI and improved nutrition knowledge"
          explanation: "Impact is clear and measurable."
        - query: "Decrease in smoking rates and improved lung function"
          explanation: "Impact is specific and measurable."
      needs_refinement:
        - query: "Better health"
          issue: "Vague impact"
          suggested_question: "What specific health outcome or metric? For example: reduction in BMI, improved lung function, increased physical activity."
        - query: "Positive outcomes"
          issue: "Unspecified outcomes"
          suggested_question: "Which outcomes or indicators? For example: lower smoking rates, higher vaccination coverage."
      partial:
        - query: "Reduction in BMI in children"
          has: "Outcome and population are supplied."
          missing: "Setting and intervention."
          suggested_question: "Which setting and intervention? For example: school-based programs, community health clinics."
        - query: "Decrease in smoking rates"
          has: "Outcome is supplied."
          missing: "Population and intervention."
          suggested_question: "Which population and what intervention? For example: adults in urban areas, tobacco tax policy."
      ambiguous:
        - query: "Improved health outcomes"
          issue: "'Health outcomes' is vague."
          suggested_question: "Which outcomes or metrics? For example: BMI, blood pressure, asthma rates."
        - query: "Positive impact on wellbeing"
          issue: "'Wellbeing' is ambiguous."
          suggested_question: "What aspect of wellbeing? For example: mental wellbeing, social connectedness, physical activity."
      other:
        - query: "Reduction in BMI for children aged exactly 9"
          note: "Narrow age filter may limit evidence."
          guidance: "Consider a broader age range."
          suggested_question: "Would 7-12 years be acceptable? For example: ages 7-12, ages 6-14."
        - query: "Decrease in smoking rates in one city only"
          note: "Single city may not yield enough data."
          guidance: "Is a broader sample acceptable?"
          suggested_question: "Should we include multiple cities? For example: several cities in the same region, cities with similar population sizes."
