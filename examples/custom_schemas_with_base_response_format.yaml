basic_schema:
- id: temporal_scope
  allow_follow_up: true
  metadata:
    domain: general
  refinement_instructions: 'Analyze the following query for temporal clarity:


    Query: {query}


    Determine if the time scope is clear or needs clarification.

    '
  aspect_name: Temporal Scope
  aspect_description: Clarifies the time period relevant to the query
intermediate_schema:
- id: geographic_scope
  response_format:
    type: json
    additional_fields:
      priority: string
      detected_locations: array
    field_descriptions:
      priority: Urgency of clarification (high/medium/low)
      detected_locations: List of geographic locations detected in the query
  allow_follow_up: false
  metadata:
    domain: general
  refinement_instructions: 'Analyze the following query for geographic clarity:


    Query: {query}


    Determine if the location/region is clear or needs clarification.

    '
  aspect_name: Geographic Scope
  aspect_description: Identifies the geographic scope of the query
research_methodology:
- id: study_design
  response_format:
    type: json
    additional_fields:
      confidence_score: float
      detected_methodologies: array
      recommended_methodologies: array
      complexity_level: string
    field_descriptions:
      confidence_score: Confidence in the assessment (0.0 = uncertain, 1.0 = certain)
      detected_methodologies: List of research methodologies mentioned in the query
      recommended_methodologies: Suggested methodologies based on query context
      complexity_level: Assessment of methodological complexity (simple/moderate/complex)
  allow_follow_up: true
  max_follow_ups: 3
  metadata:
    domain: academic_research
    priority: high
  refinement_instructions: 'Analyze the query for research methodology clarity:


    Query: {query}


    Assess if the study design or methodology is specified or needs clarification.

    '
  aspect_name: Study Design
  aspect_description: Clarifies research methodology requirements
legal_research:
- id: source_type
  response_format:
    type: json
    additional_fields:
      detected_source_types: array
      suggested_source_types: array
      jurisdiction_clarity: string
      temporal_clarity: string
    field_descriptions:
      detected_source_types: Legal source types detected in the query
      suggested_source_types: Recommended legal source types for this query
      jurisdiction_clarity: Assessment of jurisdiction clarity (clear/unclear/missing)
      temporal_clarity: Assessment of temporal scope clarity (clear/unclear/missing)
  allow_follow_up: true
  max_follow_ups: 2
  metadata:
    domain: legal_research
    priority: high
    related_dimensions:
    - jurisdiction
    - temporal_scope
  refinement_instructions: 'The query doesn''t specify the type of legal source needed.


    Current query: {query}


    What type of legal source are you looking for? Please consider:

    - Case law (judicial opinions)?

    - Statutes or regulations?

    - Secondary sources (law review articles, treatises)?

    - Legislative history?

    - Administrative decisions?

    '
  aspect_name: Legal Source Type
  aspect_description: Identifies the type of legal source needed
medical_pico:
- id: population
  response_format:
    type: json
    additional_fields:
      detected_population_characteristics: array
      missing_characteristics: array
      specificity_score: float
      inclusion_criteria_clarity: string
      exclusion_criteria_clarity: string
    field_descriptions:
      detected_population_characteristics: Population characteristics found in query
        (age, gender, conditions, etc.)
      missing_characteristics: Important population characteristics not specified
      specificity_score: How specific the population definition is (0.0 = vague, 1.0
        = very specific)
      inclusion_criteria_clarity: Clarity of inclusion criteria (clear/partial/missing)
      exclusion_criteria_clarity: Clarity of exclusion criteria (clear/partial/missing)
  allow_follow_up: true
  max_follow_ups: 2
  metadata:
    domain: medical_research
    framework: PICO
    priority: critical
  refinement_instructions: 'Analyze the query for population/patient clarity:


    Query: {query}


    Assess if the target population is clearly specified.

    '
  aspect_name: Population/Patient
  aspect_description: Clarifies the target population or patient group
