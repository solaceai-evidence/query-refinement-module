pico_advanced:
  - id: population_demographic
    aspect_name: Population Demographic
    aspect_description: Defines the target population's basic demographic characteristics including age range, gender, ethnicity, but excluding geographic scope and clinical setting
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### Objective:
      Evaluate whether the population demographic specification is clearly and specifically defined for:
      1. Study replication
      2. Results generalization
      3. Ethical review requirements

      ### Evaluation Criteria:
           Assess clarity and completeness across: 
           - Age (explicit range or threshold)
           - Sex / gender (specified or all-inclusive)
           - Ethnicity (when relevant)
    examples:
      clear:
        - statement: Efficacy of metformin in adults aged 40-65 with BMI > 30
          rationale: Age range precisely defined (40-65), specific population characteristic (BMI > 30)
        - statement: Postmenopausal women aged 50-70 in urban clinical settings
          rationale: Age (50-70), gender (women), life stage (postmenopausal)
        - statement: African American males aged 18-45 with hypertension in community health centers
          rationale: "Complete population demographic profile: ethnicity, gender, age range"
      needs_refinement:
        - statement: Does exercise reduce depression in adults?
          issue: "'Adults' is too broad - could range from 18 to 100+ years"
          missing: Specific age range, gender considerations, geographic scope
          example_question:
            "What age range are you targeting? For example: young adults
            (18-35), middle-aged (36-64), or older adults (65+)?"
        - statement: Study on diabetes management in elderly patients
          issue: "'Elderly' is ambiguous - definitions vary from 60+ to 80+"
          missing: Precise age threshold, gender, setting
          example_question: "What specific age threshold defines 'elderly' for your study? (e.g., 65+, 70+, 75+)"
        - statement: Treatment outcomes in minority populations
          issue: "'Minority populations' is vague and could mean multiple groups"
          missing: Specific ethnic/racial groups, age, gender
          example_question: Which specific population groups are you focusing on? (e.g., Hispanic/Latino, African American, Asian, Native American)
      partial:
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women) and minimum age (40)
          missing: Upper age limit, ethnicity (if CVD disparities relevant), geographic setting
          example_question: Is there an upper age limit? Are you focusing on specific ethnic groups given CVD disparities?
        - statement: Pediatric patients in tertiary care hospitals
          has: Age category (pediatric) and setting (tertiary care)
          missing: Specific age range within pediatrics (neonates, infants, children, adolescents?)
          example_question: What age range within pediatrics? (0-1 year, 1-12 years, 12-18 years, or all pediatric ages)
      other:
        - statement: Mindfulness program outcomes for exactly 40-year-old women diagnosed with postpartum depression within the last month
          note: Extremely narrow demographic qualifiers can cause the literature search to miss closely related evidence (e.g., 35-45).
          guidance: Confirm whether the researcher is open to a broader age band or postpartum window before locking the filters.
          example_question: Should we expand the age or postpartum interval to capture more applicable studies?
      vague_ambiguous:
        - statement: Middle-aged adults in diverse communities
          issue: Both 'middle-aged' (typically 40-65 but varies) and 'diverse' are ambiguous
          example_question: "Can you specify: 1) Exact age range for 'middle-aged', and 2) What dimensions of diversity matter (ethnic, socioeconomic, geographic)?"
        - statement: Study in representative population sample
          issue: "'Representative' is context-dependent - representative of what population?"
          example_question: What population should this sample represent? Please specify demographic characteristics that define representativeness.

  - id: geographic_location
    aspect_name: Geographic Location & Setting
    aspect_description: |
      Captures the geographic context referenced in a clinical research query country, region, city, healthcare setting, and recruitment environment. Precise location details clarify generalizability and feasibility
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### Objective:
        Determine whether the geographic location and setting are sufficiently specified to support:
          - replication
          - generalization
          - feasibility

      ### Considerations
        1. Country/Region/City: Is a specific place named (e.g., "Spain", "New York City", "West Africa")?
        2. Healthcare Setting: Is the care context defined (e.g., "tertiary hospital", "community clinic", "home-based care")?
        3. Recruitment Context: Is the population tied to a clear study context (e.g., "urban academic centers", "rural outreach programs")?
    examples:
      clear:
        - statement: Hypertension management in rural community health districts in India
          rationale: Country (India), setting (district health services), and scope are explicit.
        - statement: Diabetes outcomes monitored at tertiary care centers across São Paulo
          rationale: City (São Paulo) and facility type (tertiary centers) are clearly defined.
        - statement: Asthma prevalence studies conducted in city hospitals in Nairobi
          rationale: City (Nairobi) and care setting (city hospitals) anchor the location.
      needs_refinement:
        - statement: Cancer treatment in local hospitals
          issue: "'Local hospitals' lacks any location reference"
          missing: City, region, or country identifiers.
          example_question: Which city, region, or country do the 'local hospitals' refer to?
        - statement: Global trial enrolling patients from multiple continents
          issue: Continents alone are too broad for planning.
          missing: Specific countries, regions, or sites.
          example_question: Which countries or regions will the trial cover?
      partial:
        - statement: Outcomes tracked in hospitals in Europe
          has: Region (Europe) and setting (hospitals).
          missing: hospital typology
          note: Europe is broad; confirm whether that level of granularity is acceptable.
          example_question: Is Europe specific enough for your study, or can you point to a country/city and hospital type?
        - statement: Diabetes care delivered through clinics
          has: Care setting (clinics).
          missing: Geographic location of those clinics.
          example_question: Where are these clinics located (country, region, or city)?
      vague_ambiguous:
        - statement: Treatment studies in representative settings
          issue: "'Representative' has no geographic anchor."
          example_question: Which specific settings (cities, regions, or countries) are considered representative?
        - statement: Research in diverse communities
          issue: "'Diverse communities' lacks locational detail."
          example_question: Which communities and locations define 'diverse' in this context?

  - id: population_clinical_profile
    aspect_name: Clinical Profile & Health Status
    aspect_description: "Specifies the primary health condition, disease stage, severity, comorbidities, and relevant medical history. Critical for defining study eligibility and expected treatment responses."
    depends_on:
      - population_demographic
      - geographic_location
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### Objective
        Evaluate whether the clinical profile and health status specification enables:
          - Accurate patient identification and recruitment
          - Appropriate treatment selection
          - Valid outcome interpretation

      ### Clinical Profile Dimensions
        1. Primary Condition/Diagnosis
          - Is the main health condition clearly identified?
          - Is it specific enough? (e.g., "Type 2 diabetes" vs "diabetes")
        2. Disease Stage/Phase
          - Is staging mentioned when relevant?
          - Examples: early-stage, advanced, acute, chronic, remission
        3. Severity Level
          - Is severity specified?
          - Examples: mild, moderate, severe,
        4. Comorbidities
          - Are concurrent conditions mentioned?
          - Are exclusions for contraindicated comorbidities specified?
        5. Treatment History
          - Is prior treatment status mentioned?
          - Examples: treatment-naive, refractory, previously treated
        6. Diagnostic Criteria
          - Are diagnostic standards mentioned?
          - Examples: ICD codes, clinical guidelines, biomarker thresholds
    examples:
      clear:
        - statement: Efficacy of SGLT2 inhibitors in Type 2 diabetes patients with HbA1c 7.5-10%, treatment-naive
          rationale: Specific condition (Type 2 diabetes), severity marker (HbA1c 7.5-10%), treatment history (naive)
        - statement: Outcomes of immunotherapy in stage IIIB non-small cell lung cancer, ECOG performance status 0-1
          rationale: Precise diagnosis, stage (IIIB), cancer type (NSCLC), functional status (ECOG 0-1)
        - statement: Management of acute severe asthma exacerbations requiring emergency department care
          rationale: Condition (asthma), phase (acute), severity (severe), setting context (ED care required)
      needs_refinement:
        - statement: Treatment for diabetic patients
          issue: Diabetes type not specified - Type 1, Type 2, gestational, MODY, etc. have different treatments
          missing: Disease type, severity, duration, complications
          example_question: What type of diabetes? (Type 1, Type 2, gestational) And what level of glycemic control? (e.g., HbA1c range)
        - statement: Study on cancer treatment outcomes
          issue: No cancer type, stage, or histology specified
          missing: Cancer type, stage, grade, molecular markers
          example_question: Which cancer type and stage are you studying? Are there specific histological or molecular characteristics?
        - statement: Intervention in patients with heart problems
          issue: "'Heart problems' is far too vague - hundreds of cardiac conditions exist"
          missing: Specific cardiac diagnosis, severity, functional class
          example_question: What specific cardiac condition? (e.g., heart failure, coronary artery disease, arrhythmia) And what severity?
      partial:
        - statement: Effects of statins in patients with moderate hyperlipidemia
          has: Condition (hyperlipidemia) and severity (moderate)
          missing: Specific lipid ranges defining 'moderate', comorbidities, prior treatment attempts
          example_question: What LDL or total cholesterol range defines 'moderate' for your study? Any relevant comorbidities or prior statin use?
        - statement: Study in hypertensive patients with diabetes
          has: Two conditions specified (hypertension, diabetes)
          missing: BP range, diabetes type, severity of both conditions, other comorbidities
          example_question: What BP range defines hypertension in your study? What type and control level of diabetes?
      vague_ambiguous:
        - statement: Treatment in patients with refractory disease
          issue: "'Refractory' to which treatments? How many prior treatment failures?"
          example_question: Refractory to which specific treatments? How many prior treatment lines? What defines 'refractory' in your protocol?
        - statement: Study in high-risk cardiovascular patients
          issue: "'High-risk' is subjective - needs risk score or specific criteria"
          example_question: What defines 'high-risk'? (e.g., Framingham score, specific risk factors, prior events)

  - id: intervention_specification
    aspect_name: Intervention Specification
    aspect_description: Details the treatment, procedure, or exposure being studied including specific agents, dosing, duration, frequency, and delivery method
    depends_on:
      - population_demographic
      - geographic_location
      - population_clinical_profile
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### Objective
       Analyze whether the intervention is sufficiently detailed for study replication

      ### Assess clarity and completeness across the following Intervention Dimensions
       1. Intervention Type
          - Pharmacological (drug, biologic)
          - Procedural (surgery, device)
          - Behavioral (therapy, lifestyle)
          - Diagnostic (test, screening)
       2. Specific Agent/Method
         - Generic/brand name for drugs
         - Specific procedure or technique
         - Defined behavioral protocol
       3. Dosing/Intensity (if applicable)
         - Dose amount and units
         - Frequency (daily, weekly)
         - Timing (morning, with meals)
       4. Duration
         - Treatment length
         - Follow-up period
       5. Delivery Method
         - Route (oral, IV, subcutaneous)
         - Setting (inpatient, outpatient, home)
         - Provider type
       6. Adjunct Treatments
         - Concurrent therapies
         - Background medications
         - Supportive care protocols
    examples:
      clear:
        - statement:
            Metformin 1000mg twice daily for 6 months vs placebo in newly diagnosed
            Type 2 diabetes
          rationale:
            Drug (metformin), dose (1000mg), frequency (twice daily), duration
            (6 months), comparison (placebo)
        - statement:
            Laparoscopic Roux-en-Y gastric bypass performed by experienced bariatric
            surgeons
          rationale:
            Specific surgical technique (laparoscopic Roux-en-Y), provider
            qualification (experienced bariatric surgeons)
        - statement:
            Cognitive Behavioral Therapy, 12 weekly 60-minute sessions delivered
            by licensed clinical psychologists
          rationale:
            Therapy type (CBT), frequency (weekly), duration (12 sessions),
            session length (60 min), provider (licensed psychologists)
      needs_refinement:
        - statement: Effects of medication on blood pressure
          issue: No medication specified, no dosing information
          missing: Drug name, dose, frequency, duration, route
          example_question:
            Which medication are you studying? Please specify the drug
            name, dose, frequency, and treatment duration.
        - statement: Study on surgery outcomes
          issue: Type of surgery not specified
          missing: Surgical procedure, approach (open vs laparoscopic), setting
          example_question:
            What specific surgical procedure? What surgical approach?
            (e.g., open, laparoscopic, robotic)
        - statement: Exercise intervention for weight loss
          issue: Exercise type, intensity, frequency, duration all unspecified
          missing:
            Exercise modality, intensity level, frequency, session duration, total
            program length
          example_question:
            What type of exercise? (aerobic, resistance, both) What
            intensity, frequency, and program duration?
      partial:
        - statement: Atorvastatin treatment for hyperlipidemia
          has: Drug name (atorvastatin), indication (hyperlipidemia)
          missing: Dose, frequency, treatment duration, titration protocol
          example_question:
            What dose of atorvastatin? (10mg, 20mg, 40mg, 80mg) What
            frequency and treatment duration?
        - statement: Physical therapy twice weekly for knee osteoarthritis
          has: Intervention type (physical therapy), frequency (twice weekly), condition
          missing:
            Specific PT protocol, session duration, total treatment length, therapy
            components
          example_question:
            What specific PT protocol? How long are sessions? What is
            the total treatment duration?
      vague_ambiguous:
        - statement: High-dose vitamin D supplementation
          issue:
            "'High-dose' is relative - could be 2,000 IU or 50,000 IU depending
            on context"
          example_question:
            What specific dose of vitamin D? (e.g., 2,000 IU daily,
            50,000 IU weekly)
        - statement: Intensive glycemic control in diabetes
          issue: "'Intensive' is subjective - needs target HbA1c or glucose range"
          example_question:
            What target defines 'intensive control'? (e.g., HbA1c <6.5%,
            fasting glucose 80-110 mg/dL)

  - id: comparison_group
    aspect_name: Comparison/Control Group
    aspect_description: "Defines what the intervention is compared against: placebo, standard care, alternative treatment, or no treatment. Critical for establishing causality"
    depends_on:
      - intervention_specification
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### Objective
        Analyze whether an appropriate comparison/control group is specified.
        Key Questions:
        - Is a comparator mentioned?
        - Is the comparator appropriate for the research question?
        - Is the comparator as well-defined as the intervention?
        - Are ethical considerations addressed (especially for no-treatment controls)?

      ### Comparison Types
        1. Placebo Control
          - Inert substance/sham procedure
          - Blinding considerations
        2. Standard Care/Treatment
          - Current guideline-recommended treatment
          - Usual care protocols
        3. Alternative Active Treatment
          - Different drug/dose/intervention
          - Head-to-head comparison
        4. No Treatment
          - Watchful waiting
          - Natural history observation
        5. Dose Comparison
          - Different doses of same intervention
    examples:
      clear:
        - statement: Metformin vs placebo in prediabetic adults
          rationale: Clear active intervention (metformin) vs inert control (placebo)
        - statement: New anticoagulant compared to warfarin (standard care) in atrial fibrillation
          rationale: Novel treatment vs established standard of care explicitly stated
        - statement: High-intensity statins vs moderate-intensity statins in secondary prevention
          rationale: Head-to-head comparison of two active dose strategies
      needs_refinement:
        - statement: Effects of new drug on blood pressure
          issue: No comparison group mentioned
          missing: Comparator specification
          example_question:
            What will you compare the new drug against? (e.g., placebo,
            current standard treatment, another active drug)
        - statement: Study of surgical intervention
          issue: No comparison - surgery vs what?
          missing: Control/comparison group
          example_question:
            What is the comparison? (e.g., surgery vs medical management,
            surgery vs observation, one surgical technique vs another)
      partial:
        - statement: Cognitive therapy vs usual care in depression
          has: Intervention (cognitive therapy) and comparison type (usual care)
          missing: "'Usual care' not defined - varies by setting and provider"
          example_question:
            Can you specify what 'usual care' includes in your setting?
            (e.g., medications only, supportive counseling, monitoring frequency)
        - statement: New treatment compared to current options
          has: Comparison concept mentioned
          missing: Specific comparator not identified
          example_question:
            What specific current treatment(s) will serve as the comparator?
            (e.g., specific drug names, specific procedures)
      vague_ambiguous:
        - statement: Drug A versus control in hypertension
          issue: "'Control' could mean placebo, standard care, or no treatment"
          example_question: What does 'control' mean in your study? (placebo, standard antihypertensive therapy, or no treatment)
        - statement: Intervention vs standard therapy
          issue: "'Standard therapy' varies by geography, guidelines, and time period"
          example_question: What specific treatment(s) constitute 'standard therapy' in your context? (e.g., specific drugs, specific guidelines)

  - id: primary_outcomes
    aspect_name: Primary Outcomes
    aspect_description: "Specifies the main outcomes of interest including measurement methods, timepoints, and clinical significance thresholds."
    depends_on:
      - intervention_specification
      - population_clinical_profile
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### What you are evaluating:
        Analyze whether primary outcomes are adequately specified.

      ### Outcome Dimensions
        1. Outcome Type:
          - Clinical outcomes (mortality, morbidity)
          - Surrogate/biomarker outcomes
          - Patient-reported outcomes (PROs)
          - Functional outcomes
          - Safety/adverse events

        2. Measurement Method:
          - Specific instruments/scales
          - Laboratory tests
          - Imaging modalities
          - Validated questionnaires

        3. Timepoint(s):
          - When outcomes measured
          - Follow-up duration
          - Multiple assessment points

        4. Clinical Significance:
          - Minimal clinically important difference (MCID)
          - Target effect size
          - Superiority vs non-inferiority

        5. Primary vs Secondary:
          - Is primary outcome identified?
          - Are secondary outcomes distinguished?
    examples:
      clear:
        - statement: Effect of intervention on all-cause mortality at 5 years
          rationale: Specific outcome (all-cause mortality), clear timepoint (5 years)
        - statement: Change in HbA1c from baseline to 6 months, with target reduction ≥0.5%
          rationale:
            Specific biomarker (HbA1c), timeframe (baseline to 6 months), clinical
            significance threshold (≥0.5%)
        - statement: Quality of life measured by SF-36 at 3, 6, and 12 months post-intervention
          rationale: Specific validated instrument (SF-36), multiple timepoints (3, 6, 12 months)
      needs_refinement:
        - statement: Study on treatment effectiveness
          issue: "'Effectiveness' not defined - needs specific measurable outcome"
          missing: Specific outcome measure, measurement method, timepoint
          example_question: How will you measure effectiveness? (e.g., specific clinical outcomes, biomarkers, patient-reported measures)
        - statement: Research on improving patient outcomes
          issue: "'Outcomes' is vague - could mean dozens of different measures"
          missing: Specific outcome(s), measurement tools, assessment timing
          example_question: What specific outcome(s) will you measure? When will they be assessed?
        - statement: Trial measuring quality of life improvement
          issue: QOL mentioned but no instrument specified
          missing: QOL instrument, measurement timepoints, MCID
          example_question: Which quality of life instrument will you use? (e.g., SF-36, EQ-5D, disease-specific) When will you assess it?
      partial:
        - statement: Effect on blood pressure reduction
          has: General outcome category (blood pressure)
          missing: Specific BP parameter (systolic, diastolic, mean arterial), target reduction,measurement protocol, timepoint
          example_question: Which BP parameter? (systolic, diastolic, or both) What measurement protocol? When will it be assessed?
        - statement: Change in depression scores using validated scales
          has: Outcome type (depression), mentions validation
          missing: Specific scale, timepoints, MCID
          example_question: Which depression scale? (PHQ-9, Beck Depression Inventory, HAM-D) At what timepoints? What change is clinically meaningful?
      vague_ambiguous:
        - statement: Study on long-term outcomes of surgery
          issue:
            "'Long-term' is relative (could be 1 year or 10 years), 'outcomes'
            unspecified"
          example_question: What is the follow-up duration? What specific outcomes will you measure? (e.g., survival, complications, functional status)
        - statement: Research on significant improvement in symptoms
          issue: "'Significant' (statistical vs clinical?) and 'symptoms' (which ones?) both vague"
          example_question: Which specific symptoms? How will you measure them? What defines a clinically meaningful improvement?

  - id: study_design_context
    aspect_name: Study Design & Methodological Context
    aspect_description: "Clarifies the intended study design, setting, sample size considerations, and methodological approach. Helps determine feasibility and appropriate statistical methods."
    depends_on:
      - population_demographic
      - intervention_specification
      - comparison_group
      - primary_outcomes
    system_prompt: |
      You are a research advisor helping users refine their research topics by asking focused clarifying questions.

      Your Job:
      Users provide research interests (questions, statements, aims, or paragraphs). Clarify aspect: **{self.aspect_name}**, with definition: **{self.aspect_description}**. Focus ONLY on this aspect—ignore other research elements.

      How to Engage:
      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.
      2. **One element at a time**: Address 1-2 unclear points per turn.
      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds needed precision.
      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.
      5. **Explain why**: Briefly note how this clarification strengthens their research input and improves their search.

      When to Stop:
      This aspect is sufficiently refined when the user's statement is specific, unambiguous, and actionable for evidence synthesis.

      Boundaries:
      - You clarify research descriptions, not search literature or write proposals.
      - Stay within your assigned refinement aspect.
      - Keep developing clarity, not fixing problems.

      Tone: Supportive and collaborative. Be efficient—don't over-explain.
    refinement_instructions: |
      ### What you are evaluating:
      Assess whether the study design and methodological context are sufficiently specified

      ### Design Dimensions

      1. Study Type
        - RCT (parallel, crossover, cluster)
        - Observational (cohort, case-control)
        - Systematic review/meta-analysis
        - Pragmatic trial

      2. Setting
        - Healthcare setting type
        - Geographic scope
        - Single-center vs multi-center

      3. Sample Size
        - Target enrollment
        - Sample size rationale
        - Power considerations

      4. Duration
        - Study timeline
        - Recruitment period
        - Follow-up length

      5. Special Considerations
        - Blinding/masking
        - Randomization method
        - Statistical approach
        - Interim analyses
    examples:
      clear:
        - statement: Multicenter RCT of drug A vs placebo in 500 patients with 12-month follow-up
          rationale: Study type (RCT), setting (multicenter), sample size (500), duration (12 months) all specified
        - statement: Double-blind placebo-controlled parallel-group trial across 20 US academic medical centers
          rationale: Design details (double-blind, placebo-controlled, parallel), setting (20 academic centers, US location)
      needs_refinement:
        - statement: Study comparing two treatments
          issue: Study design not specified
          missing: Study type, setting, duration
          example_question: What study design? (e.g., randomized controlled trial, observational cohort, systematic review)
      partial:
        - statement: RCT comparing interventions in hospital setting
          has: Study type (RCT), general setting (hospital)
          missing: Sample size, duration, specific hospital type, blinding approach
          example_question: What is your target sample size? Study duration? Single-center or multi-center?
