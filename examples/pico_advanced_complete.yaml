  # ========================================
  # STUDY DESIGN & CONTEXT
  # ========================================
  
  - id: study_design_context
    name: Study Design & Methodological Context
    description: |
      Clarifies the intended study design, setting, sample size considerations,
      and methodological approach. Helps determine feasibility and appropriate
      statistical methods.
    
    depends_on:
      - population_demographics
      - intervention_specification
      - comparison_group
      - primary_outcomes
    
    analysis_prompt: |
      **Query to Analyze:** "{query}"
      
      # TASK: Study Design & Context Analysis
      
      Analyze whether study design and methodological context are specified.
      
      ## Design Dimensions
      
      1. **Study Type**
         - RCT (parallel, crossover, cluster)
         - Observational (cohort, case-control)
         - Systematic review/meta-analysis
         - Pragmatic trial
      
      2. **Setting**
         - Healthcare setting type
         - Geographic scope
         - Single-center vs multi-center
      
      3. **Sample Size**
         - Target enrollment
         - Sample size rationale
         - Power considerations
      
      4. **Duration**
         - Study timeline
         - Recruitment period
         - Follow-up length
      
      5. **Special Considerations**
         - Blinding/masking
         - Randomization method
         - Statistical approach
         - Interim analyses
    
    examples:
      clear:
        - query: "Multicenter RCT of drug A vs placebo in 500 patients with 12-month follow-up"
          explanation: "Study type (RCT), setting (multicenter), sample size (500), duration (12 months) all specified"
        
        - query: "Double-blind placebo-controlled parallel-group trial across 20 US academic medical centers"
          explanation: "Design details (double-blind, placebo-controlled, parallel), setting (20 academic centers, US location)"
      
      needs_refinement:
        - query: "Study comparing two treatments"
          issue: "Study design not specified"
          missing: "Study type, setting, duration"
          suggested_question: "What study design? (e.g., randomized controlled trial, observational cohort, systematic review)"
      
      partial:
        - query: "RCT comparing interventions in hospital setting"
          has: "Study type (RCT), general setting (hospital)"
          missing: "Sample size, duration, specific hospital type, blinding approach"
          suggested_question: "What is your target sample size? Study duration? Single-center or multi-center?"
    
    response_format:
      additional_fields:
        is_complete: boolean
        confidence: string
        needs_user_input: boolean
        study_design_specified: boolean
        study_design_type: string
        setting_specified: boolean
        multicenter: boolean
        sample_size_mentioned: boolean
        sample_size_justified: boolean
        study_duration_specified: boolean
        blinding_specified: boolean
        randomization_mentioned: boolean
        statistical_approach_mentioned: boolean
        feasibility_assessment: string
        design_completeness_score: float
      
      field_descriptions:
        needs_refinement: "Whether the study design needs additional clarification"
        explanation: "Summary of the study design analysis"
        suggested_question: "Question that resolves the key design uncertainty"
        is_complete: "True if study design context is sufficiently specified"
        confidence: "Confidence in this assessment (e.g., high/medium/low)"
        needs_user_input: "True if more input from the user is required"
        study_design_specified: "Whether study design type is mentioned"
        study_design_type: "Type: RCT, cohort, case-control, meta-analysis, other"
        setting_specified: "Whether study setting is described"
        multicenter: "Whether this is a multi-site study"
        sample_size_mentioned: "Whether target enrollment is indicated"
        sample_size_justified: "Whether a sample size rationale is provided"
        study_duration_specified: "Whether timeline is mentioned"
        blinding_specified: "Whether blinding/masking is addressed"
        randomization_mentioned: "Whether randomization approach is specified"
        statistical_approach_mentioned: "Whether analysis methods are referenced"
        feasibility_assessment: "Overall feasibility (high/medium/low/unclear)"
        design_completeness_score: "Overall specification score from 0-10"
    
    allow_follow_up: true
    max_follow_ups: 2
    
    metadata:
      domain: clinical_research
      framework: PICO
      pico_component: Study_Design
      priority: medium
      typical_order: 6
      estimated_completion_time_seconds: 45
