# Sample PICO Framework
# Place custom framework files in the same directory as the app

name: "pico_basic"
description: "Basic PICO framework for medical research queries"

dimensions:
  - id: "population"
    name: "Population"
    description: "Who are the patients or population of interest?"
    question_template: "Who are the patients or population being studied?"
    
  - id: "intervention"
    name: "Intervention"
    description: "What intervention, treatment, or exposure is being considered?"
    question_template: "What intervention, treatment, or exposure are you interested in?"
    
  - id: "comparison"
    name: "Comparison"
    description: "What is the alternative to the intervention?"
    question_template: "What is being compared to the intervention (if any)?"
    
  - id: "outcome"
    name: "Outcome"
    description: "What are the relevant outcomes?"
    question_template: "What outcomes or effects are you interested in measuring?"
