[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query_refinement_chatbot"
version = "0.1.0"
description = "An AI-powered domain-agnostic chatbot that refines user queries for better search results using a refinement schema."
authors = [{name = "Jesus Dominguez", email = "jesus.dominguez@kcl.ac.uk"}]
readme = "README.md"
license = {text = "MIT"}
keywords = ["chatbot", "AI", "query refinement", "search optimization"]
requires-python = ">=3.8"
dependencies = [

]

[project.optional-dependencies]
testing = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "black>=23.7.0"
]
