[tool.poetry]
name = "query-refinement-module"
version = "0.1.0"
description = "An AI-powered, domain-agnostic query refinement system for scientific literature search."
authors = ["Jesus Dominguez <jesus.dominguez@kcl.ac.uk>"]
keywords = [
    "query refinement",
    "information retrieval",
    "conversational AI",
    "scientific search",
    "literature search",
    "domain-agnostic",
    "LLM",
    "chatbot"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
pyyaml = ">=6.0.3,<7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
mypy = ">=1.18.2,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"