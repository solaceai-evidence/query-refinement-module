[tool.poetry]
name = "query-refinement-module"
version = "2.0.0"
description = "An AI-powered, domain-agnostic query refinement system for scientific literature search."
authors = ["Jesus Dominguez <jesus.dominguez@kcl.ac.uk>"]
keywords = [
    "query refinement",
    "information retrieval",
    "conversational AI",
    "scientific search",
    "literature search",
    "domain-agnostic",
    "LLM",
    "chatbot"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
alembic = "^1.18.0"  # Updated for database migration improvements
python = ">=3.12,<3.14"  # Constrain to avoid Poetry version detection issues
pyyaml = ">=6.0.3,<7.0.0"
redis = ">=5.0.0,<8.0.0"  # Updated to allow v7 for performance improvements
litellm = ">=1.81.0,<2.0.0"  # Upgraded for better Anthropic structured output support and performance improvements
httpx = "^0.28.1"  # Async HTTP client with connection pooling
python-dotenv = "^1.2.1"
fastapi = "^0.128.0"  # Updated for async performance improvements
uvicorn = {extras = ["standard"], version = "^0.40.0"}  # Updated for ASGI server performance
sqlalchemy = "^2.0.46"  # Updated for ORM performance and bug fixes
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.22"  # Updated for multipart parsing improvements
pydantic-settings = "^2.12.0"
email-validator = "^2.3.0"
bcrypt = ">=4.0.0,<5.0.0"  # Keep Python 3.12-compatible range; passlib warning is non-fatal
jinja2 = "^3.1.6"
requests = "^2.32.4"
# Production dependencies
psycopg2-binary = "^2.9.9"  # PostgreSQL adapter
gunicorn = "^25.0.0"  # Updated production WSGI server for performance
python-json-logger = "^4.0.0"  # Updated for structured JSON logging performance

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<10.0.0"  # Allow v9 for testing improvements
pytest-mock = ">=3.15.1,<4.0.0"
mypy = ">=1.19.0,<2.0.0"  # Updated for better type checking
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"  # Updated for better async test support
locust = "^2.43.0"  # Updated for load testing improvements
vulture = "^2.14"

[tool.poetry.scripts]
query-refine = "query_refinement_module.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning",
    "ignore:enable_cleanup_closed ignored because .* is fixed in Python version .*:DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"