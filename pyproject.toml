[tool.poetry]
name = "query-refinement-module"
version = "2.0.0"
description = "An AI-powered, domain-agnostic query refinement system for scientific literature search."
authors = ["Jesus Dominguez <jesus.dominguez@kcl.ac.uk>"]
keywords = [
    "query refinement",
    "information retrieval",
    "conversational AI",
    "scientific search",
    "literature search",
    "domain-agnostic",
    "LLM",
    "chatbot"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
pyyaml = ">=6.0.3,<7.0.0"
redis = ">=5.0.0,<6.0.0"
litellm = ">=1.43.0,<2.0.0"
httpx = "^0.28.1"  # Async HTTP client with connection pooling
python-dotenv = "^1.2.1"
fastapi = "^0.123.3"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
sqlalchemy = "^2.0.0"  # Database ORM
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
pydantic-settings = "^2.12.0"
email-validator = "^2.3.0"
bcrypt = ">=3.2.0,<4.0.0"
# Production dependencies
psycopg2-binary = "^2.9.9"  # PostgreSQL adapter
gunicorn = "^23.0.0"  # Production WSGI server
python-json-logger = "^3.2.1"  # Structured JSON logging

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
mypy = ">=1.18.2,<2.0.0"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.2.0"
alembic = "^1.17.2"
locust = "^2.42.6"

[tool.poetry.scripts]
query-refine = "query_refinement_module.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"