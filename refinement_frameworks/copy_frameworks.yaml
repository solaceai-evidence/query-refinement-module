mph_dissertation:
  - user_context:
      user_type: "MPH student"
      context: "Early-stage dissertation conceptualization. MPH student is exploring
        potential research topics for their Master of Public Health
        capstone/dissertation project. They need help refining vague or broad
        ideas into focused, feasible research questions with appropriate scope
        for a 6-12 month student project with limited resources."
      tone: "educational" # (educational, professional, pragmatic)
      complexity: "intermediate" # (novice, intermediate, advanced, expert)
      examples_from: "public health"
      constraints:
        - "Timeline: 6-12 months limits study designs (prospective cohorts,
          RCTs, and longitudinal designs infeasible; cross-sectional,
          retrospective, or rapid reviews preferred)"
        - "Ethics approval: Primary data collection requires ethics committee
          approval (2-3 months expedited, 4-6 months full review); NHS ethics
          for patient data adds further complexity"
        - "Sample size: Primary data collection >200 (surveys) or >100
          (in-person) or >30 (clinical) typically exceeds capacity; secondary
          data (UK Data Service, ONS, CPRD) or smaller qualitative samples
          (15-25) preferred"
        - "Scope and methods: Single focused research question; mixed methods
          with equal weighting or novel instrument development rarely feasible
          within timeframe"
        - "Data access: UK datasets requiring application (CPRD, HES,
          longitudinal cohorts) take 1-3 months approval; publicly available
          datasets (Health Survey for England, Understanding Society) or
          institutional data preferred"
        - "Resources: Projects requiring substantial budget (participant
          incentives, professional transcription, proprietary software, travel)
          may need funding applications; low-cost or unfunded approaches
          preferred"
  - id: mph_research_domain
    name: "MPH research domain"
    description: the public health topic or health issue under investigation
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    specifications: |
      **Task:** Evaluate and assemble the public health domain specification for MPH dissertation research.

      **Elements to track:**
      - Health topic category (disease/condition, health behavior, health system, environmental health, social determinant)
      - Specificity level (field → subdomain → specific issue)
      - Public health relevance (disease burden, health equity, prevention potential, policy relevance)
      - Literature availability (established field vs. emerging area)
      - Feasibility for 6-12 month MPH project

      **Required:**
      - Specific health issue or public health topic identified
      - Appropriate scope (not entire fields, not hyper-niche)
      - Clear public health relevance

      **Not required but helpful:**
      - Geographic or population focus (can be refined later)
      - Specific aspect within topic (addressed in research_focus)

      **Scope calibration:**
      - TOO BROAD: entire fields ("epidemiology", "public health", "communicable diseases")
      - APPROPRIATE: specific issues ("childhood obesity", "vaccine hesitancy", "air pollution and asthma")
      - TOO NARROW: multiple specificity layers ("rotavirus vaccine intussusception in UK infants")

      **Context dependencies:**
      - Epidemiology students → lean toward disease/risk factor topics
      - Health policy students → lean toward systems/policy topics
      - Global health/LMIC focus → accept domains where grey literature predominates
      - Emerging topics (digital health, climate) → accept broader scope if foundational literature exists
    examples:
      clear:
        - statement: childhood obesity
          rationale: Specific health condition, defined life stage, major public health
            issue with clear boundaries and established literature
        - statement: vaccine hesitancy
          rationale: Distinct health behavior, established public health significance,
            clear boundaries
      needs_refinement:
        - statement: public health
          issue: Entire field; no specific topic
          example_question: Public health covers many areas. Which specific health issue
            interests you? For example, a disease, health behavior, health
            system issue, or environmental factor?
        - statement: rotavirus vaccine-associated intussusception in under-1s in UK
          issue: Multiple layers of specificity; very narrow; limited literature
          example_question: This is quite specialized for an MPH dissertation. Would you
            consider broadening to vaccine safety monitoring, rotavirus
            vaccination effectiveness, or post-marketing surveillance?
      partial:
        - statement: diabetes
          has: Disease identified
          missing: Type of diabetes, specific aspect of diabetes
          example_question: Diabetes is a good starting point. Are you interested in Type
            2 diabetes specifically? And which aspect - risk factors,
            complications, management, or screening?
        - statement: mental health
          has: Health domain identified
          missing: Specific mental health issue or aspect
          example_question: Mental health is broad. Which aspect - specific conditions
            (depression, anxiety), service access, stigma, or a specific
            population?
      vague_ambiguous:
        - statement: health improvement
          issue: No specific health topic identified; just an outcome
          example_question: Health improvement is a goal, not a topic. Which specific
            health issue do you want to address - a disease, behavior, or system
            problem?
        - statement: wellness
          issue: Vague term with multiple possible meanings
          example_question: What aspect of wellness interests you - physical health,
            mental wellbeing, workplace wellness programs?
  - id: mph_research_focus
    name: "MPH research focus"
    description: "what the student specifically wants to investigate, examine, or
      understand about their topic"
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - mph_research_domain
      - population
    specifications: |
      **Task:** Evaluate and assemble the investigative focus for MPH dissertation research.

      **Elements to track:**
      - Investigative direction (what specifically will be examined)
      - Focus type (relationships, patterns, factors, effectiveness, experiences, barriers, prevalence, trends)
      - Analytical approach (descriptive, comparative, evaluative, exploratory)
      - Alignment with domain (still same health topic?)
      - Measurability (can this be observed/measured?)

      **Required:**
      - Clear specification of what will be investigated
      - Research-oriented framing (investigative, not solution-focused)
      - Alignment with stated research domain

      **Not required:**
      - Formal framework structure (PICO/SPIDER/ECLIPSE helpful but not mandatory)
      - Complete population/method specification (refined in later dimensions)

      **Focus type guidance:**
      - DESCRIPTIVE: prevalence, distribution, trends, characteristics
      - COMPARATIVE: differences between groups, settings, time periods
      - EVALUATIVE: effectiveness, impact, outcomes of interventions/policies
      - EXPLORATORY: barriers, facilitators, experiences, perceptions, factors

      **Red flags to address:**
      - Solution-focused ("How can we eliminate X?") → reframe to investigative
      - Purely definitional ("What is X?") → better for literature review, redirect
      - Causation language without appropriate design → flag limitations
      - Multiple bundled inquiries → help prioritize one focus
    examples:
      clear:
        - statement: examining the relationship between air pollution exposure and asthma
            hospitalization rates in urban areas
          rationale: Clear relationship being examined, specific variables identified,
            investigative rather than descriptive
        - statement: investigating factors that influence vaccine hesitancy among parents
            of young children
          rationale: Specific phenomenon, clear investigative aim (factors/determinants),
            defined population
      needs_refinement:
        - statement: childhood obesity
          issue: Topic only; no investigative direction specified
          example_question: What specifically do you want to investigate about childhood
            obesity - prevalence, risk factors, interventions, barriers, or
            policies?
        - statement: How can we solve the obesity crisis?
          issue: Solution-focused and too broad; research examines, not solves
          example_question: Research investigates rather than solves. What would you like
            to examine - effectiveness of interventions, barriers to prevention,
            or factors contributing to obesity?
      partial:
        - statement: looking at what affects childhood obesity
          has: Basic investigative direction (factors), identifies outcome (obesity)
          missing: Which factors specifically? What type of relationships?
          example_question: What specific factors - behavioral, environmental, social, or
            biological? And in which population?
        - statement: the effects of air pollution
          has: Clear exposure identified (air pollution)
          missing: Effects on what health outcome? In whom?
          example_question: Effects on which health outcome - respiratory, cardiovascular,
            developmental? And in which population?
      vague_ambiguous:
        - statement: how environment impacts people
          issue: Environment undefined (physical? social? built?); impacts too vague
          example_question: Which type of environment - physical, social, built, or
            occupational? And what specific impacts - health outcomes,
            behaviors, access?
        - statement: I think schools should do more about nutrition
          issue: Opinion statement, not research focus
          example_question: What would you like to investigate about school nutrition -
            program effectiveness, implementation barriers, or food environment
            effects?
  - id: mph_study_design
    name: MPH study design
    description: the research methodology and study design appropriate for the
      research question
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - mph_research_focus
      - outcome
    specifications: |
      **Task:** Evaluate and assemble study design specification for MPH dissertation research.

      **Elements to track:**
      - Design category (quantitative, qualitative, mixed methods, review)
      - Specific design type (see categories below)
      - Appropriateness for research focus (does design answer the question?)
      - Feasibility for MPH timeline (6-12 months)
      - Alignment with student skills and resources

      **Required:**
      - Study design category identified
      - Specific design type specified
      - Logical fit with research focus

      **Not required at this stage:**
      - Full protocol details (addressed in data source and sampling)
      - Analysis plan specifics

      **Study design categories for MPH:**

      QUANTITATIVE DESIGNS:
      - Cross-sectional study: associations at one time point (most common for MPH)
      - Retrospective cohort: outcomes using existing historical data
      - Case-control: comparing exposure between cases and controls
      - Secondary data analysis: analyzing existing datasets (Health Survey for England, CPRD, Understanding Society)
      - Program evaluation: assessing intervention outcomes
      - Note: Prospective cohorts and RCTs rarely feasible for MPH timeline

      QUALITATIVE DESIGNS:
      - Phenomenological: exploring lived experiences
      - Grounded theory: developing theory from data
      - Case study: in-depth single case or multiple cases
      - Qualitative descriptive: describing phenomenon in natural language
      - Content analysis: analyzing text/documents systematically

      MIXED METHODS:
      - Sequential explanatory: quantitative → qualitative to explain findings
      - Sequential exploratory: qualitative → quantitative to test/generalize
      - Convergent: both simultaneously, integrated in interpretation
      - Note: Mixed methods ambitious for MPH; ensure one is primary

      REVIEW DESIGNS:
      - Scoping review: mapping evidence landscape, broader inclusion
      - Narrative review: less systematic, synthesizes themes
      - Rapid review: accelerated systematic review methods

      **Design-question alignment:**
      - "What is the prevalence/distribution?" → Cross-sectional, secondary data
      - "What factors are associated with X?" → Cross-sectional, case-control
      - "What is the relationship between X and Y?" → Cohort, cross-sectional
      - "What are people's experiences of X?" → Qualitative (phenomenology, interviews)
      - "What barriers/facilitators exist?" → Qualitative, mixed methods
      - "How effective is intervention X?" → Program evaluation, quasi-experimental
      - "What does existing evidence show?" → Systematic/scoping review
    examples:
      clear:
        - statement: cross-sectional secondary data analysis using NHANES to examine
            associations between food insecurity and depression
          rationale: Clear design, data source specified, appropriate for association
            question, feasible for MPH
        - statement: qualitative phenomenological study exploring healthcare provider
            experiences of burnout through semi-structured interviews
          rationale: Named qualitative approach, method aligned with experience question,
            appropriate scope
      needs_refinement:
        - statement: I want to do research on vaccine hesitancy
          issue: No study design specified
          example_question: What approach will you take - cross-sectional survey,
            qualitative interviews, secondary data analysis, or literature
            review?
        - statement: I'll do an RCT
          issue: RCT rarely feasible for MPH timeline and resources
          example_question: RCTs typically exceed MPH scope. What are you hoping to learn?
            Consider quasi-experimental design or rapid or scoping reviews of
            existing RCTs.
      partial:
        - statement: qualitative study on patient experiences
          has: Paradigm (qualitative), focus (experiences)
          missing: Specific qualitative design, data collection method
          example_question: Which specific design - phenomenology, qualitative
            descriptive, or case study? And what data collection - interviews or
            focus groups?
        - statement: I'll analyze existing data
          has: Approach (secondary data analysis)
          missing: Specific design type, which dataset
          example_question: What's your analytical approach - cross-sectional, trend
            analysis, or comparative? And which dataset?
      vague_ambiguous:
        - statement: I'll study the topic
          issue: No design whatsoever
          example_question: How will you study this - existing data analysis, primary data
            collection (surveys/interviews), or literature review?
        - statement: experimental approach
          issue: True experiments rarely feasible for MPH
          example_question: What do you mean by experimental? Consider quasi-experimental,
            program evaluation, or observational comparison designs.
  - id: mph_data_source
    name: MPH data sources and access
    description: the data sources the student plans to use and their access to them
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - mph_research_focus
      - mph_study_design
    specifications: |
      **Task:** Evaluate and assemble data source specification for MPH dissertation research.

      **Elements to track:**
      - Data type (secondary/existing data, primary data collection, literature/documents)
      - Specific source name or description
      - Access status (publicly available, requires application, institutional access, needs IRB)
      - Variables/information available (does it contain what's needed for research focus?)
      - Time period covered
      - Geographic coverage

      **Required:**
      - At least one data source identified
      - Confirmation of access feasibility for MPH student
      - Alignment with research focus (source contains relevant variables)

      **Required if applicable:**
      - IRB/ethics requirements for primary data
      - Data access application timeline for restricted datasets
      - Cost implications if any

      **Data source categories for MPH students:**

      SECONDARY DATA (preferred for feasibility):
      - UK National surveys: Health Survey for England, Understanding Society, Scottish Health Survey
      - UK administrative data: Hospital Episode Statistics (HES), ONS vital statistics, disease registries
      - UK restricted datasets: CPRD (Clinical Practice Research Datalink) - requires application
      - UK Data Service: repository of UK social and health datasets
      - International: WHO, UNICEF, DHS (Demographic Health Surveys), NHANES (US)
      - Open data portals: NHS Digital, ONS, data.gov.uk, local authority public health data

      PRIMARY DATA COLLECTION:
      - Surveys (online, paper, telephone)
      - Interviews (structured, semi-structured)
      - Focus groups
      - Document/policy analysis
      - Note: Primary data typically requires IRB approval

      LITERATURE-BASED:
      - Rapid review (existing studies as data)
      - Scoping review
      - Policy document analysis
    examples:
      clear:
        - statement: Health Survey for England 2018-2019 data for analysis of diet and
            obesity prevalence
          rationale: Specific named source, time period specified, publicly available,
            appropriate for topic
        - statement: semi-structured interviews with 15-20 healthcare providers
          rationale: Clear method, sample size appropriate for qualitative MPH work,
            defined population
      needs_refinement:
        - statement: I'll collect data
          issue: No source specified; too vague
          example_question: What type of data - existing survey data (NHANES, BRFSS), your
            own survey or interviews, or published literature for a review?
        - statement: hospital data
          issue: Too vague - which hospitals? what type? how accessed?
          example_question: Which hospital data - discharge records, EHR data, or
            published statistics? And how will you access it?
      partial:
        - statement: CDC data on vaccination rates
          has: Source category (CDC), topic alignment
          missing: Specific dataset name, time period
          example_question: Which CDC dataset - National Immunization Survey, BRFSS
            vaccination module? What time period?
        - statement: I'll do a survey
          has: Method type (survey)
          missing: Target population, sample size, IRB status
          example_question: Who will you survey, how many, and have you considered IRB
            requirements?
      vague_ambiguous:
        - statement: existing data
          issue: Could mean hundreds of different sources
          example_question: Which type of existing data - national surveys (NHANES,
            BRFSS), administrative records, or international datasets?
        - statement: online sources
          issue: Too vague - could mean surveys, databases, or literature
          example_question: Do you mean online survey administration, online databases
            (CDC WONDER), or online literature for a review?
  - id: mph_sampling_strategy
    name: MPH sampling strategy and sample size
    description: the sampling approach and planned sample size for data collection
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - mph_research_focus
      - mph_data_source
      - mph_study_design
    specifications: |
      **Task:** Evaluate and assemble sampling strategy specification for MPH dissertation research.

      **Elements to track:**
      - Sampling approach (probability vs. non-probability; specific technique)
      - Target sample size or participant range
      - Inclusion criteria (who is eligible)
      - Exclusion criteria (who is not eligible)
      - Recruitment method (how participants will be identified/contacted)
      - Justification for sample size (power calculation, saturation, feasibility)

      **Required:**
      - Sampling approach specified
      - Sample size or range identified
      - Basic inclusion criteria defined

      **Required if applicable:**
      - Power calculation rationale for quantitative studies
      - Saturation justification for qualitative studies
      - Stratification if comparing subgroups

      **Sampling approaches by study type:**

      QUANTITATIVE - Probability sampling (preferred):
      - Simple random sampling
      - Stratified random sampling (ensures subgroup representation)
      - Cluster sampling (geographic or organizational units)
      - Systematic sampling

      QUANTITATIVE - Non-probability (when probability not feasible):
      - Convenience sampling (acknowledge limitations)
      - Purposive sampling with clear criteria
      - Quota sampling (ensures demographic representation)

      QUALITATIVE:
      - Purposive sampling (criterion-based selection)
      - Maximum variation sampling (diverse perspectives)
      - Snowball sampling (hard-to-reach populations)
      - Theoretical sampling (grounded theory)

      SECONDARY DATA:
      - Full dataset analysis (all eligible records)
      - Subset selection with clear criteria
      - Weighted analysis (complex survey designs like NHANES)

      REVIEW DESIGNS (RAPID/SCOPING):
      - Focused search strategy (rapid review: limited databases, scoping review: broader inclusion)
      - Clear inclusion/exclusion criteria for studies
      - Study selection flow diagram
      - Note: Systematic reviews typically too time-intensive for MPH timeline (6-12 months)

      **Sample size guidance for MPH:**
      - Quantitative surveys: 100-500 typical, power calculation recommended
      - Secondary data: often thousands, limited by dataset
      - Qualitative interviews: 15-30 (until saturation)
      - Focus groups: 3-6 groups of 6-10 participants
      - Rapid/scoping reviews: typically 20-50 studies (rapid review more focused, scoping review broader mapping)
    examples:
      clear:
        - statement: purposive sample of 20-25 nurses with at least 5 years ICU
            experience, recruited until data saturation
          rationale: Clear approach (purposive), appropriate size for qualitative,
            specific inclusion criteria
        - statement: all adult patients (18+) with Type 2 diabetes diagnosis in NHANES
            2017-2020, applying survey weights
          rationale: Clear inclusion criteria, appropriate for secondary data,
            acknowledges complex survey design
      needs_refinement:
        - statement: I'll survey some people
          issue: No sampling strategy, size, or criteria specified
          example_question: How will you select participants, how many, and who is
            eligible (inclusion criteria)?
        - statement: I want 1000 interviews
          issue: Unrealistic for qualitative approach and MPH timeline
          example_question: Qualitative interviews typically reach saturation at 15-30
            participants. Would a survey be more appropriate for a larger
            sample?
      partial:
        - statement: convenience sample of university students
          has: Sampling approach (convenience), population (students)
          missing: Sample size, inclusion criteria
          example_question: How many students? Any specific criteria - majors, age range?
            How will you recruit them?
        - statement: interviews with healthcare workers
          has: Method (interviews), population category
          missing: Sample size, specific worker types, selection criteria
          example_question: How many interviews (typically 15-25 for MPH)? Which types of
            healthcare workers? How will you recruit them?
      vague_ambiguous:
        - statement: enough participants
          issue: No specific number or justification
          example_question: Enough depends on design - power calculation for quantitative,
            saturation (15-30) for qualitative. What's your target?
        - statement: representative sample
          issue: Representative of what population? Through what method?
          example_question: Representative of which population? What sampling approach is
            feasible - probability, purposive, or quota?
  - id: population
    name: Population
    description: The group of individuals, communities, or entities to whom the
      research applies, defined by demographic characteristics, geographic
      context, and relevant inclusion specifications.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - mph_research_domain
    specifications: |
      **Task:** Evaluate and assemble population specification.

      **Elements to track:**
      - Age (range, category, or life stage)
      - Sex/gender
      - Ethnicity/race
      - Geographic setting or context
      - Relevant subgroup characteristics: roles (e.g., healthcare workers, parents, teachers, students, caregivers), affiliations (e.g., military veterans, union members), socioeconomic markers (e.g., low-income, uninsured, educational attainment), pregnancy/reproductive status, occupational categories, insurance status

      **Required:**
      - At least confirm whether "all populations" or limited to specific demographics
      - Age specification if topic is age-dependent
      - Setting if research is geography/culture-dependent

      **Not required unless relevant:**
      - Ethnicity/race specification (only if health disparities focus or explicitly mentioned)
      - All elements (partial is acceptable if user confirms scope)

      **Age standardization:**
      When assembling, standardize age terms:
      - "kids" → "children (2-12 years)"
      - "elderly" → "older adults (65+ years)"
      - Non-standard range → prepend "approximately"

    examples:
      clear:
        - statement: Community health workers in rural Appalachian counties
          rationale: Role (CHWs), geographic setting (rural Appalachian) clearly specified
        - statement: Adolescents aged 13-18 enrolled in state secondary schools in areas
            of high deprivation in England
          rationale: Age (13-18), setting (state schools), socioeconomic context
            (deprivation), geography (England) well defined
      needs_refinement:
        - statement: Looking at health outcomes in underserved communities
          issue: Underserved communities is vague
          example_question: Which underserved communities? Specific geographic area,
            demographic group, or type of underservice?
        - statement: The effect of exercise on depression
          issue: Zero demographics specified; too broad
          example_question: You're including all ages, genders, and settings. Is that
            intentional, or specify a target population?
      partial:
        - statement: Healthcare workers in hospitals
          has: Role (healthcare workers), setting type (hospitals)
          missing: Specific worker types, geographic location
          example_question: Which types of healthcare workers? Any specific geographic region?
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women), minimum age (40), condition (CVD)
          missing: Upper age limit, setting
          example_question: Is there an upper age limit? Specific settings or ethnic groups?
      vague_ambiguous:
        - statement: People in the community
          issue: Community is undefined - no population characteristics
          example_question: Which community and who within it? Define by geography,
            demographics, or shared characteristics.
        - statement: Minority populations aged 65 and older
          issue: Minority populations is vague
          example_question: Which specific population groups - Hispanic/Latino,
            Black/African American, Asian, Native American?
  - id: outcome
    name: Outcome
    description: The measurable indicators, endpoints, or phenomena used to assess
      results, including health metrics, behavioral indicators, or descriptive
      findings.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
      - mph_research_focus
    specifications: |
      **Task:** Evaluate and assemble outcome specification.

      **Elements to track:**
      - Primary outcome(s) or main variable(s) of interest
      - Outcome type (clinical, behavioral, attitudinal, system-level)
      - Measurement method, instrument, or data source
      - Timepoint(s) or assessment period (if applicable)

      **Required:**
      - At least one primary outcome or main variable of interest
      - Measurement method for vague outcomes (satisfaction, improvement, experiences)

      **Conditionally required:**
      - Timepoint: required if timing affects interpretation
      - Instrument: required for subjective outcomes; not needed for self-evident measures
    examples:
      clear:
        - statement: Prevalence of food insecurity using USDA 6-item screener
          rationale: Specific outcome (food insecurity prevalence), validated instrument
            (USDA screener)
        - statement: Perceived barriers to mental health service utilization among college
            students
          rationale: Clear outcome (barriers to utilization), defined population,
            appropriate for qualitative or survey
      needs_refinement:
        - statement: Looking at health disparities
          issue: Health disparities is a topic area, not a measurable outcome
          example_question: Disparities in what specific outcome (mortality, access,
            treatment rates)? Between which groups?
        - statement: Research on improving health outcomes
          issue: Outcomes is vague - could mean dozens of different measures
          example_question: What specific outcome(s) will you measure? How will you measure them?
      partial:
        - statement: Vaccination attitudes in parents
          has: Outcome domain (attitudes), population (parents)
          missing: Specific instrument or measurement approach
          example_question: How will you measure attitudes - validated scale, survey
            questions, or qualitative interviews?
        - statement: Healthcare utilization patterns
          has: Outcome category (utilization)
          missing: Specific utilization measures, data source
          example_question: Which utilization measures (ED visits, hospitalizations)? From
            what data source?
      vague_ambiguous:
        - statement: Understanding the problem
          issue: No measurable outcome - understanding is not an outcome
          example_question: What specifically will you measure or describe? If
            qualitative, what phenomena will you explore?
        - statement: Research on significant improvement
          issue: Significant and improvement both vague
          example_question: Improvement in what? How will you define and measure
            meaningful change?
pico_advanced:
  - user_context:
      user_type: "Systematic reviewer"
      context: "Protocol development for systematic review or meta-analysis.
        Researcher is formulating a research question for a comprehensive
        evidence synthesis, requiring precise PICO/SPIDER/ECLIPSE framework
        specification for protocol registration and publication-quality review."
      tone: "professional" # (educational, professional, pragmatic)
      complexity: "expert" # (novice, intermediate, advanced, expert)
      examples_from: "public health"
      constraints:
        - "Specificity check: Every dimension must have concrete, measurable
          definitions without ambiguous terms (reject 'elderly', 'standard
          care', 'improved outcomes' unless operationalized)"
        - "Alignment check: All dimensions must be mutually compatible
          (intervention appropriate for population and condition, outcome
          measurable given design constraints)"
        - "Search-readiness check: Each element can be converted into specific
          database search terms, MeSH headings, or screening criteria"
        - "Completeness check: All critical PICO elements defined without
          circular dependencies (no 'depends on what studies we find')"
        - "Synthesis-feasibility check: The combined dimensions define a
          coherent, comparable body of evidence rather than heterogeneous
          narrative-only collection"
  - id: population
    name: Population
    description: The group of individuals, communities, or entities to whom the
      research applies, defined by demographic characteristics, geographic
      context, and relevant inclusion criteria.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    specifications: |
      **Task:** Evaluate and assemble population specification.

      **Elements to track:**
      - Age (range, category, or life stage)
      - Sex/gender
      - Ethnicity/race
      - Geographic setting or context
      - Relevant subgroup characteristics: roles (e.g., healthcare workers, parents, teachers, students, caregivers), affiliations (e.g., military veterans, union members), socioeconomic markers (e.g., low-income, uninsured, educational attainment), pregnancy/reproductive status, occupational categories, insurance status

      **Required:**
      - At least confirm whether "all populations" or limited to specific demographics
      - Age specification if topic is age-dependent
      - Setting if research is geography/culture-dependent

      **Not required unless relevant:**
      - Ethnicity/race specification (only if health disparities focus or explicitly mentioned)
      - All elements (partial is acceptable if user confirms scope)

      **Age standardization:**
      When assembling, standardize age terms:
      - "kids" → "children (2-12 years)"
      - "elderly" → "older adults (65+ years)"
      - Non-standard range → prepend "approximately"
    examples:
      clear:
        - statement: Efficacy of metformin in adults aged 40-65 with type 2 diabetes
          rationale: Age (40-65) specified, with all-inclusive gender (adults) and
            ethnicity and setting
        - statement: Postmenopausal women under 65 in urban clinical settings
          rationale: clearly described age (postmenopausal under 65), gender (women),
            setting (urban clinical)
        - statement: Black males aged 18-45 with hypertension in community health centers
          rationale: clearly defined age (18-45), gender (males), ethnicity (Black),
            setting (community health centers)
      needs_refinement:
        - statement: The effect of exercise on depression
          issue: Zero demographics specified; too broad
          missing: Age, gender at minimum
          example_question: "You are including all ages, genders, ethnicities, and
            settings. Is that correct or do you want to limit to you have any
            specific age range, sex/gender, setting, and/or ethnicity/race?"
      partial:
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women) and minimum age (40)
          missing: ethnicity (if CVD disparities relevant),setting (geographic/clinical
            context)
          example_question: Is there an upper age limit? Are you focusing on specific
            ethnic groups given CVD disparities?
      vague_ambiguous:
        - statement: Treatment outcomes in minority populations aged 65 and older in
            tertiary care hospitals
          issue: "'Minority populations' is vague and could mean multiple groups"
          missing: precise ethnicity/race or setting; maybe gender as well
          example_question: "Which specific population groups are you focusing on? (e.g.,
            Hispanic/Latino, African American, Asian, Native American). Do you
            have any specifications regarding gender or geographic location?"
  - id: intervention
    name: Intervention
    description: The healthcare action, exposure, or strategy being evaluated,
      specified in sufficient detail to allow replication, including modality,
      intensity, duration, and delivery context
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
      - clinical_condition
    specifications: |
      **Task:** Evaluate and assemble intervention specification.

      **Elements to track:**
      - Intervention type (pharmacological/procedural/behavioral/diagnostic)
      - Specific agent or method
      - Dosing/intensity (if applicable)
      - Duration (if applicable)
      - Delivery method (if applicable)

      **Required:**
      - Intervention type
      - Specific agent/method name

      **Required if applicable:**
      - Dosing: for dose-dependent interventions
      - Duration: if affects outcomes
      - Delivery: if route/setting/provider affects outcomes
    examples:
      clear:
        - statement: Metformin vs placebo in newly diagnosed Type 2 diabetes over 6
            months.
          rationale: Inferred intervention type (Pharmacological), Drug (metformin),
            duration (6 months), and comparison (placebo) well specified.
        - statement: Laparoscopic Roux-en-Y gastric bypass compared to other techniques
          rationale: Specific intervention type (surgical technique, inferred) and method
            (laparoscopic Roux-en-Y)
        - statement: Cognitive Behavioral Therapy delivered by licensed clinical
            psychologists
          rationale: Inferred intervention type (nonpharmacological), method (CBT),
            provider (licensed psychologists)
        - statement: Atorvastatin treatment for hyperlipidemia
          has: Inferred intervention type (Pharmacological), Drug name (atorvastatin),
            indication (hyperlipidemia)
      partial:
        - statement: Exercise intervention for weight loss
          has: intervention type (exercise)
          missing: exercise modality, intensity level, frequency, session duration
            unspecified
          example_question: What type of exercise? (aerobic, resistance, both) What
            intensity, frequency, and exercise modality?
        - statement: Effects of medication on blood pressure
          has: intervention type (Pharmacological)
          missing: Drug name (optional dose, frequency, duration, route)
          example_question: Which medication are you studying? Please specify the drug
            name, dose, frequency, and treatment duration if applicable.
      vague_ambiguous:
        - statement: Intensive glycemic control in diabetes
          issue: " Intervention type is clear (glycemic control); 'Intensive' is
            subjective - it could be specified as a regimen or target"
          missing: Specific regimen or glycemic targets
          example_question: "Are you interested in a specific intervention and regimen or
            a target that defines 'intensive control'?"
  - id: comparator
    name: Comparator
    description: The alternative intervention, standard of care, placebo, or
      no-intervention condition against which the intervention is assessed,
      providing the reference for effect estimation
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
      - intervention
    specifications: |
      **Task:** Evaluate and assemble comparator specification.

      **Elements to track:**
      - Comparator type (placebo/standard care/active comparator/no treatment)
      - Specific comparator details (matching intervention specificity)

      **Required:**
      - At least one comparator specified
      - Comparator detail level matching intervention detail

      **Comparator types:**
      - Placebo: inert substance or mock procedure
      - Standard care: specify which guideline or usual practice
      - Active comparator: specify drug, dose, or technique
      - No treatment: watchful waiting (justify if effective treatment exists)
    examples:
      clear:
        - statement: Metformin vs placebo in prediabetic adults
          rationale: Clear active intervention (metformin) vs inert control (placebo)
        - statement: New anticoagulant compared to warfarin (standard care) in atrial
            fibrillation
          rationale: Novel treatment (New anticoagulant) vs established standard of care
            (warfarin)
        - statement: High-intensity statins vs moderate-intensity statins in secondary
            prevention
          rationale: clear comparator (High-intensity statins vs moderate-intensity
            statins)
      needs_refinement:
        - statement: Effects of new drug on blood pressure
          issue: No comparison group mentioned
          missing: Comparator specification
          example_question: What will you compare the new drug against? (e.g., any other
            treatmentplacebo, current standard treatment, another active drug)
        - statement: Study of surgical intervention
          issue: No comparison - surgery vs what?
          missing: Control/comparison group
          example_question: What is the comparison? (e.g., surgery vs medical management,
            surgery vs observation, one surgical technique vs another)
      vague_ambiguous:
        - statement: ACE inhibitors versus control in hypertension
          issue: "'Control' could mean placebo, standard care, or no treatment"
          example_question: What does 'control' mean in your study? (placebo, standard
            antihypertensive therapy, or no treatment)
        - statement: Intervention vs standard therapy
          issue: "'Standard therapy' varies by geography, guidelines, and time period"
          example_question: What specific treatment(s) constitute 'standard therapy' in
            your context? (e.g., specific drugs, specific guidelines)
  - id: outcome
    name: Outcome
    description: The measurable indicators, endpoints, or phenomena used to assess
      results, including health metrics, behavioral indicators, or descriptive
      findings.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
      - intervention
      - comparator
    specifications: |
      **Task:** Evaluate and assemble outcome specification.

      **Elements to track:**
      - Primary outcome(s) or main variable(s) of interest
      - Outcome type (clinical, behavioral, attitudinal, system-level)
      - Measurement method, instrument, or data source
      - Timepoint(s) or assessment period (if applicable)

      **Required:**
      - At least one primary outcome or main variable of interest
      - Measurement method for vague outcomes (satisfaction, improvement, experiences)

      **Conditionally required:**
      - Timepoint: required if timing affects interpretation
      - Instrument: required for subjective outcomes; not needed for self-evident measures
    examples:
      clear:
        - statement: Effect of intervention on all-cause mortality at 5 years or more
          rationale: Specific outcome (all-cause mortality), clear timepoint (5 years or
            more). With this outcome, a shorter duration may not be associated
            with the intervention; thus the inclusion of a longer timepoint.
        - statement: Change in HbA1c from baseline to 6 months
          rationale: Outcome type (diabetes indicator) inferred, measurement method
            -specific biomarker- (HbA1c) and timeframe (baseline to 6 months)
            clearly defined
      needs_refinement:
        - statement: Study on treatment effectiveness
          issue: "'Effectiveness' not defined - needs specific measurable outcome"
          missing: Specific outcome measure, measurement method, timepoint
          example_question: How will you measure effectiveness? (e.g., specific clinical
            outcomes, biomarkers, patient-reported measures)
        - statement: Research on improving patient outcomes
          issue: "'Outcomes' is vague - could mean dozens of different measures"
          missing: Specific outcome(s), measurement tools, assessment timing
          example_question: What specific outcome(s) will you measure? When will they be
            assessed?
        - statement: Trial measuring quality of life improvement
          issue: QOL mentioned but no instrument specified
          missing: QOL instrument, measurement timepoints, MCID
          example_question: Which quality of life instrument will you use? (e.g., SF-36,
            EQ-5D, disease-specific) When will you assess it?
      partial:
        - statement: Effect on blood pressure reduction
          has: General outcome category (blood pressure)
          missing: Specific BP parameter (systolic, diastolic, mean arterial), target
            reduction,measurement protocol, timepoint
          example_question: Which BP parameter? (systolic, diastolic, or both) What
            measurement protocol? When will it be assessed?
        - statement: Change in depression scores using validated scales
          has: Outcome type (depression), mentions validation
          missing: Specific scale, timepoints, MCID
          example_question: Which depression scale? (PHQ-9, Beck Depression Inventory,
            HAM-D) At what timepoints? What change is clinically meaningful?
      vague_ambiguous:
        - statement: Study on long-term outcomes of surgery
          issue: "'Long-term' is relative (could be 1 year or 10 years), 'outcomes'
            unspecified"
          example_question: What is the follow-up duration? What specific outcomes will
            you measure? (e.g., survival, complications, functional status)
        - statement: Research on significant improvement in symptoms
          issue: "'Significant' (statistical vs clinical?) and 'symptoms' (which ones?)
            both vague"
          example_question: Which specific symptoms? How will you measure them? What
            defines a clinically meaningful improvement?
  - id: study_type
    name: Study Type
    description: The category of research methodology used to evaluate the
      intervention-outcome relationship, classified by study type, which guides
      eligibility, evidence synthesis, and interpretation
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
      - intervention
      - comparator
      - outcome
    specifications: |
      **Task:** Evaluate and assemble study design specification.

      **Elements to track:**
      - Primary Study Types 
      - Secondary Study Types 
      - Other Study Types

      **Required:**
      - At least one study design specified

      **Category Definitions:**

      PRIMARY STUDY TYPES: 
      Before and after study, Case control study, Case report, Case series, Clinical study, Clinical trial, Cohort study, Comparative study, Cross-sectional study, Diagnostic test accuracy study, Evaluation study, Observational study, Pilot study, Quality improvement study, Randomized controlled trial, Validation study

      SECONDARY STUDY TYPES
      Living review, Meta-analysis, Rapid review, Scoping review, Systematic review, Narrative review, Review

      OTHER STUDY TYPES: 
      Government document, Policy document, Guideline, Consensus conference

      **Assembly example:**
      - User: "RCTs" → Current: "randomized controlled trials"
      - User: "also cohort studies" → Current: "randomized controlled trials and cohort studies"
      - User: "but not retrospective ones" → Current: "randomized controlled trials and prospective cohort studies"

      **Showing Category Lists to User:**

      ALWAYS show the relevant category list(s) when asking for clarification:

      - If no study type specified yet → show ALL STUDY TYPES list
      - If asking about PRIMARY types → show PRIMARY STUDY TYPES list
      - If asking about SECONDARY types → show SECONDARY STUDY TYPES list
      - If asking about OTHER types → show OTHER STUDY TYPES list
      - If asking about multiple categories → show all relevant lists
      - If user has specified one category and you're asking about others → show only the new category list(s)


      **Clarification Behavior:**

      - If user mentions only PRIMARY types → acknowledge, then ask: "Would you also like to include secondary sources (reviews, meta-analyses) or other document types (guidelines, policies)?" + show SECONDARY and OTHER lists

      - If user mentions only SECONDARY types → acknowledge, then ask: "Should we also include primary research studies?" + show PRIMARY list

      - If user mentions only OTHER types → acknowledge, then ask: "Should we also include primary research or secondary sources?" + show PRIMARY and SECONDARY lists

      - If user mentions MIXED types (from multiple categories) → acknowledge, optionally ask about exclusions from shown lists or remaining categories

      - If nothing specified yet → start by asking about PRIMARY types + show PRIMARY list

      - If user mentions unlisted study type → map to closest category if possible, or ask for clarification

      **Completion:**
      Accept once at least one study design is clearly specified from any category.
    examples:
      clear:
        - statement: All RCTs on treatments for basal cell carcinomas
          rationale: primary study types (RCT, clinical trials) clearly specified
      needs_refinement:
        - statement: Study comparing two diabetes medications
          issue: Study type not specified
          missing: Study type
          example_question: What study design? (e.g., randomized controlled trial,
            observational cohort, systematic review)
  - id: clinical_condition
    name: Clinical Condition
    description: The health condition or disease under study, including its stage,
      severity, and relevant comorbidities, which defines eligibility criteria
      and contextualizes outcome relevance for the target population.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - population
    specifications: |
      **Task:** Evaluate and assemble health condition specification.

      **Elements to track:**
      - Primary condition name
      - Disease stage (if applicable)
      - Severity (if applicable)
      - Relevant comorbidities (if applicable)

      **Required:**
      - Primary condition, unambiguous

      **Required if applicable:**
      - Stage: for conditions where staging affects treatment (cancer, CKD)
      - Severity: for conditions where severity affects treatment (depression, asthma)

      **Ambiguity triggers:**
      - "Diabetes" → ask: Type 1, Type 2, or gestational?
      - "Heart disease" → ask: CAD, heart failure, or arrhythmia?
      - "Cancer" → ask: which type and stage?
    examples:
      clear:
        - statement: "Efficacy of SGLT2 inhibitors in Type 2 diabetes patients"
          rationale: primary condition (Type 2 diabetes) specified unambiguously
        - statement: "Management of acute severe asthma exacerbations requiring emergency
            department care."
          rationale: All critical elements present and appropiately specified. Primary
            condition (asthma), disease stage (acute exacerbations), severity
            level (severe), diagnostic criteria  and setting/context implicit
            (requires emergency department level of care)
        - statement: "Effects of statins in patients with moderate hyperlipidemia."
          rationale: primary condition (hyperlipidemia), severity level (moderate)
      needs_refinement:
        - statement: Outcomes of cancer treatment
          issue: Unspecified primary condition type/site
          missing: Specific cancer type (e.g., breast, lung, colorectal) and disease stage
            (I-IV)
          example_question: "What specific type of cancer (e.g., breast, lung, colorectal)
            and disease stage (I-IV) are you focusing on?"
      partial:
        - statement: Study in high-risk cardiovascular patients
          has: primary condition (cardiovascular disease)
          missing: "'High-risk' is subjective - needs risk score, comorbidities, or other
            specific criteria"
          example_question: "What defines 'high-risk'? (e.g., Framingham score, specific
            risk factors, prior events, comorbidities)"
        - statement: Outcomes in hypertensive patients with diabetes
          has: primary condition (hypertension), comorbidity (diabetes)
          missing: "Blood pressure range and Hypertension severity not specified, Diabetes
            type not specified"
          example_question: "Specify hypertension severity (stage 1 or 2), Blood pressure
            range (e.g., 140-159/90-99 mmHg), and diabetes type (Type 1 or Type
            2) to clarify treatment approach"
      vague_ambiguous:
        - statement: Treatment in patients with refractory disease
          issue: "'refractory disease' to what?"
          missing: primary condition vague/unspecified
          example_question: "Which conditions/diseases are you looking at? Is it pertinent
            to also include what treatments the disease is refractory to?"
        - statement: treatment for diabetic patients
          issue: ambiguous diabetes type (Type 1 vs Type 2 vs gestational)
          example_question: "What type of diabetes? (Type 1, Type 2, gestational)"
        - statement: intervention in patients with heart problems
          issue: "‘Heart problems’ is vague - could mean coronary artery disease, heart
            failure, arrhythmias, etc."
          example_question: "What specific heart condition are you referring to? (e.g.,
            coronary artery disease, heart failure, arrhythmias) And are you
            interested in a specific level of severity or stage?"
legal_research:
  - user_context:
      user_type: "Law student"
      context: "Legal research question formulation for case analysis, moot court
        preparation, or law review article development. Student is developing a
        focused legal research question that requires clear identification of
        legal issues, jurisdiction, parties, and relevant legal standards."
      tone: "educational"
      complexity: "intermediate"
      examples_from: "case law"
      constraints:
        - "Jurisdiction: Must specify applicable legal jurisdiction (federal vs
          state, specific circuit)"
        - "Precedent research: Need manageable scope for case law review within
          academic timeline"
        - "Legal standards: Must identify controlling statutes, regulations, or
          common law doctrines"
        - "Time period: Consider whether historical or contemporary legal
          framework applies"
  - id: legal_issue
    name: Legal Issue
    description: The specific legal question, doctrine, or area of law under
      examination, including the nature of the dispute or legal problem
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    specifications: |
      **Task:** Evaluate and assemble legal issue specification.

      **Elements to track:**
      - Area of law (constitutional, contract, tort, criminal, civil procedure, evidence, property, etc.)
      - Specific doctrine or legal principle
      - Type of legal question (interpretation, application, validity, remedy)
      - Level of specificity (field → subfield → specific doctrine)

      **Required:**
      - Clear legal issue or question identified
      - Appropriate scope (not entire fields like "contract law", not hyper-specific single cases)
      - Legal framing (not just factual dispute)

      **Not required:**
      - Specific case names (those come in research process)
      - Complete doctrinal detail (refined through research)

      **Scope calibration:**
      - TOO BROAD: "constitutional law", "contracts", "criminal procedure"
      - APPROPRIATE: "Fourth Amendment search and seizure", "material breach of contract", "hearsay exceptions"
      - TOO NARROW: "application of fruit of poisonous tree to third-party consent in rental properties with absentee landlords"

      **Assembly example:**
      - User: "I'm interested in constitutional law" → current: "constitutional law" (too broad)
      - User: "Fourth Amendment specifically" → current: "Fourth Amendment search and seizure"
      - User: "vehicle stops" → current: "Fourth Amendment search and seizure in vehicle stops"
      - User: "without probable cause" → current: "Fourth Amendment search and seizure in vehicle stops without probable cause (reasonableness standard)"
    examples:
      clear:
        - statement: Fourth Amendment reasonableness of warrantless vehicle searches
            incident to arrest
          rationale: Specific constitutional provision, defined context (vehicles,
            warrantless, incident to arrest), clear legal question
        - statement: Statute of frauds application to oral modifications of written
            employment contracts
          rationale: Specific doctrine (statute of frauds), context (employment
            contracts), type of transaction (oral modifications)
        - statement: Hearsay exception for excited utterances in domestic violence
            prosecutions
          rationale: Specific evidence rule, defined exception, clear application context
      needs_refinement:
        - statement: Constitutional law issues
          issue: Entire field; no specific provision or doctrine
          example_question: Constitutional law covers many areas. Which specific
            constitutional provision or doctrine - free speech, due process,
            equal protection, search and seizure?
        - statement: Contract disputes
          issue: Too vague; no specific legal issue
          example_question: What specific contract law issue - formation, breach,
            remedies, interpretation, or defenses?
      partial:
        - statement: First Amendment free speech
          has: Constitutional provision identified
          missing: Specific doctrine or context (content-based restrictions, prior
            restraint, public forum, commercial speech?)
          example_question: Which aspect of free speech - content-based restrictions,
            time/place/manner, commercial speech, or symbolic speech?
      vague_ambiguous:
        - statement: Legal issues in technology companies
          issue: Not a legal issue; describes a context
          example_question: What specific legal question about technology companies -
            intellectual property, privacy law, antitrust, employment law?
  - id: jurisdiction
    name: Jurisdiction
    description: The applicable legal jurisdiction, including sovereign authority,
      court system, and geographic scope
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - legal_issue
    specifications: |
      **Task:** Evaluate and assemble jurisdiction specification.

      **Elements to track:**
      - Sovereign level (federal, state, tribal, international)
      - Specific jurisdiction (e.g., "New York", "Ninth Circuit", "Supreme Court")
      - Court level if relevant (trial, appellate, supreme)
      - Temporal scope (current law vs historical period)

      **Required:**
      - At least confirm federal vs state
      - Specific state or circuit if researching regional law
      - Acknowledgment if multi-jurisdictional

      **Not required:**
      - Venue (specific courthouse location)
      - Complete citation format

      **Assembly example:**
      - User: "federal law" → current: "federal law"
      - User: "specifically Ninth Circuit" → current: "federal law in Ninth Circuit"
      - User: "California state law too" → current: "federal law (Ninth Circuit) and California state law"
    examples:
      clear:
        - statement: Federal law under the Fourth Amendment as interpreted by the Ninth
            Circuit
          rationale: Sovereign (federal), specific circuit identified, constitutional
            provision clear
        - statement: New York State contract law under UCC Article 2
          rationale: Specific state, area of law (contracts), statutory basis (UCC)
        - statement: Federal patent law in the Federal Circuit
          rationale: Federal jurisdiction, specialized court identified
      needs_refinement:
        - statement: Looking at the law
          issue: No jurisdiction specified
          example_question: Which jurisdiction - federal law, specific state law, or
            comparing multiple jurisdictions?
      partial:
        - statement: Federal constitutional law
          has: Sovereign level (federal), type (constitutional)
          missing: Whether focusing on specific circuit or Supreme Court precedent
          example_question: Are you researching Supreme Court precedent specifically, or
            focusing on a particular federal circuit?
  - id: parties
    name: Parties and Relationships
    description: The legal actors involved, their relationships, and their roles in
      the legal question
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - legal_issue
    specifications: |
      **Task:** Evaluate and assemble parties specification.

      **Elements to track:**
      - Type of parties (individuals, corporations, government entities)
      - Legal relationship (employer-employee, landlord-tenant, buyer-seller, plaintiff-defendant)
      - Relevant characteristics (commercial vs consumer, sophisticated parties, fiduciary relationships)
      - Standing or capacity considerations if relevant

      **Required:**
      - General category of parties (not specific names)
      - Legal relationship that frames the dispute
      - Confirmation if parties are individuals, businesses, or government

      **Not required:**
      - Specific party names
      - Complete factual background

      **Assembly example:**
      - User: "employment situation" → current: "employer and employee"
      - User: "company fired someone" → current: "employer (company) and employee (terminated)"
      - User: "at-will employment" → current: "employer and at-will employee in wrongful termination context"
    examples:
      clear:
        - statement: Government agency conducting administrative search of commercial
            business premises
          rationale: Parties identified (government, business), relationship clear
            (regulatory), context specified
        - statement: Landlord seeking to evict residential tenant for nonpayment of rent
          rationale: Both parties, relationship, legal action, and cause specified
        - statement: Corporate defendant in securities fraud class action by investor
            shareholders
          rationale: Parties, relationship (corporation-shareholders), type of action
            clear
      needs_refinement:
        - statement: A legal dispute
          issue: No parties identified
          example_question: Who are the parties - individuals, businesses, government
            entities? What is their legal relationship?
      partial:
        - statement: Contract between two businesses
          has: Party types (businesses), general relationship (contractual)
          missing: Nature of businesses (commercial vs consumer), specific type of
            contract
          example_question: What type of businesses and contract - B2B sale of goods,
            services agreement, franchise, partnership?
  - id: legal_standard
    name: Legal Standard or Test
    description: The applicable legal standard, test, level of scrutiny, or burden
      of proof that governs the legal issue
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - legal_issue
      - jurisdiction
    specifications: |
      **Task:** Evaluate and assemble legal standard specification.

      **Elements to track:**
      - Governing test or standard (e.g., "reasonable person", "preponderance of evidence", "strict scrutiny")
      - Source of standard (statute, common law, constitutional interpretation)
      - Elements or factors if multi-part test
      - Burden allocation (who bears burden of proof)

      **Required:**
      - Identification of applicable standard if well-established for the legal issue
      - Acknowledgment if standard is disputed or evolving

      **Not required unless central:**
      - Complete recitation of all elements
      - Detailed procedural posture

      **Assembly example:**
      - User: "reasonableness of search" → current: "Fourth Amendment reasonableness standard"
      - User: "without warrant" → current: "Fourth Amendment reasonableness standard for warrantless searches"
      - User: "totality of circumstances" → current: "Fourth Amendment reasonableness under totality of circumstances test for warrantless searches"
    examples:
      clear:
        - statement: Material breach standard for anticipatory repudiation under common
            law contracts
          rationale: Specific standard (material breach), context (anticipatory
            repudiation), source (common law)
        - statement: Strict scrutiny review for content-based speech restrictions under
            First Amendment
          rationale: Level of scrutiny identified, context (speech restrictions),
            constitutional basis clear
        - statement: Probable cause standard for search warrant issuance under Fourth
            Amendment
          rationale: Standard specified, procedural context (warrant issuance),
            constitutional provision
      needs_refinement:
        - statement: What standard applies
          issue: No legal standard identified or described
          example_question: What legal standard are you researching - burden of proof,
            level of scrutiny, specific doctrinal test?
      partial:
        - statement: Reasonable person standard
          has: General standard identified
          missing: Context - reasonable person for what (negligence, harassment,
            self-defense)?
          example_question: Reasonable person standard in what context - tort negligence,
            criminal law, employment harassment?
  - id: remedy_or_outcome
    name: Remedy or Legal Outcome
    description: The legal relief, remedy, or outcome sought or at issue in the
      legal question
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - legal_issue
      - parties
    specifications: |
      **Task:** Evaluate and assemble remedy or outcome specification.

      **Elements to track:**
      - Type of remedy (damages, injunction, declaratory judgment, specific performance, criminal penalty)
      - Scope of relief (compensatory, punitive, equitable)
      - Legal vs equitable remedies
      - Whether remedy is central to research question

      **Required:**
      - General category of relief if central to issue
      - Confirmation whether seeking or defending against remedy

      **Not required:**
      - Specific dollar amounts
      - Complete remedial calculation

      **Assembly example:**
      - User: "trying to get damages" → current: "monetary damages"
      - User: "for breach of contract" → current: "compensatory damages for breach of contract"
      - User: "and punitive damages" → current: "compensatory and punitive damages for breach of contract"
    examples:
      clear:
        - statement: Availability of punitive damages for breach of contract in commercial
            setting
          rationale: Remedy type (punitive damages), legal basis (breach), context
            (commercial)
        - statement: Preliminary injunction to prevent disclosure of trade secrets
          rationale: Equitable remedy (injunction), timing (preliminary), substantive
            issue (trade secrets)
        - statement: Suppression of evidence obtained through unlawful search under
            exclusionary rule
          rationale: Criminal remedy (suppression), legal basis (unlawful search),
            specific doctrine (exclusionary rule)
      needs_refinement:
        - statement: What can they get
          issue: No remedy identified
          example_question: What type of legal relief - monetary damages, injunction,
            specific performance, or other remedy?
      partial:
        - statement: Injunctive relief
          has: General remedy type (injunction)
          missing: Type of injunction (preliminary vs permanent), basis for equitable
            relief
          example_question: What type of injunction - preliminary, permanent, or both?
            What equities support injunctive relief?
solaceai:
  - user_context:
      # Appears verbatim in the user profile prompt and signals the primary stakeholder groups the model should optimize for.
      user_type: "policy maker, humanitarian practitioner, health professional, or
        researcher working on climate-health emergencies"
      # Appears verbatim in the user profile prompt and frames the operational use case the question-refinement should support.
      context: "Real-time evidence synthesis for climate-change health emergencies.
        User is formulating a decision-relevant question to support policy,
        humanitarian, or health-system responses in urgent, context-specific
        settings. The question must support rigorous retrieval and transparent
        synthesis across scientific literature, humanitarian reports, policy
        guidelines, impact assessments, and local case studies."
      # Hard branch controlling interaction style. Pragmatic keeps the model focused on decision-usefulness, feasibility, and actionable framing.
      tone: "pragmatic" # (educational, professional, pragmatic)
      # Hard branch controlling technical depth. Advanced preserves methodological rigor without assuming specialist evidence-synthesis expertise in every user.
      complexity: "advanced" # (novice, intermediate, advanced, expert)
      # If present, activates the instruction "Draw all examples from [Domain]".
      examples_from: "climate-health policy and humanitarian response"
      constraints:
        # "Feasibility: steer the user toward a question that can be answered with a
        # rapid review or living review approach rather than a full systematic
        # review or meta-analysis given the urgency of the context"
        - "During refinement, steer the user toward a question that supports a
          concrete policy, humanitarian, clinical, preparedness, or recovery
          decision rather than an abstract academic framing"
        # "Climate-health linkage: ensure the question explicitly connects the health issue to a climate-sensitive hazard, environmental stressor, or climate-related system impact to ensure relevance for climate-health emergencies"
        - "During refinement, ask for a clear climate-health linkage when the
          query does not yet connect the health issue to a climate-sensitive
          hazard, environmental stressor, or climate-related system impact"
        # "Mixed-evidence readiness: guide the user to a question that can be answered with a mixed-evidence synthesis approach that integrates scientific literature, policy documents, humanitarian reports, and local case studies to support urgent decision-making in complex, rapidly evolving contexts"
        - "During refinement, prefer formulations that can guide retrieval
          across scientific studies, humanitarian reports, policy documents,
          guidelines, and local case studies rather than biomedical literature
          alone"
        - "During refinement, preserve context needed for local applicability
          and transferability, including geography, population vulnerability,
          setting, and implementation constraints when relevant"

        - "During refinement, push the user to operationalize key concepts
          clearly enough that inclusion, exclusion, and synthesis decisions can
          be explained and justified" # "Equity relevance: ensure the question captures equity-relevant groups, settings, or access barriers when they may shape differential impacts or intervention feasibility in climate-health emergencies"
        - "During refinement, probe for equity-relevant groups, settings, or
          access barriers when they may shape differential impacts or
          intervention feasibility" # "Some questions can be too broad, too heterogeneous, or too weakly specified. This guardrail tells the model to catch that before starting the evidence retrieval and synthesis process where stakes are higher and course correction is more difficult"
        - "During refinement, flag combinations that are too broad,
          incomparable, or weakly specified to support coherent synthesis,
          critical appraisal, or communication of uncertainty and caveats"
  - id: priority_population
    name: Priority Population
    description: The group of individuals, communities, or entities most relevant to
      the question, defined by demographic characteristics, vulnerability,
      exposure, setting, and any other inclusion criteria that shape evidence
      applicability.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - operational_context
    specifications: |
      **Task:** Evaluate and assemble population specification.

      **Elements to track:**
      - Age (range, category, or life stage)
      - Sex/gender
      - Ethnicity/race
      - Geographic setting or context
      - Relevant subgroup characteristics: roles (e.g., healthcare workers, parents, teachers, students, caregivers), affiliations (e.g., military veterans, union members), socioeconomic markers (e.g., low-income, uninsured, educational attainment), pregnancy/reproductive status, occupational categories, insurance status

      **Required:**
      - At least confirm whether "all populations" or limited to specific demographics
      - Age specification if topic is age-dependent
      - Setting if research is geography/culture-dependent

      **Not required unless relevant:**
      - Ethnicity/race specification (only if health disparities focus or explicitly mentioned)
      - All elements (partial is acceptable if user confirms scope)

      **Age standardization:**
      When assembling, standardize age terms:
      - "kids" → "children (2-12 years)"
      - "elderly" → "older adults (65+ years)"
      - Non-standard range → prepend "approximately"
    examples:
      clear:
        - statement: Efficacy of metformin in adults aged 40-65 with type 2 diabetes
          rationale: Age (40-65) specified, with all-inclusive gender (adults) and
            ethnicity and setting
        - statement: Postmenopausal women under 65 in urban clinical settings
          rationale: clearly described age (postmenopausal under 65), gender (women),
            setting (urban clinical)
        - statement: Black males aged 18-45 with hypertension in community health centers
          rationale: clearly defined age (18-45), gender (males), ethnicity (Black),
            setting (community health centers)
      needs_refinement:
        - statement: The effect of exercise on depression
          issue: Zero demographics specified; too broad
          missing: Age, gender at minimum
          example_question: "You are including all ages, genders, ethnicities, and
            settings. Is that correct or do you want to limit to you have any
            specific age range, sex/gender, setting, and/or ethnicity/race?"
      partial:
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women) and minimum age (40)
          missing: ethnicity (if CVD disparities relevant),setting (geographic/clinical
            context)
          example_question: Is there an upper age limit? Are you focusing on specific
            ethnic groups given CVD disparities?
      vague_ambiguous:
        - statement: Treatment outcomes in minority populations aged 65 and older in
            tertiary care hospitals
          issue: "'Minority populations' is vague and could mean multiple groups"
          missing: precise ethnicity/race or setting; maybe gender as well
          example_question: "Which specific population groups are you focusing on? (e.g.,
            Hispanic/Latino, African American, Asian, Native American). Do you
            have any specifications regarding gender or geographic location?"
  - id: response_or_comparison_frame
    name: Response or Comparison Frame
    description: The intervention, exposure, strategy, policy option, standard
      practice, or comparison frame used to structure the question and guide
      evidence retrieval.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - priority_population
      - problem_focus
    specifications: |
      **Task:** Evaluate and assemble response or comparison frame specification.

      **Intervention source specification:**

      **Elements to track:**
      - Intervention type (pharmacological/procedural/behavioral/diagnostic)
      - Specific agent or method
      - Dosing/intensity (if applicable)
      - Duration (if applicable)
      - Delivery method (if applicable)

      **Required:**
      - Intervention type
      - Specific agent/method name

      **Required if applicable:**
      - Dosing: for dose-dependent interventions
      - Duration: if affects outcomes
      - Delivery: if route/setting/provider affects outcomes

      **Comparator source specification:**

      **Elements to track:**
      - Comparator type (placebo/standard care/active comparator/no treatment)
      - Specific comparator details (matching intervention specificity)

      **Required:**
      - At least one comparator specified
      - Comparator detail level matching intervention detail

      **Comparator types:**
      - Placebo: inert substance or mock procedure
      - Standard care: specify which guideline or usual practice
      - Active comparator: specify drug, dose, or technique
      - No treatment: watchful waiting (justify if effective treatment exists)
    examples:
      clear:
        - statement: Metformin vs placebo in newly diagnosed Type 2 diabetes over 6
            months.
          rationale: Inferred intervention type (Pharmacological), Drug (metformin),
            duration (6 months), and comparison (placebo) well specified.
        - statement: Laparoscopic Roux-en-Y gastric bypass compared to other techniques
          rationale: Specific intervention type (surgical technique, inferred) and method
            (laparoscopic Roux-en-Y)
        - statement: Cognitive Behavioral Therapy delivered by licensed clinical
            psychologists
          rationale: Inferred intervention type (nonpharmacological), method (CBT),
            provider (licensed psychologists)
        - statement: Metformin vs placebo in prediabetic adults
          rationale: Clear active intervention (metformin) vs inert control (placebo)
        - statement: New anticoagulant compared to warfarin (standard care) in atrial
            fibrillation
          rationale: Novel treatment (New anticoagulant) vs established standard of care
            (warfarin)
        - statement: High-intensity statins vs moderate-intensity statins in secondary
            prevention
          rationale: clear comparator (High-intensity statins vs moderate-intensity
            statins)
      needs_refinement:
        - statement: Effects of new drug on blood pressure
          issue: No comparison group mentioned
          missing: Comparator specification
          example_question: What will you compare the new drug against? (e.g., any other
            treatmentplacebo, current standard treatment, another active drug)
        - statement: Study of surgical intervention
          issue: No comparison - surgery vs what?
          missing: Control/comparison group
          example_question: What is the comparison? (e.g., surgery vs medical management,
            surgery vs observation, one surgical technique vs another)
      partial:
        - statement: Exercise intervention for weight loss
          has: intervention type (exercise)
          missing: exercise modality, intensity level, frequency, session duration
            unspecified
          example_question: What type of exercise? (aerobic, resistance, both) What
            intensity, frequency, and exercise modality?
        - statement: Effects of medication on blood pressure
          has: intervention type (Pharmacological)
          missing: Drug name (optional dose, frequency, duration, route)
          example_question: Which medication are you studying? Please specify the drug
            name, dose, frequency, and treatment duration if applicable.
      vague_ambiguous:
        - statement: Intensive glycemic control in diabetes
          issue: " Intervention type is clear (glycemic control); 'Intensive' is
            subjective - it could be specified as a regimen or target"
          missing: Specific regimen or glycemic targets
          example_question: "Are you interested in a specific intervention and regimen or
            a target that defines 'intensive control'?"
        - statement: ACE inhibitors versus control in hypertension
          issue: "'Control' could mean placebo, standard care, or no treatment"
          example_question: What does 'control' mean in your study? (placebo, standard
            antihypertensive therapy, or no treatment)
        - statement: Intervention vs standard therapy
          issue: "'Standard therapy' varies by geography, guidelines, and time period"
          example_question: What specific treatment(s) constitute 'standard therapy' in
            your context? (e.g., specific drugs, specific guidelines)
  - id: decision_outcomes_and_evidence_scope
    name: Decision Outcomes and Evidence Scope
    description: The decision-relevant outcomes, indicators, endpoints, phenomena,
      and evidence-source or study-type boundaries that determine what evidence
      is useful, eligible, and interpretable.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - priority_population
      - response_or_comparison_frame
    specifications: |
      **Task:** Evaluate and assemble decision outcomes and evidence scope specification.

      **Outcome source specification:**

      **Elements to track:**
      - Primary outcome(s) or main variable(s) of interest
      - Outcome type (clinical, behavioral, attitudinal, system-level)
      - Measurement method, instrument, or data source
      - Timepoint(s) or assessment period (if applicable)

      **Required:**
      - At least one primary outcome or main variable of interest
      - Measurement method for vague outcomes (satisfaction, improvement, experiences)

      **Conditionally required:**
      - Timepoint: required if timing affects interpretation
      - Instrument: required for subjective outcomes; not needed for self-evident measures

      **Evidence scope source specification:**

      **Elements to track:**
      - Primary Study Types 
      - Secondary Study Types 
      - Other Study Types

      **Required:**
      - At least one study design specified

      **Category Definitions:**

      PRIMARY STUDY TYPES: 
      Before and after study, Case control study, Case report, Case series, Clinical study, Clinical trial, Cohort study, Comparative study, Cross-sectional study, Diagnostic test accuracy study, Evaluation study, Observational study, Pilot study, Quality improvement study, Randomized controlled trial, Validation study

      SECONDARY STUDY TYPES
      Living review, Meta-analysis, Rapid review, Scoping review, Systematic review, Narrative review, Review

      OTHER STUDY TYPES: 
      Government document, Policy document, Guideline, Consensus conference

      **Assembly example:**
      - User: "RCTs" → Current: "randomized controlled trials"
      - User: "also cohort studies" → Current: "randomized controlled trials and cohort studies"
      - User: "but not retrospective ones" → Current: "randomized controlled trials and prospective cohort studies"

      **Showing Category Lists to User:**

      ALWAYS show the relevant category list(s) when asking for clarification:

      - If no study type specified yet → show ALL STUDY TYPES list
      - If asking about PRIMARY types → show PRIMARY STUDY TYPES list
      - If asking about SECONDARY types → show SECONDARY STUDY TYPES list
      - If asking about OTHER types → show OTHER STUDY TYPES list
      - If asking about multiple categories → show all relevant lists
      - If user has specified one category and you're asking about others → show only the new category list(s)


      **Clarification Behavior:**

      - If user mentions only PRIMARY types → acknowledge, then ask: "Would you also like to include secondary sources (reviews, meta-analyses) or other document types (guidelines, policies)?" + show SECONDARY and OTHER lists

      - If user mentions only SECONDARY types → acknowledge, then ask: "Should we also include primary research studies?" + show PRIMARY list

      - If user mentions only OTHER types → acknowledge, then ask: "Should we also include primary research or secondary sources?" + show PRIMARY and SECONDARY lists

      - If user mentions MIXED types (from multiple categories) → acknowledge, optionally ask about exclusions from shown lists or remaining categories

      - If nothing specified yet → start by asking about PRIMARY types + show PRIMARY list

      - If user mentions unlisted study type → map to closest category if possible, or ask for clarification

      **Completion:**
      Accept once at least one study design is clearly specified from any category.
    examples:
      clear:
        - statement: Effect of intervention on all-cause mortality at 5 years or more
          rationale: Specific outcome (all-cause mortality), clear timepoint (5 years or
            more). With this outcome, a shorter duration may not be associated
            with the intervention; thus the inclusion of a longer timepoint.
        - statement: Change in HbA1c from baseline to 6 months
          rationale: Outcome type (diabetes indicator) inferred, measurement method
            -specific biomarker- (HbA1c) and timeframe (baseline to 6 months)
            clearly defined
        - statement: All RCTs on treatments for basal cell carcinomas
          rationale: primary study types (RCT, clinical trials) clearly specified
      needs_refinement:
        - statement: Study on treatment effectiveness
          issue: "'Effectiveness' not defined - needs specific measurable outcome"
          missing: Specific outcome measure, measurement method, timepoint
          example_question: How will you measure effectiveness? (e.g., specific clinical
            outcomes, biomarkers, patient-reported measures)
        - statement: Research on improving patient outcomes
          issue: "'Outcomes' is vague - could mean dozens of different measures"
          missing: Specific outcome(s), measurement tools, assessment timing
          example_question: What specific outcome(s) will you measure? When will they be
            assessed?
        - statement: Trial measuring quality of life improvement
          issue: QOL mentioned but no instrument specified
          missing: QOL instrument, measurement timepoints, MCID
          example_question: Which quality of life instrument will you use? (e.g., SF-36,
            EQ-5D, disease-specific) When will you assess it?
        - statement: Study comparing two diabetes medications
          issue: Study type not specified
          missing: Study type
          example_question: What study design? (e.g., randomized controlled trial,
            observational cohort, systematic review)
      partial:
        - statement: Effect on blood pressure reduction
          has: General outcome category (blood pressure)
          missing: Specific BP parameter (systolic, diastolic, mean arterial), target
            reduction,measurement protocol, timepoint
          example_question: Which BP parameter? (systolic, diastolic, or both) What
            measurement protocol? When will it be assessed?
        - statement: Change in depression scores using validated scales
          has: Outcome type (depression), mentions validation
          missing: Specific scale, timepoints, MCID
          example_question: Which depression scale? (PHQ-9, Beck Depression Inventory,
            HAM-D) At what timepoints? What change is clinically meaningful?
      vague_ambiguous:
        - statement: Study on long-term outcomes of surgery
          issue: "'Long-term' is relative (could be 1 year or 10 years), 'outcomes'
            unspecified"
          example_question: What is the follow-up duration? What specific outcomes will
            you measure? (e.g., survival, complications, functional status)
        - statement: Research on significant improvement in symptoms
          issue: "'Significant' (statistical vs clinical?) and 'symptoms' (which ones?)
            both vague"
          example_question: Which specific symptoms? How will you measure them? What
            defines a clinically meaningful improvement?
  - id: problem_focus
    name: Problem Focus
    description: The health issue, system problem, climate-health pathway, or
      decision problem the user wants evidence about.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - priority_population
    specifications: |
      **Task:** Evaluate and assemble health condition specification.

      **Elements to track:**
      - Primary condition name
      - Disease stage (if applicable)
      - Severity (if applicable)
      - Relevant comorbidities (if applicable)

      **Required:**
      - Primary condition, unambiguous

      **Required if applicable:**
      - Stage: for conditions where staging affects treatment (cancer, CKD)
      - Severity: for conditions where severity affects treatment (depression, asthma)

      **Ambiguity triggers:**
      - "Diabetes" → ask: Type 1, Type 2, or gestational?
      - "Heart disease" → ask: CAD, heart failure, or arrhythmia?
      - "Cancer" → ask: which type and stage?
    examples:
      clear:
        - statement: "Efficacy of SGLT2 inhibitors in Type 2 diabetes patients"
          rationale: primary condition (Type 2 diabetes) specified unambiguously
        - statement: "Management of acute severe asthma exacerbations requiring emergency
            department care."
          rationale: All critical elements present and appropiately specified. Primary
            condition (asthma), disease stage (acute exacerbations), severity
            level (severe), diagnostic criteria  and setting/context implicit
            (requires emergency department level of care)
        - statement: "Effects of statins in patients with moderate hyperlipidemia."
          rationale: primary condition (hyperlipidemia), severity level (moderate)
      needs_refinement:
        - statement: Outcomes of cancer treatment
          issue: Unspecified primary condition type/site
          missing: Specific cancer type (e.g., breast, lung, colorectal) and disease stage
            (I-IV)
          example_question: "What specific type of cancer (e.g., breast, lung, colorectal)
            and disease stage (I-IV) are you focusing on?"
      partial:
        - statement: Study in high-risk cardiovascular patients
          has: primary condition (cardiovascular disease)
          missing: "'High-risk' is subjective - needs risk score, comorbidities, or other
            specific criteria"
          example_question: "What defines 'high-risk'? (e.g., Framingham score, specific
            risk factors, prior events, comorbidities)"
        - statement: Outcomes in hypertensive patients with diabetes
          has: primary condition (hypertension), comorbidity (diabetes)
          missing: "Blood pressure range and Hypertension severity not specified, Diabetes
            type not specified"
          example_question: "Specify hypertension severity (stage 1 or 2), Blood pressure
            range (e.g., 140-159/90-99 mmHg), and diabetes type (Type 1 or Type
            2) to clarify treatment approach"
      vague_ambiguous:
        - statement: Treatment in patients with refractory disease
          issue: "'refractory disease' to what?"
          missing: primary condition vague/unspecified
          example_question: "Which conditions/diseases are you looking at? Is it pertinent
            to also include what treatments the disease is refractory to?"
        - statement: treatment for diabetic patients
          issue: ambiguous diabetes type (Type 1 vs Type 2 vs gestational)
          example_question: "What type of diabetes? (Type 1, Type 2, gestational)"
        - statement: intervention in patients with heart problems
          issue: "‘Heart problems’ is vague - could mean coronary artery disease, heart
            failure, arrhythmias, etc."
          example_question: "What specific heart condition are you referring to? (e.g.,
            coronary artery disease, heart failure, arrhythmias) And are you
            interested in a specific level of severity or stage?"
  - id: user_and_task
    name: User and Task
    description: The professional role, organizational affiliation, and concrete use
      task of the person querying Solace-AI, used to calibrate response framing,
      document type prioritization, decision orientation, and language
      complexity.
    strictness: STRICT
    specifications: |
      **Task:** Identify and assemble user and task specification.

      **Elements to track:**
      - Professional role (clinician, researcher, policymaker, public health practitioner, field/humanitarian worker, other)
      - Organizational context (hospital, ministry/government, academic institution, NGO/humanitarian organization, primary care setting, other)
      - Use intent or task (clinical practice, research/grant, policy brief, operational planning, community outreach, other)
      - Deliverable or decision task when stated (brief, protocol, contingency plan, training material, evidence summary, grant proposal, etc.)
      - Target audience for output (self, supervisor/minister, academic reviewers, field staff, community members)
      - Technical/domain literacy (medical, research, policy, non-specialist)

      **Required:**
      - Professional role (at minimum a broad category)
      - Use intent or task

      **Not required unless volunteered:**
      - Specific institution or organization name
      - Precise seniority level (unless it affects output framing, e.g., grant PI vs. coordinator)
      - Formal job title if a broader role and task are already clear

      **Inference behavior:**
      - If the user's query or context strongly implies a role (e.g., mentions "my ward", "my grant proposal", "the Minister"), infer and confirm rather than ask from scratch
      - If the query strongly implies the task or deliverable (e.g., "prepare a brief", "develop contingency plans", "write a grant proposal"), capture that explicitly rather than treating it as background only
      - If role is ambiguous between two categories (e.g., clinician-researcher), accept the hybrid and note both
      - Seniority modifiers (junior/senior, chief/coordinator) should be captured if volunteered, as they affect output complexity and document type preferences

      **Downstream use note:**
      - This dimension should capture the user's role and task cleanly.
      - Any role-specific source-prioritization, output-format, or response-calibration rules should be handled in downstream routing, retrieval, or synthesis logic rather than in this refinement dimension.

    examples:
      clear:
        - statement: "I am a hospital administrator preparing flood contingency plans"
          rationale: Role (administrator), organizational context (hospital), and use
            intent (operational planning) all clearly established
        - statement: "I am a postdoctoral researcher writing a grant proposal on
            vector-borne disease in Peru"
          rationale: Role (researcher), use intent (grant writing), and geographic/topical
            focus (Peru, vector-borne disease) all specified
        - statement: "I work at the Ministry of Environment and need to prepare a brief
            for the Minister on urban heat mitigation"
          rationale: Role (policy officer), context (government ministry), and target
            audience (Minister) clearly stated; use intent (policy brief)
            inferred
      needs_refinement:
        - statement: "I need information on flood preparedness"
          issue: No role or context provided; response framing cannot be calibrated
          missing: Professional role, organizational context, use intent
          example_question: |
            To tailor the results to your needs, could you tell me a bit about yourself?
            For example:
            - Are you a clinician, hospital administrator, researcher, policymaker, or field/humanitarian worker?
            - Are you preparing for clinical practice, operational planning, a policy document, or a research project?
      partial:
        - statement: "I am a doctor in rural China"
          has: Professional role (clinician), geographic context (rural China)
          missing: Use intent (clinical practice assumed but not confirmed), target
            audience
          example_question: "Are you looking for this to inform your own clinical
            practice, or are you preparing materials for community outreach or
            colleagues?"
        - statement: "I work in a refugee camp"
          has: Organizational context (humanitarian/field setting)
          missing: Role (medical vs. non-medical), use intent, target audience
          example_question: "What is your role in the camp — are you a healthcare
            provider, a coordinator, or another kind of staff? And what will you
            use the information for?"
      vague_ambiguous:
        - statement: "I work in public health"
          issue: "'Public health' spans clinical, research, policy, and field roles"
          example_question: "Could you tell me more about your specific role? For example,
            are you a practitioner, researcher, policymaker, or working in a
            field/humanitarian setting? And what will you use this search for?"
  - id: operational_context
    name: Operational Context
    description: The geographic, climatic, environmental, and implementation context
      in which the query will be applied, including location, setting, hazard or
      stressor, temporal phase, and transferability considerations that shape
      evidence relevance for climate-health decision-making.
    strictness: MODERATE
    depends_on:
      - user_and_task
    specifications: |
      **Task:** Identify and assemble operational context specification.

      **Elements to track:**
      - Country or countries of interest
      - Sub-national region or administrative unit (if relevant)
      - Urban/rural/peri-urban or facility/community setting
      - Cross-context applicability intent (local only, global with local lens, or global synthesis)
      - Hazard or stressor type (see taxonomy below)
      - Temporal phase (anticipatory/preparedness, acute/response, post-event/recovery, chronic/ongoing)
      - Severity or intensity (if characterizable)
      - Affected domain(s) (health system, public health, environment, livelihoods, displacement)
      - Climate zone, ecological setting, or income classification if they materially shape applicability

      **Required:**
      - At least one location or application setting
      - At least one hazard or stressor type
      - Temporal phase if strongly implied or decision-relevant

      **Not required unless relevant:**
      - Sub-national specificity (only if regional variation is epidemiologically, operationally, or policy-relevant)
      - Urban/rural classification (only if setting-dependent)
      - Severity (only if evidence applicability depends on severity)
      - Climate zone or ecological setting (only if directly relevant to the hazard or intervention context)
      - Income classification (infer from country when useful; only ask if ambiguity affects scope)

      **Cross-context applicability:**
      - "Local only": user wants evidence from their specific country or region
      - "Global with local lens": user wants global evidence filtered for transferability to their context
      - "Global synthesis": user wants comprehensive global evidence regardless of setting
      - Default to "Global with local lens" if a specific application context is given but evidence scope is unspecified

      **Hazard taxonomy:**

      METEOROLOGICAL & HYDROLOGICAL HAZARDS:
      Flood (riverine, flash, coastal, urban), Drought, Extreme heat event / heatwave, Wildfire / forest fire, Tropical cyclone / hurricane / typhoon, Storm surge, Extreme cold event, Landslide (rainfall-triggered)

      AIR QUALITY & ATMOSPHERIC HAZARDS:
      Urban air pollution (particulate matter, ozone, NOx), Wildfire smoke, Dust storm / sandstorm, Indoor air pollution

      ECOLOGICAL & BIOLOGICAL HAZARDS:
      Vector-borne disease emergence/spread (climate-driven), Waterborne disease outbreak (climate-driven), Food insecurity / crop failure (climate-driven), Ecosystem degradation, Biodiversity loss

      SLOW-ONSET & CHRONIC STRESSORS:
      Sea level rise, Coastal erosion, Desertification / land degradation, Permafrost thaw, Ocean acidification, Chronic heat stress (not discrete event)

      COMPOUND & CASCADING EVENTS:
      Compound flood-drought, Drought-conflict-displacement nexus, Climate-migration-health nexus, Cascading infrastructure failure

      **Temporal phase definitions:**
      - Anticipatory/preparedness: before a predicted or seasonal event; focus on prevention, stockpiling, training
      - Acute/response: during or immediately after an event; focus on rapid response, triage, emergency protocols
      - Post-event/recovery: weeks to months after; focus on rehabilitation, disease surveillance, mental health, reconstruction
      - Chronic/ongoing: persistent stressor without discrete event boundary; focus on adaptation, long-term management

      **Inference behavior:**
      - If the user's role or query already implies a location, setting, or hazard (e.g., "rural China", "flood preparedness", "heat in Indian cities"), pre-populate and confirm rather than asking from scratch
      - If a country is named, infer income classification when useful, but only surface it if it affects scope or transferability
      - If the query is about global best practices for local use, capture both the evidence scope and the intended application context
      - If the query involves migration or displacement, capture both origin and destination contexts when relevant
      - If multiple hazards are plausible, ask the user to narrow or confirm the operational scope
      - Map colloquial terms to the taxonomy where possible (e.g., "bad air quality" → urban air pollution; "disease after floods" → flood + waterborne disease outbreak)
    examples:
      clear:
        - statement: "Flood preparedness guidelines for a tertiary hospital in Bangkok"
          rationale: Country and city (Thailand, Bangkok), facility setting, hazard
            (flood), and operational use case are clearly established
        - statement: "Vector-borne disease interventions in rural Peru, or globally if
            transferable to Peru's context"
          rationale: Country (Peru), rural setting, hazard (climate-driven vector-borne
            disease), and applicability intent (global with local lens) are all
            explicit
        - statement: "Reducing urban air pollution and heat-related illness in Indian
            cities during extreme summer heat"
          rationale: Country (India), urban setting, hazards (urban air pollution, extreme
            heat), and temporal context are all present and useful for retrieval
      needs_refinement:
        - statement: "Climate change and health"
          issue: Too broad operationally; no location, hazard, or application context
          missing: Location or setting, specific hazard or stressor, and likely temporal
            or decision context
          example_question: |
            To narrow the operational context, could you specify:
            - Where this information will be applied
            - Which climate or environmental hazard you are focusing on
            - Whether the need is for preparedness, response, recovery, or long-term adaptation?
        - statement: "Guidelines for heat-related illness"
          issue: Hazard is partially clear, but place and application context are missing
          missing: Country or region, setting, and evidence scope
          example_question: |
            Where will this information be applied?
            - Which country or region are you working in?
            - Is the setting urban, rural, community, or facility-based?
            - Do you want local evidence only, or global evidence that can be adapted to your context?
      partial:
        - statement: "Displacement health in a camp in East Africa"
          has: Region (East Africa), setting (displacement camp), operational domain
            (displacement health)
          missing: Specific country, hazard driver, and whether evidence should be local
            or global
          example_question: "Which country is the camp in, what climate-related hazard is
            driving the displacement, and do you want evidence from that setting
            only or from comparable contexts globally?"
        - statement: "Heat-related illness in summer"
          has: Hazard (extreme heat / heatwave), likely temporal context
          missing: Location, setting, and whether the focus is preparedness, response, or
            treatment
          example_question: "Which country or setting are you concerned with, and is your
            focus on preventing heat-related illness, responding during heat
            events, or managing recovery afterward?"
      vague_ambiguous:
        - statement: "Developing countries"
          issue: Imprecise geographic scope with wide variation in climate, health
            systems, and policy settings
          example_question: "Could you specify a country, region, or more precise context
            for where this evidence will be applied?"
        - statement: "Disasters and health"
          issue: Too broad; does not identify whether the focus is climate-related, which
            hazard is relevant, or where the evidence will be used
          example_question: "Are you focusing on specific climate- or weather-related
            hazards such as floods, heatwaves, drought, cyclones, or air
            pollution, and in what geographic setting?"
cocopop_v1:
  - user_context:
      user_type: "policy maker, humanitarian practitioner, health professional, or researcher working on climate-health emergencies"
      context:
        "Real-time evidence synthesis for climate-change health emergencies.
        User is formulating a decision-relevant question to support policy,
        humanitarian, or health-system responses in urgent, context-specific
        settings. The question must support rigorous retrieval and transparent
        synthesis across scientific literature, humanitarian reports, policy
        guidelines, impact assessments, and local case studies."
      tone: "pragmatic"
      complexity: "advanced"
      examples_from: "climate-health policy and humanitarian response"
  - id: condition
    name: Condition
    description:
      The health condition, disease, symptom, problem, or social issue
      under study, including its case definition, diagnostic criteria, and
      climate-health linkage.
    specifications: |
      **Task:** Extract and assemble the condition specification into a single descriptive string.

      **Elements to silently extract, if present:**
      - Named condition: health condition, disease, symptom, problem, or social issue
      - Climate-health linkage: climate-sensitive hazard or environmental stressor driving or
        exacerbating the condition
      - Case definition or diagnostic threshold
      - Temporal qualifier (e.g., acute phase, post-exposure, seasonal peak)
      - Symptom cluster (e.g., "fever and respiratory distress", "acute watery diarrhoea")
      - Causal pathway (e.g., smoke-inhalation-related respiratory illness, flood-contamination-related enteric disease)

      **When to ask (governs questions only, not extraction):**
      - Named condition: ask if absent. Ask if present but at wrong specificity level (see
        specificity thresholds).
      - Climate-health linkage: ask if absent. Example prompt: "What climate or environmental
        hazard drives or exacerbates this condition? (e.g., flood, drought, extreme heat,
        wildfire smoke)"
      - Case definition or diagnostic threshold: ask if absent and the named condition
        encompasses multiple severity levels or subtypes requiring different interventions
        (e.g., "malnutrition" spans acute wasting, stunting, and micronutrient deficiency;
        "heat illness" spans heat exhaustion and heat stroke).
      - Temporal qualifier: ask if absent and the phase of illness materially affects which
        interventions apply or how outcomes are measured (e.g., acute vs. post-exposure
        respiratory illness, seasonal vs. year-round transmission).
      - Symptom cluster: ask if absent and the condition is defined by symptoms rather than
        a named disease entity (e.g., "fever and respiratory distress", "acute watery diarrhoea").
      - Causal pathway: ask if absent and the question concerns prevention, or if the condition
        is defined by its cause (e.g., smoke-inhalation-related respiratory illness,
        flood-contamination-related enteric disease).

      **Never ask about:** symptom cluster or causal pathway unless the trigger condition above
      is clearly met. If absent and no trigger applies, omit silently.

      **Specificity thresholds (ask when present but at wrong level):**

      Named condition:
      - TOO BROAD: condition name encompasses multiple distinct entities with different case
        definitions, interventions, or evidence bases (e.g., "malnutrition", "waterborne disease",
        "climate-related illness", "mental health impacts"). Ask: "Are you focusing on [specific
        form A] or [specific form B]? What diagnostic threshold or case definition applies?"
      - APPROPRIATE: named condition with a recognised case definition or diagnostic reference
        point (e.g., "acute watery diarrhoea using WHO case definition", "heat stroke defined
        as core temperature ≥40°C or altered consciousness").
      - TOO SPECIFIC: specificity would exclude all or nearly all available evidence. Ask:
        "The condition as specified may be too narrow to retrieve sufficient evidence. Would
        broadening to [proposed broader term] be acceptable?"
    examples:
      clear:
        - statement: "Acute watery diarrhoea in children under 5 years, driven by flood-contaminated water sources, acute phase within 2 weeks of flood onset"
          rationale: Named condition (acute watery diarrhoea), climate-health linkage (flood-contaminated water) and temporal qualifier (acute phase, within 2 weeks of flood onset) all specified.
        - statement: "Post-traumatic stress disorder (PTSD, DSM-5 criteria) in adults following climate-driven displacement, chronic phase (6+ months post-displacement)"
          rationale: named condition (PTSD, DSM-5), climate-health linkage (climate-driven displacement), temporal qualifier (chronic, 6+ months) all explicit.
      needs_refinement:
        - statement: "Climate-related illness in displaced populations"
          issue: TOO BROAD — "climate-related illness" spans heat illness, vector-borne disease, waterborne disease, respiratory illness from wildfire smoke, and malnutrition. No single evidence base applies.
          example_question: "Which condition specifically? (e.g., heat stroke, malaria, acute watery diarrhoea, smoke-related respiratory illness, acute wasting)"
        - statement: "Waterborne diseases following flooding"
          issue:
            TOO BROAD — encompasses cholera, typhoid, hepatitis A, and leptospirosis,
            each with distinct case definitions, diagnostic criteria, and interventions.
          example_question:
            "Which waterborne disease specifically? (e.g., cholera using WHO case
            definition, typhoid fever, leptospirosis, hepatitis A)"
      partial:
        - statement: "Cholera outbreaks in displacement camps following flooding"
          has: named condition (cholera), context (displacement camps), climate-health linkage implied (flooding)
          missing: case definition — cholera has WHO clinical and laboratory case definitions with different eligibility implications; climate-health linkage present but not explicitly named as the driver
          example_question: "Which case definition applies — WHO clinical case definition or laboratory-confirmed? Is flooding the primary driver of transmission in this context?"
      vague_ambiguous:
        - statement: "Health impacts of displacement caused by sea-level rise"
          issue: '"Health impacts" is undefined — could mean infectious disease, mental health injury, malnutrition, or non-communicable disease exacerbation. Climate-health linkage(sea-level rise) is present but the condition is entirely unspecified'
          missing:
            Named condition or disease, specific hazard or stressor, and case
            definition or measurement approach.
          example_question: "Which health condition are you focusing on? (e.g., mental health impacts of displacement, waterborne disease, malnutrition, injury)"
  - id: context
    name: Context
    description:
      The geographic, environmental, and implementation setting in which
      the condition occurs and in which any response or intervention would be
      applied.
    depends_on:
      - condition
    specifications: |
      **Task:** Extract and assemble the context specification into a single descriptive string.

      **Elements to silently extract, if present:**
      - Geographic setting: country, region, or sub-national area
      - Urban/rural/peri-urban classification
      - Income or resource setting: World Bank income group or explicit resource descriptor
      - Health system level and capacity
      - Socioeconomic and political context: conflict-affected, fragile state, post-disaster,
        displacement camp, food-insecure
      - Environmental or climate setting: drought-prone, flood-prone, coastal, heat-stressed urban
      - Temporal context: acute emergency, recovery, chronic/ongoing, seasonal window

      **When to ask (governs questions only, not extraction):**
      - Geographic setting: ask if absent. Ask if present but at wrong specificity level (see
        specificity thresholds).
      - Health system capacity: ask if absent and the intervention under consideration depends
        on specific infrastructure or personnel (e.g., cold chain for vaccines, laboratory
        diagnostics, surgical capacity, trained specialist availability). Do not ask for
        burden, exposure, incidence, or risk questions when no intervention, delivery
        platform, implementation setting, or feasibility constraint is explicitly under
        consideration. Ask if present but too vague (see specificity thresholds).
      - Temporal context: ask if absent and the phase of the emergency determines which
        evidence or intervention types are eligible (e.g., acute search-and-rescue vs.
        recovery-phase rehabilitation; active outbreak response vs. post-outbreak surveillance).
        Ask if present but too vague (see specificity thresholds).
      - Urban/rural classification: ask if absent and condition burden, care-seeking behaviour,
        or intervention delivery differs materially by setting type (e.g., vector-borne disease
        with urban vs. rural transmission patterns; community health worker reach in rural
        vs. peri-urban areas).

      **Never ask about:** income or resource setting, socioeconomic and political context,
      environmental or climate setting. If absent, omit silently. If present, extract silently.

      **Specificity thresholds (ask when present but at wrong level):**

      Geographic setting:
      - TOO BROAD: continent-level terms (e.g., "Africa", "Asia") or heterogeneous groupings
        (e.g., "developing countries", "Global South") with no hazard, income, or sub-regional
        anchor. Ask: "Are you focusing on a specific country or sub-region, or is the broader
        geographic scope intentional for this question?"
      - APPROPRIATE: country-level or sub-national region with at least one additional anchor
        (hazard, income group, or setting type). Do not ask for district, province, or camp-level
        specificity when a country-level setting already includes a meaningful hazard or setting
        anchor and that level is adequate for retrieval.
      - TOO SPECIFIC: single district, municipality, or locality with no broader anchor. Ask:
        "Should the scope remain limited to [location], or should it be broadened to
        [country/region] to ensure sufficient evidence is available?"

      Health system capacity:
      - TOO VAGUE: terms spanning multiple distinct system levels without further specification
        (e.g., "limited resources", "low-resource setting", "weak health system"). Ask: "Do
        you mean community health worker-level care, primary care without laboratory capacity,
        district hospital, or a humanitarian field setting?"
      - APPROPRIATE: specific level with at least one capacity constraint named (e.g., "primary
        care clinics without diagnostic laboratory", "district hospital with no ICU capacity").

      Temporal context:
      - TOO VAGUE: phase descriptors without specification (e.g., "during the crisis", "after
        the disaster", "in the emergency"). Ask: "Which phase — acute emergency, early recovery,
        or chronic/ongoing?"
      - APPROPRIATE: named phase with sufficient specificity (e.g., "acute phase within 72 hours
        of flood onset", "recovery phase 3-6 months post-cyclone").

      **Standardisation rules:**
      - "poor countries" → "low- and middle-income countries (LMICs)"
      - "rich countries" → "high-income countries"
      - Vague regional terms (e.g., "Global South", "developing world") → resolve to named
        geographies, income classifications, or specific hazard contexts before assembling
    examples:
      clear:
        - statement: "Peri-urban informal settlements in coastal Mozambique, post-cyclone acute phase within 4 weeks of landfall, primary health care facilities with damaged infrastructure and no functional cold chain"
          rationale: geographic setting (coastal Mozambique), urban/rural (peri-urban), socioeconomic context (informal settlements), health system capacity (primary care, damaged, no cold chain), temporal context (post-cyclone acute, within 4 weeks) all specified
        - statement: "Rural displacement camps in Bangladesh following riverine flooding"
          rationale: country-level geography (Bangladesh) plus hazard (riverine flooding) and setting type (rural displacement camps) is sufficiently specific for retrieval; district-level detail is not required.
      needs_refinement:
        - statement: "Sub-Saharan Africa"
          issue: TOO BROAD — continent-level sub-region with no hazard, income, or country anchor. Encompasses dozens of countries with distinct health systems, climate hazards, and evidence bases.
          example_question: "Are you focusing on a specific country or sub-region? (e.g., Sahel region, Horn of Africa, southern Africa) Or is the broader sub-Saharan scope intentional for this question?"
        - statement: "A village in Cox's Bazar"
          issue:
            TOO SPECIFIC — single locality with no broader anchor. Available evidence
            is indexed at camp, district, or country level, not individual village.
          example_question: "Should the scope be broadened to Cox's Bazar district or the Rohingya refugee camp setting more broadly, to ensure sufficient evidence is available?"
      partial:
        - statement: "Flood-affected districts in Bangladesh considering vaccine delivery through primary care facilities"
          has: geographic setting (Bangladesh, flood-affected districts)
          missing:
            urban/rural absent — intervention delivery in Bangladesh differs
            significantly between haor wetland areas, coastal char lands, and
            peri-urban settlements; health system level absent and relevant because vaccine delivery depends on platform capacity
          example_question: "Are these rural, peri-urban, or coastal communities? What delivery platform is relevant — community outreach, primary care clinics, or upazila health complexes?"
      vague_ambiguous:
        - statement: "Field settings in the Global South"
          issue:
            '"Field settings" could mean community outreach, primary care clinic,
            or humanitarian field hospital — meaningfully different for intervention
            feasibility. "Global South" is too heterogeneous for coherent synthesis.'
          example_question: "Which setting level? (e.g., community health worker-based, primary care clinic, humanitarian field hospital) Which region or country specifically?"
  - id: population
    name: Population
    description:
      The group of individuals or entities whose health outcomes are the
      focus of the question, defined by demographic characteristics,
      vulnerability, exposure, and inclusion criteria that shape evidence
      applicability.
    depends_on:
      - condition
      - context
    specifications: |
      **Task:** Extract and assemble the population specification from the user's input.

      **Elements to silently extract, if present:**
      - Population scope: name specific group or statement that the question applies to all populations
      - Age: range, category, or life stage (e.g., children under 5, older adults, working-age adults, pregnant women)
      - Sex/gender (e.g., women of reproductive age, all  adults, males over 60)
      - Ethnicity/race
      - Subgroup characteristics: roles, affiliations, socioeconomic markers, reproductive status, occupational categories, insurance status.

      **When to ask (governs questions only, not extraction):**
      - Population scope: ask if absent, or if stated as "all populations" when the topic is clearly specific to a subgroup (e.g., outdoor workers, pregnant women, refugees).
      - Age: ask if absent AND the topic is inherently age-specific (e.g., paediatric malnutrition, geriatric heat stress, adolescent mental health, neonatal mortality). Ask if present but vague (see specificity thresholds).
      - Ethnicity/race: ask if absent AND the topic concerns differential burden or outcomes across population groups (e.g., Indigenous communities, ethnic minorities, racialised groups, caste-based disparities).

      **Never ask about:** sex/gender, subgroup characteristics.
      If absent, omit silently. If present, extract silently.

      **Specificity thresholds (ask when present but at wrong level):**

      Population scope:
      - TOO BROAD: "all populations" or equivalent with no qualifier when the topic is clearly
        specific to a subgroup. Ask: "Is this question intended for all populations, or is it
        limited to a specific group?"
      - APPROPRIATE: named specific group, or explicit confirmation of unrestricted scope.

      Age:
      - TOO BROAD: terms spanning multiple distinct age groups without a range (e.g., "adults",
        "young people", "children"). Ask: "Which age group specifically? (e.g., children 2-12
        years, adolescents 10-19 years, working-age adults 18-65 years)"
      - APPROPRIATE: defined range, recognised life stage, or standardised category (e.g., children 2-12 years, working-age adults 18-65 years, "all adults").
      - TOO SPECIFIC: narrow range unlikely to match available evidence (e.g., "35-37 year olds").
        Ask: "Should the age range be broadened to [proposed category] to ensure sufficient
        evidence is available?"

      **Age standardization:**
      - "kids" → "children (2-12 years)"
      - "elderly" → "older adults (65+ years)"
      - Vague or non-standard ranges → prepend "approximately"
    examples:
      clear:
        - statement: "Male smallholder farmers aged 18-60 years in drought-affected semi-arid households in Kenya"
          rationale: population scope (smallholder farmers), age (18-60 years), sex/gender (male), subgroup (drought-affected households) all specified.
        - statement: "Older adults aged 65 years and above with pre-existing cardiovascular or respiratory conditions living alone in urban informal settlements"
          rationale: population scope (older adults living alone), age (65+ years), subgroup(pre-existing conditions, urban informal settlements) all specified.
      vague_ambiguous:
        - statement: "Local populations in climate hotspots"
          issue: '"Local populations" gives no demographic anchor; "climate hotspots" gives no population specificity. Could mean all residents, specific occupational groups, or climate-exposed subgroups. Cannot determine without asking.'
          example_question: "Which population group are you focusing on? (e.g., all residents,outdoor workers, subsistence farmers, fishing communities)"
      partial:
        - statement: '"Indigenous communities" — query concerns drought-related malnutrition'
          has: population scope (Indigenous communities), ethnicity/race (Indigenous)
          missing: age — malnutrition in drought contexts is age-specific (acute wasting in under-5s, micronutrient deficiency in pregnant women, wasting in older adults)
          example_question: "Which age group is this question focused on? (e.g., children under 5, pregnant and lactating women, older adults, all ages)"
        - statement: '"Displaced families" — query concerns post-flood diarrhoeal disease'
          has: population scope (displaced families)
          missing:
            age — diarrhoeal mortality risk in post-flood settings is sharply
            age-specific; under-5 children face the highest burden
          example_question: "Which age group is this question focused on? (e.g., children under 5, all ages, adults only)"
      needs_refinement:
        - statement: "Adults in cyclone-affected coastal communities"
          issue:
            '"Adults" spans working-age and older adults — distinct vulnerability
            profiles and evidence bases'
          example_question: "Which age group specifically? (e.g., working-age adults 18-65 years, older adults 65+ years, or all adults 18+ years)"
        - statement: "Rohingya women aged 22-28 in Cox's Bazar"
          issue:
            Age range too narrow — unlikely to match available evidence, which
            typically reports on reproductive-age women as a whole.
          example_question:
            "Should the age range be broadened to reproductive-age women
            (15-49 years) to ensure sufficient evidence is available?"