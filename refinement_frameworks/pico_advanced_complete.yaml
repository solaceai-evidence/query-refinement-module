pico_advanced:
  - user_context:
      user_type: "Systematic reviewer"
      context: "Protocol development for systematic review or meta-analysis. Researcher is formulating a research question for a comprehensive evidence synthesis, requiring precise PICO/SPIDER/ECLIPSE framework specification for protocol registration and publication-quality review."
      tone: "professional" # (educational, professional, pragmatic)
      complexity: "expert" # (novice, intermediate, advanced, expert)
      examples_from: "public health"
      constraints:
        - "Timeline: 12-24+ months for completion including screening, extraction, analysis"
        - "Resources: Database access (PubMed, Embase, CINAHL, etc.), protocol registration (PROSPERO), institutional support"
        - "Skills: Advanced search strategies, risk of bias assessment, meta-analysis methods, GRADE framework"
        - "Standards: PRISMA reporting, Cochrane methodology, protocol peer review requirements"
      pitfalls:
        - "Question too broad resulting in unmanageable screening burden (>10,000 records)"
        - "Overly narrow eligibility criteria yielding insufficient studies for synthesis"
        - "Poorly defined outcomes leading to heterogeneous measurement approaches"
        - "Inadequate specification of comparison groups or control conditions"
        - "Not pre-specifying subgroup analyses or sensitivity analyses"
        - "Conflating different review types (scoping vs. systematic vs. rapid)"
  - id: population
    name: Population
    description: Statistical characteristics of a group of people, including age range, gender, race/ethnicity, and geographic location that form the foundation for all other PICO dimensions
    evaluator: |
      ### Task
      Evaluate if these demographic elements are specified when relevant:
      - Age (range, category, life stage such as pediatric, postmenopausal, etc.)
      - Sex/gender  (male, female, non-binary, specific identities, all-inclusive)
      - Ethnicity/race (specific groups, diverse populations, all-inclusive)
      - Setting (urban, rural, clinical, community, school-based, geographic location)

      MINIMUM REQUIREMENT: At least one demographic MAY be specified. Zero is acceptable.

      IF no demographics specified:
      Ask: "You are including all ages, genders, ethnicities, and settings. Confirm this is intended or specify target population."

      CONTEXT-BASED VALIDATION:
      - Universal interventions (e.g., kidney disease treatment) → accept general population
      - Geography/culture-dependent interventions (e.g., dietary factors) → require setting specification
      - Age-dependent conditions (e.g., OCD diagnosis/treatment) → require age specification

      ANTI-OVER-REFINEMENT RULES:
      - DO NOT request ethnicity/gender/subpopulation narrowing UNLESS query explicitly addresses health disparities or population-specific outcomes
      - ACCEPT general terms ("young adults", "urban communities") without pushing for specificity

      AGE STANDARDIZATION:
      Standard categories: Neonates (0-28d), Infants (0-2y), Children (2-12y), Adolescents (13-17y), Adults (18-64y), Young adults (18-39y), Middle-aged (40-64y), Older adults (65+y)

      Apply these rules:
      1. If user range deviates ±5y from standard boundary → prepend "approximately" (e.g., "4-10y" → "approximately 4-10 years")
      2. If matches standard exactly → use "category (range)" (e.g., "kids" → "children (2-12 years)")
      3. If overly broad AND age-critical → request clarification (e.g., "growth hormone in adults" → ask young vs older)
      4. If overly broad AND age-NOT-critical → accept (e.g., "adults with diabetes" → accept "adults (18-64y)")
    response_strategy: |
      1. Evaluate demographic presence: parse user input for age, gender, ethnicity, setting, location
      2. Apply context-based validation first (determines necessity)
      3. If gaps exist AND required: emit conversational prompt
      4. If gaps exist AND optional: silently accept with standardized elements (where applicable)
    examples:
      clear:
        - statement: Efficacy of metformin in adults aged 40-65 with type 2 diabetes
          rationale: Age (40-65) specified, with all-inclusive gender (adults) and ethnicity and setting
        - statement: Postmenopausal women under 65 in urban clinical settings
          rationale: clearly described age (postmenopausal under 65), gender (women), setting (urban clinical)
        - statement: Black males aged 18-45 with hypertension in community health centers
          rationale: clearly defined age (18-45), gender (males), ethnicity (Black), setting (community health centers)
      needs_refinement:
        - statement: The effect of exercise on depression
          issue: Zero demographics specified; too broad
          missing: Age, gender at minimum
          example_question: "You are including all ages, genders, ethnicities, and settings. Is that correct or do you want to limit to you have any specific age range, sex/gender, setting, and/or ethnicity/race?"
      partial:
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women) and minimum age (40)
          missing: ethnicity (if CVD disparities relevant),setting (geographic/clinical context)
          example_question: Is there an upper age limit? Are you focusing on specific ethnic groups given CVD disparities?
      vague_ambiguous:
        - statement: Treatment outcomes in minority populations aged 65 and older in tertiary care hospitals
          issue: "'Minority populations' is vague and could mean multiple groups"
          missing: precise ethnicity/race or setting; maybe gender as well
          example_question: "Which specific population groups are you focusing on? (e.g., Hispanic/Latino, African American, Asian, Native American). Do you have any specifications regarding gender or geographic location?"
        - statement: Middle-aged adults in diverse communities
          issue: ambiguous setting and ethnicity/race
          example_question: "Specify what dimensions of diversity matter (ethnic, socioeconomic, geographic)?"
        - statement: Study in representative population sample
          issue: "'Representative' is context-dependent - representative of what population?"
          example_question: What population should this sample represent? Please specify demographic characteristics that define representativeness, including age, sex/gender, ethnicity/race, and setting.
  - id: intervention_specification
    name: Intervention Specification
    description:
      Specifies the treatment, procedure, behavioral protocol, or diagnostic test being studied,
      including intervention type, specific agent/method, dosing, duration, delivery method, and route.
      Details sufficient for study replication and outcome interpretation.
    depends_on:
      - population
      - clinical_condition
    evaluator: |
      ### TASK
      Evaluate if intervention specification is sufficiently detailed for study replication.

      ### CRITICAL REQUIREMENTS
      Intervention type AND specific agent/method MUST be specified. If either is absent, reject and prompt.

      ### ELEMENT REQUIREMENTS

      #### Intervention Type - CRITICAL
      Must specify category: Pharmacological, Procedural, Behavioral, or Diagnostic. Reject if absent.

      #### Specific Agent/Method - CRITICAL
      Must name specific drug/procedure/protocol/test. Generic or brand name, defined technique, or protocol required. Vague specifications (e.g., "statin therapy" without agent name) require clarification.

      #### Dosing/Intensity - CONDITIONAL
      Required if intervention is dose-dependent. Include dose amount, units, frequency, and timing. Optional for non-dose-dependent interventions (behavioral, diagnostic, or single-administration procedures).

      #### Duration - CONDITIONAL
      Required if duration materially affects outcome (most pharmacological and behavioral interventions). Optional if intervention is single-administration or duration clinically irrelevant.

      #### Delivery Method - CONDITIONAL
      Required if delivery affects outcomes (route, setting, or provider type clinically meaningful). Include route (oral, IV, subcutaneous), setting (inpatient, outpatient, home), and provider type if clinically relevant.

      #### Adjunct Treatments - OPTIONAL
      Accept if absent. Include if concurrent therapies, background medications, or supportive care protocols specified.
    response_strategy: |
      1. Parse input for intervention type (pharmacological/procedural/behavioral/diagnostic)
      2. If absent → REJECT + PROMPT for intervention type
      3. Parse input for specific agent/method
      4. If absent or vague → REJECT + PROMPT for agent/method specification
      5. Determine dosing requirement (dose-dependent interventions) → if required AND absent → PROMPT
      6. Determine duration requirement (outcome timeline dependent) → if required AND absent → PROMPT
      7. Assess delivery method clarity (clinical relevance dependent) → if relevant AND absent → PROMPT
      8. If all critical and required conditional elements present and specific → ACCEPT
    examples:
      clear:
        - statement: Metformin vs placebo in newly diagnosed Type 2 diabetes over 6 months.
          rationale: Inferred intervention type (Pharmacological), Drug (metformin), duration (6 months), and comparison (placebo) well specified.
        - statement: Laparoscopic Roux-en-Y gastric bypass compared to other techniques
          rationale: Specific intervention type (surgical technique, inferred) and method (laparoscopic Roux-en-Y)
        - statement: Cognitive Behavioral Therapy delivered by licensed clinical psychologists
          rationale: Inferred intervention type (nonpharmacological), method (CBT), provider (licensed psychologists)
        - statement: Atorvastatin treatment for hyperlipidemia
          has: Inferred intervention type (Pharmacological), Drug name (atorvastatin), indication (hyperlipidemia)
      partial:
        - statement: Exercise intervention for weight loss
          has: intervention type (exercise)
          missing: exercise modality, intensity level, frequency, session duration unspecified
          example_question:
            What type of exercise? (aerobic, resistance, both) What intensity,
            frequency, and exercise modality?
        - statement: Effects of medication on blood pressure
          has: intervention type (Pharmacological)
          missing: Drug name (optional dose, frequency, duration, route)
          example_question:
            Which medication are you studying? Please specify the drug
            name, dose, frequency, and treatment duration if applicable.
      vague_ambiguous:
        - statement: Intensive glycemic control in diabetes
          issue: " Intervention type is clear (glycemic control); 'Intensive' is subjective - it could be specified as a regimen or target"
          missing: Specific regimen or glycemic targets
          example_question: "Are you interested in a specific intervention and regimen or a target that defines 'intensive control'?"
  - id: comparison_group
    name: Comparison/Control Group
    description: "Specifies what the intervention is compared against: placebo, standard care, alternative treatment, or no treatment. Critical for establishing causality and determining intervention efficacy or effectiveness."
    depends_on:
      - intervention_specification
    evaluator: |
      ### TASK
      Evaluate if an appropriate comparison/control group is specified that enables causality assessment. Comparator must be suitable for the research question and as well-defined as the intervention.

      ### CRITICAL REQUIREMENT
      At least ONE comparator MUST be specified. If absent, reject and prompt.

      ### COMPARATOR TYPES

      - Placebo Control: Inert substance or sham procedure. Examples: inactive pill, sham surgery, mock device.

      - Standard Care/Treatment: Current guideline-recommended or usual care. Examples: evidence-based protocol, standard-of-care treatment.

      - Alternative Active Treatment: Different agent, dose, or intervention. Examples: different drug, lower dose, alternative technique.

      - No Treatment: Watchful waiting, natural history, untreated control. Examples: observation only, deferred treatment, dose comparison.

      ### APPROPRIATENESS VALIDATION
      Research question type determines acceptable comparators:

      - Efficacy (intervention vs. nothing) → Acceptable: Placebo, no treatment. Unacceptable: Standard care (if standard exists).

      - Effectiveness (intervention vs. current practice) → Acceptable: Standard care, usual care. Unacceptable: Placebo (if standard exists).

      - Superiority (intervention A vs. B) → Acceptable: Alternative active treatment, standard care. Unacceptable: Placebo (unless ethically justified).

      - Non-inferiority (intervention A ≥ B) → Acceptable: Standard care, active comparator. Unacceptable: Placebo.

      Reject if comparator is unethical, inappropriate to research question, or unjustifiable when effective treatment exists.

      ### SPECIFICITY & DETAIL VALIDATION
      Comparator detail must match intervention detail level.

      Example 1: Intervention "atorvastatin 40 mg daily" → Accept: "placebo matching atorvastatin formulation" OR "rosuvastatin 20 mg daily". Reject: "placebo" (insufficient detail).

      Example 2: Intervention "cognitive behavioral therapy, 12 weekly sessions" → Accept: "standard therapy, 12 sessions" OR "no treatment". Reject: "alternative treatment" (requires specificity).

      ### ETHICAL VALIDATION FOR NO-TREATMENT CONTROLS

      No-treatment controls require ethical justification IF effective treatment exists:

      Accept if: condition is self-limiting OR no proven effective treatment exists.

      Require justification if: established effective treatment exists and withholding causes harm.

      Flag if: vulnerable populations (children, severe illness) with no-treatment control without strong justification.
    examples:
      clear:
        - statement: Metformin vs placebo in prediabetic adults
          rationale: Clear active intervention (metformin) vs inert control (placebo)
        - statement:
            New anticoagulant compared to warfarin (standard care) in atrial
            fibrillation
          rationale: Novel treatment (New anticoagulant) vs established standard of care (warfarin)
        - statement:
            High-intensity statins vs moderate-intensity statins in secondary
            prevention
          rationale: clear comparator (High-intensity statins vs moderate-intensity statins)
      needs_refinement:
        - statement: Effects of new drug on blood pressure
          issue: No comparison group mentioned
          missing: Comparator specification
          example_question:
            What will you compare the new drug against? (e.g., any other treatmentplacebo,
            current standard treatment, another active drug)
        - statement: Study of surgical intervention
          issue: No comparison - surgery vs what?
          missing: Control/comparison group
          example_question:
            What is the comparison? (e.g., surgery vs medical management,
            surgery vs observation, one surgical technique vs another)
      vague_ambiguous:
        - statement: ACE inhibitors versus control in hypertension
          issue: "'Control' could mean placebo, standard care, or no treatment"
          example_question:
            What does 'control' mean in your study? (placebo, standard
            antihypertensive therapy, or no treatment)
        - statement: Intervention vs standard therapy
          issue: "'Standard therapy' varies by geography, guidelines, and time period"
          example_question:
            What specific treatment(s) constitute 'standard therapy' in
            your context? (e.g., specific drugs, specific guidelines)
  - id: primary_outcomes
    name: Primary Outcomes
    description: Specifies the main outcomes of interest including measurement
      methods, timepoints, and clinical significance thresholds.
    depends_on:
      - intervention_specification
      - population_clinical_profile
    
    evaluator: |
      ### TASK
      Evaluate if primary outcomes are sufficiently specified for measurement and interpretation.

      ### CRITICAL REQUIREMENTS
      At least ONE primary outcome MUST be specified. If absent, reject and prompt.

      ### OUTCOME SPECIFICITY VALIDATION
      Outcomes must include:
      - Specific outcome measure (e.g., all-cause mortality, HbA1c levels, quality of life)
      - Measurement method/instrument (e.g., lab test, validated questionnaire)
      - Timepoint(s) for assessment (e.g., 6 months, 1 year post-intervention)
      - Clinical significance threshold (if applicable, e.g., HbA1c reduction ≥0.5%)

      Reject if outcomes are vague/general (e.g., "treatment effectiveness", "improved health") without specifics.

      ### CLARIFYING QUESTIONS
      If any elements are missing or vague, prompt with targeted questions to elicit necessary details.
    examples:
      clear:
        - statement: Effect of intervention on all-cause mortality at 5 years
          rationale: Specific outcome (all-cause mortality), clear timepoint (5 years)
        - statement:
            Change in HbA1c from baseline to 6 months, with target reduction
            ≥0.5%
          rationale:
            Specific biomarker (HbA1c), timeframe (baseline to 6 months), clinical
            significance threshold (≥0.5%)
        - statement: Quality of life measured by SF-36 at 3, 6, and 12 months post-intervention
          rationale:
            Specific validated instrument (SF-36), multiple timepoints (3, 6,
            12 months)
      needs_refinement:
        - statement: Study on treatment effectiveness
          issue: "'Effectiveness' not defined - needs specific measurable outcome"
          missing: Specific outcome measure, measurement method, timepoint
          example_question:
            How will you measure effectiveness? (e.g., specific clinical
            outcomes, biomarkers, patient-reported measures)
        - statement: Research on improving patient outcomes
          issue: "'Outcomes' is vague - could mean dozens of different measures"
          missing: Specific outcome(s), measurement tools, assessment timing
          example_question:
            What specific outcome(s) will you measure? When will they
            be assessed?
        - statement: Trial measuring quality of life improvement
          issue: QOL mentioned but no instrument specified
          missing: QOL instrument, measurement timepoints, MCID
          example_question:
            Which quality of life instrument will you use? (e.g., SF-36,
            EQ-5D, disease-specific) When will you assess it?
      partial:
        - statement: Effect on blood pressure reduction
          has: General outcome category (blood pressure)
          missing:
            Specific BP parameter (systolic, diastolic, mean arterial), target
            reduction,measurement protocol, timepoint
          example_question:
            Which BP parameter? (systolic, diastolic, or both) What measurement
            protocol? When will it be assessed?
        - statement: Change in depression scores using validated scales
          has: Outcome type (depression), mentions validation
          missing: Specific scale, timepoints, MCID
          example_question:
            Which depression scale? (PHQ-9, Beck Depression Inventory,
            HAM-D) At what timepoints? What change is clinically meaningful?
      vague_ambiguous:
        - statement: Study on long-term outcomes of surgery
          issue:
            "'Long-term' is relative (could be 1 year or 10 years), 'outcomes'
            unspecified"
          example_question:
            What is the follow-up duration? What specific outcomes will
            you measure? (e.g., survival, complications, functional status)
        - statement: Research on significant improvement in symptoms
          issue:
            "'Significant' (statistical vs clinical?) and 'symptoms' (which ones?)
            both vague"
          example_question:
            Which specific symptoms? How will you measure them? What defines
            a clinically meaningful improvement?
  - id: study_design_context
    name: Study Design & Methodological Context
    description:
      Clarifies the intended study design, setting, sample size considerations,
      and methodological approach. Helps determine feasibility and appropriate statistical
      methods.
    depends_on:
      - population
      - intervention_specification
      - comparison_group
      - primary_outcomes
    system_prompt:
      "You are a research advisor helping users refine their research topics
      by asking focused clarifying questions.


      Your Job:

      Users provide research interests (questions, statements, aims, or paragraphs).
      Clarify aspect: **{self.name}**, with definition: **{self.description}**.
      Focus ONLY on this aspect—ignore other research elements.


      How to Engage:

      1. **Acknowledge first**: Recognize what's already clear before requesting clarification.

      2. **One element at a time**: Address 1-2 unclear points per turn.

      3. **Mirror their language**: Use their terminology; avoid jargon unless it adds
      needed precision.

      4. **Give examples**: Offer 2-4 concrete, aspect-specific examples they can adapt.

      5. **Explain why**: Briefly note how this clarification strengthens their research
      input and improves their search.


      When to Stop:

      This aspect is sufficiently refined when the user's statement is specific, unambiguous,
      and actionable for evidence synthesis.


      Boundaries:

      - You clarify research descriptions, not search literature or write proposals.

      - Stay within your assigned refinement aspect.

      - Keep developing clarity, not fixing problems.


      Tone: Supportive and collaborative. Be efficient—don't over-explain.

      "
    evaluator: "### What you are evaluating:\nAssess whether the study\
      \ design and methodological context are sufficiently specified\n\n### Design Dimensions\n\
      \n1. Study Type\n  - RCT (parallel, crossover, cluster)\n  - Observational (cohort,\
      \ case-control)\n  - Systematic review/meta-analysis\n  - Pragmatic trial\n\n\
      2. Setting\n  - Healthcare setting type\n  - Geographic scope\n  - Single-center\
      \ vs multi-center\n\n3. Sample Size\n  - Target enrollment\n  - Sample size rationale\n\
      \  - Power considerations\n\n4. Duration\n  - Study timeline\n  - Recruitment\
      \ period\n  - Follow-up length\n\n5. Special Considerations\n  - Blinding/masking\n\
      \  - Randomization method\n  - Statistical approach\n  - Interim analyses\n"
    examples:
      clear:
        - statement:
            Multicenter RCT of drug A vs placebo in 500 patients with 12-month
            follow-up
          rationale:
            Study type (RCT), setting (multicenter), sample size (500), duration
            (12 months) all specified
        - statement:
            Double-blind placebo-controlled parallel-group trial across 20 US
            academic medical centers
          rationale:
            Design details (double-blind, placebo-controlled, parallel), setting
            (20 academic centers, US location)
      needs_refinement:
        - statement: Study comparing two treatments
          issue: Study design not specified
          missing: Study type, setting, duration
          example_question:
            What study design? (e.g., randomized controlled trial, observational
            cohort, systematic review)
      partial:
        - statement: RCT comparing interventions in hospital setting
          has: Study type (RCT), general setting (hospital)
          missing: Sample size, duration, specific hospital type, blinding approach
          example_question:
            What is your target sample size? Study duration? Single-center
            or multi-center?
  - id: clinical_condition
    name: Health Condition and Clinical Context
    description: Specifies the primary health condition or disease, including disease stage, severity, and relevant comorbidities. Defines clinical eligibility criteria and baseline clinical characteristics of the target population.
    depends_on:
      - population
    evaluator: |
      ### Task
      Evaluate if health condition specification enables accurate patient identification, appropriate treatment selection, and valid outcome interpretation.

      **CRITICAL REQUIREMENT**:
      Primary condition/diagnosis MUST be specified. If absent, reject and prompt.

      ### CONDITION SPECIFICITY VALIDATION
      Condition is acceptable if:
      - Clinically unambiguous (single primary treatment pathway) OR Specific enough to avoid disambiguation (e.g., "Type 2 diabetes" acceptable; "diabetes" requires type specification if ambiguous)
      Reject only if multiple treatment pathways exist requiring clarification.

      ### CONDITIONAL ELEMENTS
      - Disease Stage - Required IF clinically meaningful for prognosis or treatment selection (e.g., cancer staging, CKD stages, heart failure classification). Optional otherwise.

      - Severity - Required IF severity materially affects treatment choice (e.g., depression mild/moderate/severe, asthma control levels). Optional for conditions where severity is not treatment-determining.

      - Comorbidities - Include ONLY if comorbidity satisfies at least 1 criterion:
        - Affects treatment feasibility (contraindication, drug interaction, organ function)
        - Affects outcome interpretation (confounding variable)
        - Explicitly defines inclusion/exclusion criteria
        - Modifies disease prognosis in this specific context
      Reject comorbidities with no link to primary condition or intervention (e.g., cancer + hypertension without specified interaction).

      - Treatment History & Diagnostic Criteria - Optional enhancements; accept if absent.
         - Is prior treatment status mentioned? (e.g., treatment-naive, refractory, maintenance therapy)
         - Are diagnostic criteria specified? (e.g., ICD codes, clinical guidelines, biomarker thresholds)
    response_strategy: |
      1. Parse input for named condition
      2. If absent → REJECT + PROMPT for condition
      3. If present, assess specificity → if ambiguous → PROMPT for disambiguation
      4. Determine stage/severity relevance via clinical context → if relevant AND absent → PROMPT
      5. Validate comorbidities for clinical rationale → if stated without rationale → PROMPT
      6. If all required elements present and valid → ACCEPT
    examples:
      clear:
        - statement: "Efficacy of SGLT2 inhibitors in Type 2 diabetes patients"
          rationale: primary condition (Type 2 diabetes) specified unambiguously
        - statement: "Management of acute severe asthma exacerbations requiring emergency department care."
          rationale: All critical elements present and appropiately specified. Primary condition (asthma), disease stage (acute exacerbations), severity level (severe), diagnostic criteria  and setting/context implicit (requires emergency department level of care)
        - statement: "Effects of statins in patients with moderate hyperlipidemia."
          rationale: primary condition (hyperlipidemia), severity level (moderate)
      needs_refinement:
        - statement: Outcomes of cancer treatment
          issue: Unspecified primary condition type/site
          missing: Specific cancer type (e.g., breast, lung, colorectal) and disease stage (I-IV)
          example_question: "What specific type of cancer (e.g., breast, lung, colorectal) and disease stage (I-IV) are you focusing on?"
      partial:
        - statement: Study in high-risk cardiovascular patients
          has: primary condition (cardiovascular disease)
          missing: "'High-risk' is subjective - needs risk score, comorbidities, or other specific criteria"
          example_question: "What defines 'high-risk'? (e.g., Framingham score, specific risk factors, prior events, comorbidities)"
        - statement: Outcomes in hypertensive patients with diabetes
          has: primary condition (hypertension), comorbidity (diabetes)
          missing: "Blood pressure range and Hypertension severity not specified, Diabetes type not specified"
          example_question: "Specify hypertension severity (stage 1 or 2), Blood pressure range (e.g., 140-159/90-99 mmHg), and diabetes type (Type 1 or Type 2) to clarify treatment approach"
      vague_ambiguous:
        - statement: Treatment in patients with refractory disease
          issue: "'refractory disease' to what?"
          missing: primary condition vague/unspecified
          example_question: "Which conditions/diseases are you looking at? Is it pertinent to also include what treatments the disease is refractory to?"
        - statement: treatment for diabetic patients
          issue: ambiguous diabetes type (Type 1 vs Type 2 vs gestational)
          example_question: "What type of diabetes? (Type 1, Type 2, gestational)"
        - statement: intervention in patients with heart problems
          issue: "‘Heart problems’ is vague - could mean coronary artery disease, heart failure, arrhythmias, etc."
          example_question: "What specific heart condition are you referring to? (e.g., coronary artery disease, heart failure, arrhythmias) And are you interested in a specific level of severity or stage?"
