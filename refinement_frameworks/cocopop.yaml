cocopop_v1:
  - user_context:
      user_type: "policy maker, humanitarian practitioner, health professional, or researcher working on climate-health emergencies"
      context: "Real-time evidence synthesis for climate-change health emergencies.
        User is formulating a decision-relevant question to support policy,
        humanitarian, or health-system responses in urgent, context-specific
        settings. The question must support rigorous retrieval and transparent
        synthesis across scientific literature, humanitarian reports, policy
        guidelines, impact assessments, and local case studies."
      tone: "pragmatic"
      complexity: "advanced"
      examples_from: "climate-health policy and humanitarian response"
  - id: condition
    name: Condition
    description: The health condition, disease, symptom, problem, or social issue
      under study, including its case definition, diagnostic criteria, and
      climate-health linkage.
    specifications: |
      **Task:** Extract and assemble the condition specification from the user's input.

      **Extract only what the user explicitly states or names:**
      - The named health condition, disease, symptom, problem, or social issue
      - Case definition or diagnostic criteria (e.g., WHO case definition, ICD-11 code, clinical threshold)
      - Climate-health linkage: the climate-sensitive hazard or environmental stressor that drives, exacerbates, or contextualizes this condition (e.g., flood-associated, heat-exacerbated, drought-driven)
      - Temporal qualifier when the condition is phase-specific (e.g., acute phase, post-exposure, seasonal peak)

      **Required:**
      - At least one named condition with sufficient specificity to anchor evidence retrieval
      - Climate-health linkage: probe for this if absent

      **Required if applicable:**
      - Case definition or diagnostic threshold: required when the condition encompasses multiple severity levels or when diagnostic criteria determine eligibility
      - Temporal qualifier: required when the phase of illness affects intervention applicability or outcome measurement
      - Symptom cluster: required when the condition is defined by symptoms rather than a named disease entity
      - Causal pathway: required when the question concerns prevention or when the condition is defined by its cause (e.g., smoke-inhalation-related respiratory illness)

      **Specificity thresholds:**
      - INSUFFICIENT: condition names that encompass multiple distinct disease entities with different case definitions, interventions, or evidence bases (e.g., "malnutrition", "waterborne disease", "climate-related illness")
      - SUFFICIENT: a named condition with a recognized case definition or diagnostic reference point (e.g., "acute watery diarrhoea using WHO case definition", "heat stroke defined as core temperature ≥40°C or altered consciousness")
      - OVER-SPECIFIED: a level of specificity that would exclude all or nearly all available evidence; flag and propose broadening
    examples:
      clear:
        - statement: Acute watery diarrhoea in children under 5 years following riverine
            flooding in a displacement camp
          rationale: Named condition (acute watery diarrhoea), climate linkage (riverine
            flooding), and setting (displacement camp) all specified.
        - statement: Heat stroke and severe heat exhaustion (core temperature ≥40°C or
            altered consciousness) in outdoor agricultural workers during an
            extreme heat event in South Asia
          rationale: Named condition with severity threshold (heat stroke, ≥40°C or
            altered consciousness), climate linkage (extreme heat event), and
            population and occupational context (outdoor agricultural workers,
            South Asia) all explicit.
      needs_refinement:
        - statement: Malnutrition
          issue: Encompasses acute wasting, stunting, and micronutrient deficiency — each
            with distinct case definitions, thresholds, and interventions;
            climate linkage absent.
          missing: Specific form (e.g., acute wasting, stunting, micronutrient
            deficiency), diagnostic threshold or case definition, and
            climate-health driver (e.g., drought-driven food insecurity).
          example_question: "Are you focusing on acute wasting, stunting, or a specific
            micronutrient deficiency? What diagnostic threshold or case
            definition applies? Is this condition driven by a climate-related
            stressor such as drought or crop failure?"
      partial:
        - statement: Mental health impacts of displacement
          has: Condition domain (mental health), context (displacement).
          missing: Specific disorder (e.g., PTSD, major depression, acute stress
            reaction) or confirmation of all domain, climate-driver of displacement.
          example_question: "Are you focusing on all mental health disorders. If not, which mental health condition are you focusing on — PTSD,
            depression, anxiety, or acute stress reactions? What diagnostic
            criteria apply? Is displacement climate-driven (e.g., flood,
            drought, sea-level rise) or conflict-related?"
      vague_ambiguous:
        - statement: Health problems in affected communities
          issue: Neither the condition nor the hazard is defined; provides no diagnostic
            reference point for evidence retrieval.
          missing: Named condition or disease, specific hazard or stressor, and case
            definition or measurement approach.
          example_question: "Which health condition are you focusing on? Which climate or
            environmental hazard has affected these communities? How is the
            condition defined or diagnosed in this setting?"
  - id: context
    name: Context
    description: The geographic, environmental, and implementation setting in which
      the condition occurs and in which any response or intervention would be
      applied.
    strictness: PERMISSIVE
    depends_on:
      - condition
    specifications: |
      **Task:** Evaluate and assemble the context specification.

      **Elements to track:**
      - Geographic setting: country, region, or sub-national area (e.g., Sahel, Pacific Island states, peri-urban Bangladesh)
      - Urban/rural/peri-urban classification
      - Income or resource setting: World Bank income group (low, lower-middle, upper-middle, high) or explicit resource-availability descriptor (e.g., resource-limited, humanitarian field setting)
      - Health system level and capacity: community health worker-based, primary care, district hospital, tertiary referral, fragile or disrupted system
      - Socioeconomic and political context: conflict-affected, fragile state, post-disaster, displacement camp, food-insecure region
      - Environmental or climate setting: drought-prone, flood-prone, high-altitude, coastal, heat-stressed urban environment
      - Temporal context: acute emergency phase, recovery phase, chronic/ongoing, seasonal window (e.g., monsoon season, lean season)

      **Required:**
      - At least one contextual dimension that anchors where the condition occurs or where evidence must be applicable.

      **Required if applicable:**
      - Health system capacity: required when intervention feasibility depends on available infrastructure or personnel
      - Temporal context: required when the phase of the emergency determines eligible evidence or intervention type
      - Urban/rural classification: required when setting-dependent variation in condition burden, care-seeking, or intervention delivery is plausible

      **Standardization rules:**
      - "poor countries" → "low- and middle-income countries (LMICs)"
      - "rich countries" → "high-income countries"
      - Vague regional terms (e.g., "Global South", "developing world") → resolve to named geographies, income classifications, or specific hazard contexts
    examples:
      clear:
        - statement: Peri-urban informal settlements in coastal Mozambique following
            Cyclone Idai, with damaged primary care infrastructure and limited
            referral capacity
          rationale: Geography (coastal Mozambique), setting (peri-urban informal), hazard
            (cyclone), health system capacity (damaged primary care, limited
            referral), and temporal phase (post-event) all specified.
        - statement: Rural displacement camps in northeastern Ethiopia during a multi-year
            drought, staffed by community health workers without diagnostic
            laboratory capacity
          rationale: Country (Ethiopia), sub-region (northeastern), setting (rural
            displacement camp), hazard (prolonged drought), temporal phase
            (chronic/ongoing), and health system constraint (no laboratory
            capacity) all explicit.
      needs_refinement:
        - statement: Communities affected by climate change
          issue: No geographic anchor, hazard, setting, or health system context; provides
            no usable basis for evidence retrieval or applicability assessment.
          missing: Geographic region or country, specific climate hazard or stressor,
            health system level or capacity.
          example_question: "Which country or region are you focusing on? Which climate
            hazard is affecting this community? (e.g., flooding, drought,
            extreme heat, cyclone) Is the focus on a community, primary care, or
            hospital setting?"
      partial:
        - statement: Flood-affected districts in South Asia
          has: Hazard (flood), broad region (South Asia).
          missing: Country, urban/rural classification, health system level.
          example_question: "Which country in South Asia? (e.g., Bangladesh, India,
            Pakistan, Nepal) Are communities urban, peri-urban, or rural? What
            health system level is relevant — community health workers, primary
            care clinics, or district hospitals?"
        - statement: During a drought emergency in Africa
          has: Hazard (drought), temporal phase (acute/emergency), broad region (Africa).
          missing: Sub-region or country, setting type, health system capacity.
          example_question: "Which country or sub-region of Africa? Is the setting a
            displacement camp, rural community, or health facility? What health
            system capacity is assumed? (e.g., functional primary care,
            humanitarian field teams)"
      vague_ambiguous:
        - statement: Low-resource settings during a crisis
          issue: "'Low-resource' and 'crisis' are both underdefined — this spans primary
            care in LMICs to humanitarian field hospitals, and any type of
            emergency from conflict to disease outbreak to climate disaster."
          missing: Geographic region, specific hazard or crisis type, health system level
            and capacity.
          example_question: "Where specifically? (e.g., rural Sahel, peri-urban South
            Asia, Pacific Island state) What kind of crisis? (e.g., flood
            response, drought, disease outbreak following a cyclone)"
        - statement: Vulnerable communities in the Global South
          issue: "'Global South' is too heterogeneous for coherent synthesis; 'vulnerable'
            is undefined."
          missing: Country or sub-region, type of vulnerability (climate exposure, food
            insecurity, lack of health access), specific hazard or stressor.
          example_question: "Which country or region? What makes these communities
            vulnerable in your context — climate exposure, food insecurity, or
            limited healthcare access? What specific hazard are they facing?"
  - id: population
    name: Population
    description: The group of individuals or entities whose health outcomes are the
      focus of the question, defined by demographic characteristics,
      vulnerability, exposure, and inclusion criteria that shape evidence
      applicability.
    depends_on:
      - condition
      - context
    specifications: |
      **Task:** Extract and assemble a population specification from the user's input.

      **Extract only what the user explicitly states or names:**
      - Population scope (specific group or "all populations")
      - Age (range, category, or life stage)
      - Sex/gender
      - Ethnicity/race
      - Subgroup characteristics: roles, affiliations, socioeconomic markers, reproductive status, occupational categories, insurance status

      **Assembly rules:**
      1. Population scope: always include.
      2. Age: include if stated, or if the topic is inherently age-specific (e.g., paediatric, geriatric).
      3. Sex/gender: include only if explicitly stated.
      4. Ethnicity/race: include only if explicitly stated or the topic concerns health disparities.
      5. All other elements: include only if explicitly stated.

      **Age standardization:**
      - "kids" → "children (2–12 years)"
      - "elderly" → "older adults (65+ years)"
      - Vague or non-standard ranges → prepend "approximately"
      **Task:** Evaluate and assemble the population specification.

      **Elements to track:**
      - Age range, category, or life stage
      - Sex/gender
      - Ethnicity or race (when health disparities are the focus or when explicitly stated)
      - Vulnerability or exposure characteristics relevant to the climate-health context (e.g., displaced persons, outdoor workers, pregnant women, children under 5)
      - Relevant subgroup characteristics: occupational roles (e.g., healthcare workers, agricultural workers), socioeconomic markers (e.g., food-insecure, uninsured), pregnancy or reproductive status, or affiliation (e.g., residents of informal settlements)

      **Required:**
      - Confirmation of whether the question applies to all populations or is limited to a specific group
      - Age specification when the health condition, intervention, or evidence base is age-dependent

      **Required if applicable:**
      - Sex/gender: required when condition burden, intervention response, or care-seeking behaviour differs by sex
      - Ethnicity/race: required when the question concerns health disparities or when stated by the user
      - Vulnerability or exposure characteristic: required when the climate-health pathway operates through a specific exposure group (e.g., heat illness in outdoor workers, flood-related diarrhoea in displaced children)

      **Age standardization:**
      - "kids" → "children (2–12 years)"
      - "elderly" → "older adults (65+ years)"
      - Non-standard range → prepend "approximately"
    examples:
      clear:
        - statement: Children under 5 years in flood-affected displacement camps in
            coastal Bangladesh
          rationale: Age (under 5), setting (displacement camps), climate-health exposure
            (flood-affected), and geography (coastal Bangladesh) all specified.
        - statement: Pregnant women in rural sub-Saharan Africa during drought-related
            food insecurity
          rationale: Sex and reproductive status (pregnant women), setting (rural
            sub-Saharan Africa), and climate-health exposure (drought-related
            food insecurity) all explicit.
        - statement: Outdoor agricultural workers aged 18–60 in South Asia during extreme
            heat events
          rationale: Age range (18–60), occupational exposure (outdoor agricultural
            workers), geography (South Asia), and climate hazard (extreme heat)
            all specified.
      needs_refinement:
        - statement: People affected by flooding
          issue: No demographic, vulnerability, or geographic specification; applies to an
            unbounded and heterogeneous group.
          missing: Age range or life stage, geographic anchor, vulnerability or exposure
            characteristic.
          example_question: "Which population are you focusing on? For example, are you
            interested in children under 5, pregnant women, older adults, or all
            age groups? Is there a specific geographic or vulnerability
            context?"
      partial:
        - statement: Women in disaster-affected areas
          has: Sex (women), setting type (disaster-affected).
          missing: Age specification, type of disaster or hazard, geographic anchor.
          example_question: "Which age group? Are you focusing on women of reproductive
            age, pregnant women, or all adult women? Which type of disaster and
            in which region?"
      vague_ambiguous:
        - statement: Vulnerable populations in affected communities
          issue: Both 'vulnerable' and 'affected' are undefined; provides no basis for
            inclusion criteria or evidence applicability assessment.
          missing: Named vulnerability characteristic (e.g., displaced, food-insecure,
            older adults), geographic or hazard context, age or sex
            specification.
          example_question: "Which specific population are you focusing on? (e.g.,
            displaced persons, food-insecure households, children under 5,
            outdoor workers) Which climate hazard has affected these communities
            and where?"
