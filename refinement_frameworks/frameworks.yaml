cocopop:
  - user_context:
      # Appears verbatim in the user profile prompt and signals the primary stakeholder groups the model should optimize for.
      user_type: "policy maker, humanitarian practitioner, health professional, or
        researcher working on climate-health emergencies"
      # Appears verbatim in the user profile prompt and frames the operational use case the question-refinement should support.
      context: "Real-time evidence synthesis for climate-change health emergencies.
        User is formulating a decision-relevant question to support policy,
        humanitarian, or health-system responses in urgent, context-specific
        settings. The question must support rigorous retrieval and transparent
        synthesis across scientific literature, humanitarian reports, policy
        guidelines, impact assessments, and local case studies."
      # Hard branch controlling interaction style. Pragmatic keeps the model focused on decision-usefulness, feasibility, and actionable framing.
      tone: "pragmatic" # (educational, professional, pragmatic)
      # Hard branch controlling technical depth. Advanced preserves methodological rigor without assuming specialist evidence-synthesis expertise in every user.
      complexity: "advanced" # (novice, intermediate, advanced, expert)
      # If present, activates the instruction "Draw all examples from [Domain]".
      examples_from: "climate-health policy and humanitarian response"
      constraints:
        # "Feasibility: steer the user toward a question that can be answered with a
        # rapid review or living review approach rather than a full systematic
        # review or meta-analysis given the urgency of the context"
        - "During refinement, steer the user toward a question that supports a
          concrete policy, humanitarian, clinical, preparedness, or recovery
          decision rather than an abstract academic framing"
        # "Climate-health linkage: ensure the question explicitly connects the health issue to a climate-sensitive hazard, environmental stressor, or climate-related system impact to ensure relevance for climate-health emergencies"
        - "During refinement, ask for a clear climate-health linkage when the
          query does not yet connect the health issue to a climate-sensitive
          hazard, environmental stressor, or climate-related system impact"
        # "Mixed-evidence readiness: guide the user to a question that can be answered with a mixed-evidence synthesis approach that integrates scientific literature, policy documents, humanitarian reports, and local case studies to support urgent decision-making in complex, rapidly evolving contexts"
        - "During refinement, prefer formulations that can guide retrieval
          across scientific studies, humanitarian reports, policy documents,
          guidelines, and local case studies rather than biomedical literature
          alone"
        - "During refinement, preserve context needed for local applicability
          and transferability, including geography, population vulnerability,
          setting, and implementation constraints when relevant"
        - "During refinement, push the user to operationalize key concepts
          clearly enough that inclusion, exclusion, and synthesis decisions can
          be explained and justified" # "Equity relevance: ensure the question captures equity-relevant groups, settings, or access barriers when they may shape differential impacts or intervention feasibility in climate-health emergencies"
        - "During refinement, probe for equity-relevant groups, settings, or
          access barriers when they may shape differential impacts or
          intervention feasibility" # "Some questions can be too broad, too heterogeneous, or too weakly specified. This guardrail tells the model to catch that before starting the evidence retrieval and synthesis process where stakes are higher and course correction is more difficult"
        - "During refinement, flag combinations that are too broad,
          incomparable, or weakly specified to support coherent synthesis,
          critical appraisal, or communication of uncertainty and caveats"
  - id: population
    name: Population
    description: The group of individuals or entities that are being studied
    depends_on:
      - condition
      - context
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    specifications: |
      **Task:** Evaluate and assemble population specification, including its size, demographic characteristics, and any other relevant factors.

      **Elements to track:**
      - Age (range, category, or life stage)
      - Sex/gender (if relevant to the health issue or explicitly mentioned)
      - Ethnicity/race (if relevant to health disparities or explicitly mentioned)
      - Relevant subgroup characteristics: roles (e.g., healthcare workers, parents, teachers, students, caregivers), affiliations (e.g., military veterans, union members), socioeconomic markers (e.g., low-income, uninsured, educational attainment), pregnancy/reproductive status, occupational categories, insurance status

      **Required:**
      - At least confirm whether "all populations" or limited to specific demographics
      - Age specification if topic is age-dependent

      **Not required unless relevant:**
      - Ethnicity/race specification (only if health disparities focus or explicitly mentioned)
      - All elements (partial is acceptable if user confirms scope)

      **Age standardization:**
      When assembling, standardize age terms:
      - "kids" → "children (2-12 years)"
      - "elderly" → "older adults (65+ years)"
      - Non-standard range → prepend "approximately"
    examples:
      clear:
        - statement: Efficacy of metformin in adults aged 40-65 with type 2 diabetes
          rationale: Age (40-65) specified, with all-inclusive gender and ethnicity
            (adults)
        - statement: Postmenopausal women under 65 in urban clinical settings
          rationale: clearly described age (postmenopausal under 65), gender (women)
        - statement: Black males aged 18-45 with hypertension in community health centers
          rationale: clearly defined age (18-45), gender (males), ethnicity (Black)
      needs_refinement:
        - statement: The effect of exercise on depression
          issue: Zero demographics specified; too broad
          missing: Age, gender at minimum
          example_question: "You are including all ages, genders, ethnicities. Is that
            correct or do you want to limit to any specific age range,
            sex/gender, and/or ethnicity/race?"
      partial:
        - statement: Women over 40 with cardiovascular disease
          has: Gender (women) and minimum age (40)
          missing: ethnicity if CVD disparities relevant
          example_question: "Are you focusing on specific ethnic groups given CVD disparities?"
      vague_ambiguous:
        - statement: Treatment outcomes in minority populations aged 65 and older in
            tertiary care hospitals
          issue: "'Minority populations' is vague and could mean multiple groups"
          missing: precise ethnicity/race; maybe gender as well
          example_question: "Which specific population groups are you focusing on? (e.g.,
            Hispanic/Latino, African American, Asian, Native American). Do you
            have any specifications regarding gender?"
  - id: Condition
    name: condition
    description: The health condition, disease, symptom, problem or social issue
      being studied, including how it is measured or diagnosed.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    specifications: |
      **Task:** Evaluate and assemble the condition specifications, including its definition, symptoms and causes.

      **Elements to track:**
      - the health condition, disease, symptom, problem, or social issue being studied
      - diagnostic terms, synonyms, lay terms, and related symptom clusters.

      **Required:**
      - At least one condition or problem specified with some level of detail (e.g., "diabetes" is too broad, "type 2 diabetes" is better, "newly diagnosed type 2 diabetes in adults aged 40-65" is even better)

      **Required if applicable:**
      - symptoms: if the condition is defined by a symptom cluster or if the user is interested in symptom management rather than disease modification
      - diagnostic criteria: if the condition is defined by specific diagnostic criteria or if the user is interested in diagnostic accuracy or case identification
      - causes: if the user is interested in prevention or if the condition is defined by specific causes (e.g., "smoking-related lung disease")
    examples:
      clear:
        - statement: newly diagnosed type 2 diabetes in adults aged 40-65
          rationale: Specific condition (type 2 diabetes), with relevant diagnostic
            qualifier (newly diagnosed) and population (adults aged 40-65)
      needs_refinement:
        - statement: "diabetes"
          issue: Too broad - includes multiple types with different etiologies,
            treatments, and outcomes
          missing: Type specification (type 1, type 2, gestational, etc.), diagnostic
            criteria, symptomatology if relevant
          example_question: "Diabetes is a broad term that can refer to several different
            conditions. Are you focusing on a specific type of diabetes (e.g.,
            type 1, type 2, gestational)? Are there specific diagnostic criteria
            or symptoms that are relevant to your question?"
      partial:
        - statement: Depression in adults
          has: Condition category (depression), population (adults)
          missing: Subtype (major depressive disorder, persistent depressive disorder,
            bipolar depression), severity, diagnostic criteria used
          example_question: Are you focusing on a specific type of depression (e.g., major
            depressive disorder, persistent depressive disorder)? Should a
            particular diagnostic criteria set be applied (e.g., DSM-5, ICD-11)?
        - statement: Respiratory disease in children
          has: Body system (respiratory) and population (children)
          missing: Specific condition (asthma, bronchiolitis, pneumonia, COPD), severity
            classification, diagnostic criteria
          example_question: Which respiratory condition are you studying? (e.g., asthma,
            bronchiolitis, community-acquired pneumonia) Are there specific
            severity or diagnostic criteria that should apply?
      vague_ambiguous:
        - statement: Patients with chronic conditions
          issue: Umbrella term with no specific condition identified; encompasses hundreds
            of unrelated diseases
          missing: Named condition or disease category
          example_question: Which specific chronic condition(s) are you studying? (e.g.,
            type 2 diabetes, hypertension, COPD, chronic kidney disease)
        - statement: Mental health problems
          issue: Umbrella term covering dozens of distinct disorders with different
            etiologies, treatments, and outcomes
          missing: Specific disorder, diagnostic criteria or symptom cluster
          example_question: Which mental health disorder(s) are you focusing on? (e.g.,
            major depressive disorder, generalised anxiety disorder, PTSD,
            schizophrenia)
        - statement: Severe disease
          issue: "'Severe' is both unspecified and relative — no condition is named and no
            severity threshold is defined"
          missing: Condition name, severity definition or diagnostic threshold
          example_question: What condition are you studying? How is 'severe' defined in
            your context? (e.g., hospitalisation required, specific score
            threshold, organ involvement)
  - id: context
    name: Context
    description: the setting or environment in which the condition occurs, and can
      include factors such as cultural, social, economic, and political
      influences, as well as physical and environmental conditions.
    strictness: MODERATE #(MODERATE | PERMISSIVE |  STRICT)
    depends_on:
      - condition
    specifications: |
      **Task:** Evaluate and assemble the contextual setting in which the condition occurs and in which any response or intervention would be implemented.

      **Elements to track:**
      - Geographic setting: country, region, or sub-national area (e.g., Sahel, Pacific Island states, peri-urban Bangladesh)
      - Urban/rural classification (urban, peri-urban, rural, remote)
      - Income or resource setting: World Bank income group (low, lower-middle, upper-middle, high) or explicit resource-availability descriptor (e.g., resource-limited, humanitarian field setting)
      - Health system level and capacity: primary care, district hospital, tertiary referral, community health worker-based, fragile or disrupted health system
      - Socioeconomic and political context: conflict-affected, fragile state, post-disaster, displacement camp, food-insecure region
      - Environmental or climate setting: drought-prone, flood-prone, high-altitude, coastal/island, heat-stressed urban environment
      - Cultural or social context (only if directly shaping condition manifestation, care-seeking, or intervention feasibility)
      - Temporal context: acute emergency phase, recovery phase, seasonal window (e.g., monsoon season, lean season)

      **Required:**
      - At least one contextual dimension that anchors where the condition occurs or where evidence should be applicable

      **Not required unless relevant:**
      - All dimensions (a single well-specified dimension is sufficient to accept the element)
      - Cultural context (only prompt if directly relevant to the condition or intervention)

      **Specificity guidance:**
      - Prefer named geographies over vague regional terms when the user's question implies a specific setting
      - Standardize income/resource descriptors: "poor countries" → "low- and middle-income countries (LMICs)"; "rich countries" → "high-income countries"
      - Flag when a stated context is so heterogeneous it would preclude coherent synthesis (e.g., "global" or "all developing countries" without further constraint)
    examples:
      clear:
        - statement: Rural primary care settings in sub-Saharan Africa during recurrent
            drought seasons
          rationale: Geography (sub-Saharan Africa), urbanicity (rural), health system
            level (primary care), and temporal/climate setting (recurrent
            drought seasons) all specified
        - statement: Displacement camps in conflict-affected northern Syria, operating
            under disrupted cold-chain conditions
          rationale: Geography (northern Syria), political context (conflict-affected),
            health system context (disrupted cold-chain), and implementation
            constraint all explicit
      needs_refinement:
        - statement: Health outcomes in developing countries
          issue: "No geographic anchor; 'developing countries' spans vastly different
            epidemiological, health-system, and climate contexts"
          missing: Region or country group, income classification, health system level
          example_question: "Which region or country group are you focusing on? (e.g.,
            sub-Saharan Africa, South Asia, Pacific Island states) What health
            system level is relevant? (e.g., primary care, community level,
            hospital)"
      partial:
        - statement: Low-income settings in Asia
          has: Income setting (low-income), broad geography (Asia)
          missing: Sub-region or country specification, urban/rural classification, health
            system level
          example_question: Which part of Asia? (e.g., South Asia, Southeast Asia, Central
            Asia) Are you focusing on urban, rural, or both? What health system
            level is relevant?
        - statement: Post-disaster communities
          has: Temporal/political context (post-disaster)
          missing: Geographic region, type of disaster, health system capacity
          example_question: Which region or country are you focusing on? What type of
            disaster? (e.g., cyclone, flood, earthquake) What health system
            capacity is assumed? (e.g., functional primary care, humanitarian
            field operations)
      vague_ambiguous:
        - statement: Resource-limited settings
          issue: "'Resource-limited' is relative and context-dependent — it provides no
            geographic anchor and spans primary care to field hospitals"
          missing: Geographic region, specific resource constraint (e.g., no laboratory
            capacity, limited cold chain, shortage of trained staff), health
            system level
          example_question: Where specifically? (e.g., rural West Africa, peri-urban South
            Asia) What resource constraint matters most for your question?
            (e.g., laboratory access, cold-chain reliability, health worker
            availability)
        - statement: Tropical regions
          issue: Vast and epidemiologically heterogeneous; encompasses high-income
            Singapore and fragile-state contexts equally
          missing: Specific country or sub-region, income/resource setting, urban or rural
            classification
          example_question: Which tropical setting are you interested in? (e.g., island
            states in the Pacific, the Sahel, lowland South America) Is the
            focus on high-income, middle-income, or low-income countries within
            that region?
