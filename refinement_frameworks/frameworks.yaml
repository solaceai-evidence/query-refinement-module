cocopop:
  - user_context:
      user_type: "policy maker, humanitarian practitioner, health professional, or researcher working on climate-health emergencies"
      context: "Refine climate-health review questions across condition, context, and population. Keep the user's stated scope unchanged; later search expansion can broaden retrieval."
      tone: "pragmatic"
      complexity: "advanced"
      examples_from: "climate-health evidence retrieval"
  - id: condition
    name: Condition
    description: "The health condition, disease, symptom cluster, public-health problem, or social issue under study."
    specifications: |
      **Complete when:**
      - A named condition, disease, symptom cluster, condition family, or public-health problem is stated.
      - Broad but coherent condition families such as "diabetes", "waterborne diseases", or "mental health impacts" are acceptable as stated.
      - Keep stated condition qualifiers that are part of the condition itself, such as complications, acute/chronic form, or climate linkage.

      **Ask only when:**
      - No condition or condition family is stated.
      - The wording is too vague to search, such as "health impacts", "illness", or "problems" alone.
      - Multiple unrelated condition families are named and no primary focus is clear.
      - The condition wording itself is ambiguous.

      **Output rule:** Keep only the condition in `current`.
      - Remove people-group, place, and service-setting wording unless it is part of the condition name.
    examples:
      clear:
        - statement: "Waterborne diseases following flooding"
          rationale: The condition family is explicit.
        - statement: "Diabetes during extreme heat"
          rationale: The diagnosis is clear enough as stated.
      needs_refinement:
        - statement: "Health impacts of sea-level rise"
          issue: No condition is named.
          example_question: "Which health condition or condition family should the review focus on?"
        - statement: "Illness after climate shocks"
          issue: The condition wording is too vague.
          example_question: "Which condition or condition family do you mean?"
      ambiguous:
        - statement: "Heat illness and waterborne disease after flooding"
          issue: Two unrelated condition families are named without a primary focus.
          example_question: "Which condition family is the main focus of the review?"
      other:
        - statement: "Diabetes complications in pregnant women during heatwaves"
          guidance: "Return `diabetes complications during heatwaves`. Do not copy `pregnant women` into the condition."
  - id: context
    name: Context
    description: "The geographic, environmental, emergency, or implementation setting in which the condition occurs."
    depends_on:
      - condition
    specifications: |
      **Complete when:**
      - A geography or setting anchor is stated.
      - Broad, narrow, and hyperlocal settings are all acceptable when clearly stated.
      - Environmental, emergency, and implementation settings are acceptable when explicitly named.

      **Ask only when:**
      - No usable geographic or setting anchor is present.
      - The setting wording is ambiguous, such as "affected areas" or "the region" without an anchor.
      - An implementation or delivery setting is clearly central but not specified.

      **Standardization:**
      - "poor countries" -> "low- and middle-income countries (LMICs)"
      - "rich countries" -> "high-income countries"

      **Output rule:** Use the shortest faithful setting phrase.
    examples:
      clear:
        - statement: "Rohingya camps in Cox's Bazar district, Bangladesh"
          rationale: The geography and setting are explicit.
        - statement: "Flood-affected districts in Bangladesh"
          rationale: The context is explicit as stated.
      needs_refinement:
        - statement: "Affected areas"
          issue: No usable setting anchor is provided.
          example_question: "Which country, region, or setting should the review focus on?"
      partial:
        - statement: "Flood-affected districts in Bangladesh considering vaccine delivery"
          has: "geography"
          missing: "the delivery setting is central but unspecified"
          example_question: "Which delivery setting is relevant, for example community outreach, primary care clinics, district hospitals, or mobile teams?"

  - id: population
    name: Population
    description: "The people or groups whose health outcomes, risks, or service needs are the focus of the question."
    depends_on:
      - condition
      - context
    specifications: |
      **Complete when:**
      - A population group is stated.
      - Broad groups such as "adults", "children", or "displaced populations" are acceptable when clear.
      - Narrow groups are acceptable when clearly stated.

      **Ask only when:**
      - No usable population is present.
      - The wording is too generic to identify a group, such as "people" or "communities" without an anchor.
      - Multiple unrelated populations are named and no primary focus is clear.
      - The wording indicates an age, pregnancy, occupation, or vulnerability-defined group but the group itself is unclear.

      **Standardization:**
      - "kids" -> "children"
      - "elderly" -> "older adults"

      **Output rule:** Use the shortest faithful population phrase. Omit unstated details.
    examples:
      clear:
        - statement: "Pregnant women attending one maternity post in Rohingya camps in Cox's Bazar"
          rationale: The target group is explicit.
        - statement: "Children under 5 years in drought-affected households"
          rationale: The population is explicit as stated.
      needs_refinement:
        - statement: "People"
          issue: No meaningful population group is provided.
          example_question: "Which population group should the review focus on?"
      partial:
        - statement: "People affected by neonatal mortality after extreme heat"
          has: "a generic population placeholder"
          missing: "the target group is still unclear"
          example_question: "Which population should the review focus on, for example newborns, pregnant women, or households with newborns?"
