# Ollama provider preset
# ─────────────────────────────────────────────────────────────────────────────
# To activate:  add  LLM_PROVIDER_PRESET=ollama  to your .env
# Also set:     LLM_MODEL=ollama/<model-name>   (e.g. ollama/qwen2.5:72b)
#
# Values here are applied as env-var defaults — any matching variable already
# set in your shell or .env file takes priority.

# ── API base URL ──────────────────────────────────────────────────────────────
# Default for local Ollama. Change to your host if running on another machine.
LLM_API_BASE: "http://localhost:11434"

# ── Concurrency ───────────────────────────────────────────────────────────────
# One concurrent request avoids overloading a single local GPU.
LLM_PROVIDER_MAX_CONCURRENT: "1"

# ── Rate limits ───────────────────────────────────────────────────────────────
# Self-hosted — no external rate limits enforced.
LLM_PROVIDER_RATE_LIMIT_RPM: "0"

# ── Context window ────────────────────────────────────────────────────────────
# Sets Ollama's num_ctx (default on the Ollama server is only 2 048).
# If the value exceeds the model's native context, Ollama silently caps it —
# so this is safe to leave at 16 384 for any modern model (Qwen 2.5, Llama 3,
# Mistral, etc. all support ≥ 32 K natively). Only uncomment to go higher if
# your framework files are very large and the model supports it.
# LLM_CONTEXT_WINDOW: "32768"

# ── Max output tokens ─────────────────────────────────────────────────────────
# Code default is 4 096 tokens — sufficient for refinement queries + examples.
# Uncomment only if you extend the system to produce very long structured outputs.
# LLM_MAX_OUTPUT_TOKENS: "8192"
