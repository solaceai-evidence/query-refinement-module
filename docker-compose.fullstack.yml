version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: query-refinement-postgres
    environment:
      POSTGRES_USER: query_user
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: query_refinement_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U query_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - query-refinement-net

  # Redis for sessions and rate limiting
  redis:
    image: redis:7-alpine
    container_name: query-refinement-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - query-refinement-net

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query-refinement-backend
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./examples:/app/examples:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - query-refinement-net
    restart: unless-stopped

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: query-refinement-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - query-refinement-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  query-refinement-net:
    driver: bridge
