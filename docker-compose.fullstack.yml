services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: query-refinement-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-query_refinement}
      POSTGRES_USER: ${POSTGRES_USER:-qruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qruser} -d ${POSTGRES_DB:-query_refinement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - query-refinement-net

  # Redis for sessions and rate limiting
  redis:
    image: redis:7-alpine
    container_name: query-refinement-redis
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - query-refinement-net

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query-refinement-backend
    env_file:
      - .env
    environment:
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qruser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-query_refinement}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./refinement_frameworks:/app/refinement_frameworks:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        python3 -m alembic upgrade head &&
        echo 'Starting application...' &&
        python3 -m gunicorn -c gunicorn_conf.py query_refinement_module.api.main:app
      "
    networks:
      query-refinement-net:
        aliases:
          - api
    restart: unless-stopped

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: query-refinement-frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - query-refinement-net
    restart: unless-stopped

networks:
  query-refinement-net:
    driver: bridge
