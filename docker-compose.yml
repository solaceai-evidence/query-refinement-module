# Docker Compose configuration for Query Refinement API
#
# 
# Production usage:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: query-refinement-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-query_refinement}
      POSTGRES_USER: ${POSTGRES_USER:-qruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qruser} -d ${POSTGRES_DB:-query_refinement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - query-refinement-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: query-refinement-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - query-refinement-network
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query-refinement-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Database (PostgreSQL)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qruser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-query_refinement}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30.0}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_STORAGE_BACKEND: redis
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-10800}
      RATE_LIMITER_BACKEND: redis
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      INTEGRATION_SERVICE_USERNAME: ${INTEGRATION_SERVICE_USERNAME:-api_integration_service}
      
      # CORS (comma-separated origins)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      
      # LLM Configuration
      REFINEMENT_FRAMEWORK_PATH: ${REFINEMENT_FRAMEWORK_PATH:-/app/refinement_frameworks/frameworks.yaml}
      QUERY_REFINEMENT_LLM_MODEL: ${QUERY_REFINEMENT_LLM_MODEL:-anthropic/claude-sonnet-4-6}
      QUERY_REFINEMENT_LLM_API_KEY: ${QUERY_REFINEMENT_LLM_API_KEY}
      QUERY_REFINEMENT_LLM_TEMPERATURE: ${QUERY_REFINEMENT_LLM_TEMPERATURE:-0.2}
      
      # Async Architecture - LLM Concurrency (50 concurrent calls with semaphore)
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-50}
      LLM_CONNECTION_POOL_SIZE: ${LLM_CONNECTION_POOL_SIZE:-100}
      LLM_KEEPALIVE_CONNECTIONS: ${LLM_KEEPALIVE_CONNECTIONS:-50}
      
      # Rate Limiting
      LLM_RATE_LIMIT_RPM: ${LLM_RATE_LIMIT_RPM:-100}
      LLM_RATE_LIMIT_TPM: ${LLM_RATE_LIMIT_TPM:-40000}
      LLM_RATE_LIMIT_PER_USER_RPM: ${LLM_RATE_LIMIT_PER_USER_RPM:-4}
      LLM_MAX_CONCURRENT_PER_USER: ${LLM_MAX_CONCURRENT_PER_USER:-2}

      # Workflow policy
      ENFORCE_WORKFLOW_LIMIT: ${ENFORCE_WORKFLOW_LIMIT:-false}
      
      # Server
      WORKERS: ${WORKERS:-4}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-120}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./refinement_frameworks:/app/refinement_frameworks:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - query-refinement-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Run database migrations on startup
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        python3 -m alembic upgrade head &&
        echo 'Starting application...' &&
        python3 -m gunicorn -c gunicorn_conf.py query_refinement_module.api.main:app
      "

# Network for service communication
networks:
  query-refinement-network:
    driver: bridge
