## conda config: environment.yml
# Create a conda environment using this file with:
# conda env create -f environment.yml
# Then activate it with:
# conda activate query-refinement
#
# This project uses conda + poetry:
# - Conda manages Python version and system dependencies
# - Poetry manages Python packages (run: poetry install)
name: query-refinement
channels:
  - conda-forge
  - nodefaults # Disable default channels to avoid conflicts
dependencies:
  - tree # For visualizing directory structures
  - python>=3.12 # Specify Python version
  - pip>=24.0 # Use pip for package management within the conda environment
  - poetry>=1.7.0 # For managing Python dependencies
  - poetry-plugin-export # To export lock files if needed
  - redis # Redis for session management (can also use brew/apt)
  - nodejs>=20 # For frontend development
