name: Build and Package QueryRefine (macOS x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packaging/macos/**'
      - 'query_refinement_module/**'
      - 'pyproject.toml'
      - '.github/workflows/macos-x86_64.yml'

jobs:
  build-macos-x86_64:
    runs-on: macos-latest
    env:
      PYTHON_VERSION: '3.12'
      ARCH: 'x86_64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry env
        run: |
          poetry env use "${PYTHON_VERSION}"
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build QueryRefine (x86_64)
        run: |
          cd packaging/macos
          poetry run pyinstaller QueryRefine.spec --distpath dist/QueryRefine --workpath build/QueryRefine --clean

      - name: Verify anthropic_tokenizer.json is bundled
        run: |
          set -e
          if [ ! -d packaging/macos/dist/QueryRefine ]; then
            echo "Build output directory packaging/macos/dist/QueryRefine does not exist! Build may have failed."
            exit 1
          fi
          FOUND=$(find packaging/macos/dist/QueryRefine -name anthropic_tokenizer.json)
          if [ -z "$FOUND" ]; then
            echo "anthropic_tokenizer.json not found in any QueryRefine output!"
            exit 1
          fi
          echo "Found anthropic_tokenizer.json at: $FOUND"

      - name: Prepare release folder
        run: |
          mkdir -p release/macos/x86_64
          cp -R packaging/macos/dist/QueryRefine/QueryRefine release/macos/x86_64/
          cp README.md release/macos/x86_64/
          cp packaging/macos/sample_framework.yaml release/macos/x86_64/
          cp packaging/macos/sample.env release/macos/x86_64/
          cp packaging/macos/Run\ Query\ Refine.command release/macos/x86_64/
          cp packaging/macos/Configure\ Environment.command release/macos/x86_64/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryRefine-macos-x86_64
          path: release/macos/x86_64/
