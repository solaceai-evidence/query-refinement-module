name: Build macOS Package (x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packaging/macos/**'
      - 'query_refinement_module/**'
      - 'pyproject.toml'
      - '.github/workflows/build-macos-x86_64.yml'

jobs:
  build-x86_64:
    runs-on: macos-13  # Intel-based runner
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pip install pyinstaller

      - name: Build macOS executable (x86_64)
        run: |
          cd packaging/macos
          poetry run pyinstaller QueryRefine.spec --clean --target-arch x86_64

      - name: Verify build output
        run: |
          if [ ! -d "packaging/macos/dist/QueryRefine.app" ]; then
            echo "ERROR: Build failed - QueryRefine.app not found"
            exit 1
          fi
          echo "✓ Build successful"
          ls -la packaging/macos/dist/QueryRefine.app/Contents/MacOS/

      - name: Create distribution package
        run: |
          mkdir -p QueryRefine-x86_64
          cp -R packaging/macos/dist/QueryRefine.app QueryRefine-x86_64/
          cp packaging/macos/sample.env QueryRefine-x86_64/
          cp packaging/macos/sample_framework.yaml QueryRefine-x86_64/
          cp packaging/macos/Run\ Query\ Refine.command QueryRefine-x86_64/
          cp packaging/macos/Configure\ Environment.command QueryRefine-x86_64/
          chmod +x QueryRefine-x86_64/*.command
          
      - name: Create zip archive
        run: |
          ditto -c -k --keepParent QueryRefine-x86_64 QueryRefine-macOS-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryRefine-macOS-x86_64
          path: QueryRefine-macOS-x86_64.zip
          retention-days: 30
